ивание вероятностей","Probability weighting reflects overestimation of small probabilities and underestimation of moderate and large ones."],["certainty effect","эффект определённости","The certainty effect causes outcomes that are certain to be overweighted relative to merely probable ones."],["ambiguity aversion","неприятие неопределённости (неоднозначности)","Ambiguity aversion was demonstrated by a preference for known probabilities over unknown ones."],["decision under uncertainty","принятие решений в условиях неопределённости","Decision under uncertainty often relies on simplifying strategies rather than exhaustive probabilistic calculation."],["decision making","принятие решений","Research on decision making has increasingly integrated behavioral and neuroscientific methods."],["judgment and decision making","суждения и принятие решений","The field of judgment and decision making examines how people evaluate evidence and select among options."],["regret","сожаление","Anticipated regret influenced participants to avoid options whose unfavorable outcomes could be attributed to their own choice."],["choice overload","избыток выбора","Choice overload decreased satisfaction and purchase rates when an extensive assortment was presented."],["need for cognition","потребность в познании","Individuals high in need for cognition engage in effortful analytic thinking more readily."],["actively open-minded thinking","активное открытое мышление","Actively open-minded thinking predicted greater willingness to revise beliefs in light of disconfirming evidence."],["crystallized intelligence","кристаллизованный интеллект","Crystallized intelligence reflects accumulated knowledge and verbal skills and remains stable into later adulthood."],["g factor","генеральный фактор интеллекта (g-фактор)","The g factor accounts for the positive correlations observed among diverse cognitive ability tests."],["intelligence quotient","коэффициент интеллекта (IQ)","The intelligence quotient is const knownBtn=id=>`<button class="btn kbtn" data-act="known" data-id="${esc(id)}" aria-pressed="${isKnown(id)}">Знаю</button>`;
const pillOf=id=>{const x=S.words[id];return isKnown(id)?'<span class="pill ok">знаю</span>':x?(x.s>=7?'<span class="pill ok">выучено</span>':'<span class="pill">шаг '+x.s+'/6</span>'):""};
function searchHtml(){const q=searchQ.trim().toLowerCase();if(q.length<2)return"";const res=[];
 allSets().forEach(s=>s.w.forEach((w,i)=>{const a=w[0].toLowerCase(),b=w[1].toLowerCase();if(a.includes(q)||b.includes(q))res.push({id:wid(s,i),w,s:s.n,r:a.startsWith(q)||b.startsWith(q)?0:1})}));
 res.sort((x,y)=>x.r-y.r);const n=res.length;
 return `<div class="card" style="display:grid;gap:12px"><span class="small muted">Найдено: ${n}${n>50?" (показаны первые 50)":""}</span>${res.slice(0,50).map(r=>`<div class="row" style="justify-content:space-between;flex-wrap:nowrap;align-items:flex-start"><div style="min-width:0"><b>${esc(r.w[0])}</b> — ${esc(r.w[1])} ${pillOf(r.id)}<div class="ex small">${esc(r.w[2]||"")}</div><span class="tag">${esc(r.s)}</span></div><div class="row" style="flex-wrap:nowrap">${spk(r.w[0])}${starBtn(r.id)}${knownBtn(r.id)}</div></div>`).join("")||'<span class="muted small">Ничего не найдено.</span>'}</div>`}
const STOP=new Set("a an the and or but if then so of to in on at by for with from as is are was were be been being am do does did have has had not no nor this that these those it its they them their we our you your he she his her him i me my what which who whom whose when where why how also than very can could may might must shall should will would about into over under between through during before after above below up down out off again further once only own same such too just more most other some any each few both all here there while because until against among within without per via et al fig table".split(" "));
const lemmas=t=>[t,t.replace(/s$/,""),t.replace(/es$/,""),t.replace(/ies$/,"y"),t.replace(/ed$/,""),t.replace(/ed$/,"e"),t.replace(/ied$/,"y"),t.replace(/ing$/,""),t.replace(/ing$/,"e"),t.replace(/ly$/,""),t.replace(/ness$/,""),t.replace(/er$/,"")];
function parseArticle(text){const sents=text.replace(/\s+/g," ").match(/[^.!?]+[.!?]*/g)||[],low=text.toLowerCase();
 const known=new Map();allSets().forEach(s=>s.w.forEach((w,i)=>{const k=w[0].toLowerCase();if(!known.has(k))known.set(k,{id:wid(s,i),en:w[0],ru:w[1],set:s.n})}));
 const found=new Map(),inPhrase=new Set();
 for(const[k,v]of known)if(k.includes(" ")&&new RegExp("(^|[^a-z])"+escRe(k)+"s?([^a-z]|$)").test(low)){found.set(k,v);k.split(/[\s-]+/).forEach(x=>inPhrase.add(x))}
 const unk=[];for(const t of new Set(low.match(/[a-z][a-z'-]+/g)||[])){if(t.length<3||STOP.has(t)||inPhrase.has(t))continue;
  const base=lemmas(t).find(c=>known.has(c)&&!c.includes(" "));if(base){found.set(base,known.get(base));continue}
  const ex=(sents.find(x=>new RegExp("\\b"+escRe(t)+"\\b","i").test(x))||"").trim();unk.push({en:t,ex,ru:"",pick:false})}
 return{found:[...found.values()],unk}}
const AI_OK=()=>isViewer();
function vArticle(){return `<section style="display:grid;gap:16px"><h2>Слова из статьи</h2>
 <p class="muted" style="margin:0">Вставьте аннотацию или абзац на английском. Сайт найдёт термины и слова, которые уже есть в ваших наборах, а новые предложит добавить в набор «Из статей» вместе с предложением из текста.</p>
 <div class="field"><label for="art-text">Текст статьи</label><textarea id="art-text" rows="8" placeholder="Вставьте текст на английском">${esc(art.text)}</textarea></div>
 <div class="row"><button class="btn primary" data-act="artparse">Разобрать текст</button><button class="btn" data-act="artclear">Очистить</button></div>
 <div id="art-res" style="display:grid;gap:16px">${art.res?artResult():""}</div></section>`}
function artResult(){const r=art.res;
 const fnd=r.found.map(f=>{const st=stageOf(f.id);return `<div class="row" style="justify-content:space-between;flex-wrap:nowrap;align-items:flex-start"><span style="min-width:0"><b>${esc(f.en)}</b> — ${esc(f.ru)} <span class="tag">${esc(f.set)}</span></span><span class="pill ${st==="done"?"ok":""}">${st==="new"?"не начато":st==="done"?"выучено":"в изучении"}</span></div>`}).join("");
 const unk=r.unk.slice(0,80).map((u,i)=>`<div class="row" style="flex-wrap:nowrap;align-items:flex-start;gap:10px"><input type="checkbox" id="ac${i}" data-i="${i}" ${u.pick?"checked":""} aria-label="Добавить слово ${esc(u.en)}" style="margin-top:12px"><div style="min-width:0;flex:1;display:grid;gap:6px"><div class="row"><b>${esc(u.en)}</b><a class="small" href="https://translate.yandex.ru/?source_lang=en&target_lang=ru&text=${encodeURIComponent(u.en)}" target="_blank" rel="noopener">найти перевод</a></div><input class="inp" style="font-size:1rem;text-align:left;padding:8px 10px" id="at${i}" data-i="${i}" placeholder="Перевод" aria-label="Перевод слова ${esc(u.en)}" value="${esc(u.ru||"")}"><div class="ex small">${esc(u.ex)}</div></div></div>`).join("");
 return `<div class="card" style="display:grid;gap:10px"><h3>Уже есть в ваших наборах: ${r.found.length}</h3>${fnd||'<span class="muted small">Совпадений нет.</span>'}</div>
 <div class="card" style="display:grid;gap:14px"><h3>Новые слова: ${r.unk.length}${r.unk.length>80?" (показаны первые 80)":""}</h3>
 <p class="muted small" style="margin:0">Впишите перевод у нужных слов и отметьте их галочкой. Пример берётся из вашего текста.</p>
 ${AI_OK()?`<div><button class="btn" data-act="artai" ${art.busy?"disabled":""}>${art.busy?"Claude переводит…":"Перевести слова с помощью Claude"}</button></div>`:""}
 ${unk||'<span class="muted small">Новых слов не найдено.</span>'}
 <div class="row"><button class="btn primary" data-act="artadd">Добавить отмеченные в набор «Из статей»</button><span id="artmsg" class="small muted" role="status">${esc(art.msg)}</span></div></div>`}
function artAct(a){
 if(a==="artparse"){const t=$("#art-text").value.trim();art.text=t;art.msg="";if(t.length<20){art.res=null;render();return true}art.res=parseArticle(t);render();return true}
 if(a==="artclear"){art={text:"",res:null,msg:"",busy:false};render();return true}
 if(a==="artadd"){const picks=art.res.unk.filter(u=>u.pick&&u.ru.trim());
  if(!picks.length){art.msg="Отметьте слова и впишите для них перевод.";const m=$("#artmsg");if(m)m.textContent=art.msg;return true}
  let set=S.custom.find(c=>c.id==="art");if(!set){set={id:"art",n:"Из статей",w:[]};S.custom.push(set)}
  let n=0;picks.forEach(u=>{if(!set.w.some(w=>w[0].toLowerCase()===u.en.toLowerCase())){set.w.push([u.en,u.ru.trim(),u.ex]);n++}});
  art.res.unk=art.res.unk.filter(u=>!(u.pick&&u.ru.trim()));art.msg="Добавлено слов: "+n+". Набор «Из статей» появился в разделе «Наборы».";save();render();return true}
 if(a==="artai"){translateWithClaude();return true}
 return false}
async function translateWithClaude(){const items=art.res.unk.slice(0,40).filter(u=>!u.ru);if(!items.length||art.busy)return;
 art.busy=true;art.msg="";render();
 try{const sample=await window.claude.use("sample");if(!sample)throw{code:"unavailable"};
  const prompt="Переведи английские слова на русский так, как они употребляются в приведённом предложении (научный текст по психологии и когнитивной науке). Для каждого слова дай один краткий перевод (1-3 слова) в начальной форме, принятым научным термином, если это термин. Верни только JSON-массив строк той же длины и в том же порядке, без пояснений.\n\n"+JSON.stringify(items.map(u=>({word:u.en,sentence:u.ex})));
  const out=await sample.json(prompt,{modelTier:"quick"});
  if(!Array.isArray(out))throw{code:"format"};items.forEach((u,i)=>{if(typeof out[i]==="string"&&out[i].trim()){u.ru=out[i].trim();u.pick=true}});
  art.msg="Переводы подставлены. Проверьте их перед добавлением."}
 catch(e){art.msg=e&&e.code==="not_granted"?"Доступ к Claude не разрешён. Впишите переводы вручную.":"Не удалось получить переводы. Впишите их вручную."}
 art.busy=false;render()}
function articleAct(a){return artAct(a)}
document.addEventListener("input",e=>{const t=e.target;
 if(t.id==="q"){searchQ=t.value;const r=$("#sres");if(r)r.innerHTML=searchHtml()}
 else if(t.id==="art-text")art.text=t.value;
 else if(t.id&&t.id.startsWith("at")&&art.res&&t.dataset.i!=null){const u=art.res.unk[+t.dataset.i];if(u){u.ru=t.value;if(t.value.trim()&&!u.pick){u.pick=true;const c=$("#ac"+t.dataset.i);if(c)c.checked=true}}}});
document.addEventListener("change",e=>{const t=e.target;if(t.id&&t.id.startsWith("ac")&&art.res&&t.dataset.i!=null){const u=art.res.unk[+t.dataset.i];if(u)u.pick=t.checked}});
let armReset=false;
function quit(){sess=null;$("#study").hidden=true;document.body.style.overflow="";render()}
function pairClick(id,side){const c=sess.cur;if(!c||c.done[id])return;
 if(!c.sel||c.sel.side===side){c.sel={id,side};drawStudy();return}
 if(c.sel.id===id){c.done[id]=true;const ok=!c.miss[id];if(ok)sess.ok++;else sess.bad.push(id);grade(id,ok,false);c.sel=null;drawStudy();
  if(c.items.every(w=>c.done[w.id])){sess.i+=5;setTimeout(()=>{if(sess){nextQ();drawStudy()}},450)}}
 else{c.miss[c.sel.id]=true;c.miss[id]=true;c.flash=id+side;c.sel=null;drawStudy();setTimeout(()=>{if(sess&&sess.cur===c){c.flash=null;drawStudy()}},500)}}
function addSet(){const name=$("#cn").value.trim(),w=[];
 $("#cw").value.split("\n").forEach(l=>{const p=l.split(/\s[-—–]\s|\t|;/).map(x=>x.trim());if(p[0]&&p[1])w.push([p[0],p[1],p[2]||""])});
 if(!name||!w.length){$("#cmsg").textContent="Укажите название и хотя бы одно слово в формате «слово - перевод».";return}
 S.custom.push({id:"c"+Date.now(),n:name,w});save();filter="custom";render()}
document.addEventListener("click",e=>{
 const nb=e.target.closest("#nav button");if(nb){view=nb.dataset.v;openSet=null;location.hash=view;render();scrollTo(0,0);return}
 const b=e.target.closest("[data-act]");if(!b)return;const a=b.dataset.act,c=sess&&sess.cur;
 switch(a){
 case"open":openSet=b.dataset.id;view="sets";render();scrollTo(0,0);break;
 case"back":openSet=null;render();break;
 case"filter":filter=b.dataset.f;render();break;
 case"start":start(b.dataset.m,idsOf(getSet(openSet)));break;
 case"review":start("review",dueIds());break;
 case"say":speak(b.dataset.t);break;
 case"addset":addSet();break;
 case"delset":{const id=b.dataset.id;S.custom=S.custom.filter(x=>x.id!==id);Object.keys(S.words).forEach(k=>{if(k.startsWith(id+":"))delete S.words[k]});openSet=null;save();render();break}
 case"reset":if(!armReset){armReset=true;b.textContent="Нажмите ещё раз";setTimeout(()=>{armReset=false;if(b.isConnected)b.textContent="Сбросить прогресс"},4000)}else{armReset=false;S.words={};S.log={};S.known={};S.epoch=(S.epoch||0)+1;save();render()}break;
 case"flip":if(c){c.flip=true;drawStudy()}break;
 case"rate":rateCard(b.dataset.q);break;
 case"fav":{const id=b.dataset.id;if(S.fav[id])delete S.fav[id];else S.fav[id]=true;save();if(sess)drawStudy();else render();break}
 case"known":{const id=b.dataset.id;setKnown(id,!isKnown(id));render();break}
 case"mark":markKnown(b.dataset.v==="1");break;
 case"skipknown":skipKnown();break;
 case"bulk":{const k=b.dataset.k;if(armBulk!==k){armBulk=k;const t=b.textContent;b.textContent="Нажмите ещё раз";setTimeout(()=>{if(armBulk===k){armBulk="";if(b.isConnected)b.textContent=t}},4000);break}armBulk="";const ids=idsOf(getSet(openSet));if(k==="new")ids.forEach(i=>{if(!S.words[i]&&!isKnown(i))setKnown(i,true)});else ids.forEach(i=>{if(isKnown(i))setKnown(i,false)});render();break}
 case"more":{const l=S.log[dkey()]||(S.log[dkey()]={n:0,ok:0});l.extra=(l.extra||0)+10;flash="";save();render();break}
 case"pick":c.pick=+b.dataset.i;answer(c.opts[c.pick].ok?"ok":"bad");break;
 case"check":checkAns();break;
 case"hint":c.val=$("#ans").value;c.hint=c.type==="cloze"?"Начальная форма: "+c.w.en:c.w.en.replace(/[^ ]/g,(ch,i)=>i?"•":ch);drawStudy();break;
 case"next":advance();break;
 case"retry":start(sess.mode==="review"?"choice":sess.mode,sess.bad);break;
 case"quit":quit();break;
 case"pp":pairClick(b.dataset.id,b.dataset.s);break;
 default:if(!articleAct(a,b))extraAct(a)}});
document.addEventListener("change",e=>{if(e.target.dataset.act==="goal"){S.goal=+e.target.value;save();render()}if(e.target.dataset.act==="newlimit"){S.newLimit=+e.target.value;save();render()}});
document.addEventListener("keydown",e=>{if(!sess||$("#study").hidden)return;const c=sess.cur;if(!c||e.target.tagName==="BUTTON")return;
 if(e.key==="Escape"){quit();return}
 if(c.type==="choice"&&!c.answered&&/^[1-4]$/.test(e.key)&&c.opts[+e.key-1]){c.pick=+e.key-1;answer(c.opts[c.pick].ok?"ok":"bad");return}
 if(c.type==="known"&&/^[12]$/.test(e.key)){markKnown(e.key==="1");return}
 if(c.type==="cards"&&c.flip&&/^[1-4]$/.test(e.key)){rateCard(["again","hard","good","easy"][+e.key-1]);return}
 if(e.key==="Enter"){e.preventDefault();if(c.answered)advance();else if(c.type==="write"||c.type==="listen"||c.type==="cloze"){checkAns()}else if((c.type==="cards"||c.type==="known")&&!c.flip){c.flip=true;drawStudy()}}});
$("#theme").onclick=()=>{const d=document.documentElement,cur=d.dataset.theme||(matchMedia("(prefers-color-scheme:dark)").matches?"dark":"light"),n=cur==="dark"?"light":"dark";d.dataset.theme=n;try{localStorage.setItem("wc-theme",n)}catch(e){}};
try{const t=localStorage.getItem("wc-theme");if(t)document.documentElement.dataset.theme=t}catch(e){}
const h=location.hash.slice(1);if(["home","sets","stats","article"].includes(h))view=h;
window.addEventListener("hashchange",()=>{const h=location.hash.slice(1);if(["home","sets","stats","article"].includes(h)&&!sess){view=h;openSet=null;render()}});
render();
(async()=>{try{const c=window.claude;if(!c||!c.use)return;const[db,user]=await Promise.all([c.use("db"),c.use("user")]);if(!db||!user)return;const id=await user.id();if(!id)return;
 const ref=db.doc("data/users/"+id+"/profile"),snap=await ref.get();dbRef=ref;
 if(snap.exists){const r=JSON.parse(snap.data().json);if(r.t>S.t){S=Object.assign({words:{},custom:[],log:{},goal:20,newLimit:15,fav:{},known:{},t:0},r);try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}if(!sess)render()}}
 else if(S.t)save()}catch(e){}})();
</script>
