"},{"q":"\"Shall I open the window?\" \"I'd rather you ___ it closed.\"","a":"kept","o":["keep","to keep","keeping","kept"],"t":"«Открыть окно?» «Я бы предпочёл, чтобы ты оставил его закрытым.»","e":"Would rather + другое лицо: Past Simple (kept)."},{"q":"It's about time you ___ looking for a job.","a":"started","o":["start","will start","starting","started"],"t":"Тебе давно пора начать искать работу.","e":"It's about time + Past Simple выражает, что действие давно пора."},{"q":"She'd rather you ___ her about it earlier.","a":"had told","o":["told","would tell","tell","had told"],"t":"Она бы предпочла, чтобы ты рассказал ей об этом раньше.","e":"Сожаление о прошлом с would rather: Past Perfect."},{"q":"I wish it ___ sunny today, then we could go to the beach.","a":"were / was","o":["were","is","will be","had been"],"t":"Хотел бы я, чтобы сегодня было солнечно, тогда мы могли бы пойти на пляж.","e":"Нереальное настоящее: wish + Past Simple (were)."},{"q":"They live in a tiny flat, and they wish they ___ in a bigger one.","a":"lived","o":["live","would live","had lived","lived"],"t":"Они живут в крошечной квартире и хотели бы жить в большей.","e":"Сожаление о настоящем: wish + Past Simple."},{"q":"Tom would rather ___ tennis than football.","a":"play","o":["to play","playing","played","play"],"t":"Том предпочёл бы играть в теннис, а не в футбол.","e":"После would rather идёт инфинитив без to."}]},{"id":"b2-past-perfect-continuous","level":"B2","title":"Past Perfect и Past Perfect Continuous","summary":"Что было раньше другого события в прошлом","rule":"<p><b>Past Perfect</b> (had + V3) показывает действие, которое завершилось <b>раньше</b> другого события или момента в прошлом.</p><p><b>Past Perfect Continuous</b> (had been + V-ing) подчёркивает длительность действия до этого момента или его видимый результат.</p><table><tr><th>Время</th><th>Пример</th></tr><tr><td>Past Simple</td><td>The train left. — Поезд ушёл (событие).</td></tr><tr><td>Past Perfect</td><td>The train had left. — Поезд уже ушёл (раньше другого момента).</td></tr><tr><td>Past Perfect Continuous</td><td>I had been waiting for an hour. — Я ждал уже час.</td></tr></table><ul><li><i>When I arrived, the film had already started.</i> — Когда я пришёл, фильм уже начался.</li><li><i>She was exhausted because she had been working all day.</i> — Она была вымотана, потому что работала весь день.</li><li><i>I had never seen the sea before that trip.</i> — До той поездки я никогда не видел моря.</li><li><i>By the time he called, I had gone to bed.</i> — К тому моменту, как он позвонил, я уже лёг спать.</li></ul><p>Если события идут одно за другим, используем Past Simple: <i>I opened the door and the cat jumped out.</i> — Я открыл дверь, и кошка выскочила.</p><p><b>Частая ошибка:</b> использовать Past Simple для более раннего действия и Present Perfect в рассказе о прошлом: <i>When I came, he has left</i>. Нужно <i>he had left</i>.</p>","ex":[{"q":"When I arrived at the station, the train ___.","a":"had already left","o":["already left","was already leaving","has already left","had already left"],"t":"Когда я пришёл на станцию, поезд уже ушёл.","e":"Уход поезда произошёл раньше моего прихода: Past Perfect."},{"q":"She ___ for three hours when the power went out.","a":"had been working","o":["had been working","has been working","was worked","works"],"t":"Она работала уже три часа, когда отключили электричество.","e":"Длительное действие до момента в прошлом: Past Perfect Continuous."},{"q":"By the time the police came, the thieves ___.","a":"had escaped","o":["escape","has escaped","were escaping to","had escaped"],"t":"К моменту приезда полиции воры уже скрылись.","e":"By the time + Past Simple: более раннее действие в Past Perfect."},{"q":"I didn't recognise him because he ___ a lot of weight.","a":"had lost","o":["lost","was losing","has lost","had lost"],"t":"Я не узнал его, потому что он сильно похудел.","e":"Причина произошла до момента узнавания: Past Perfect."},{"q":"How long ___ waiting when the doctor finally called your name?","a":"had you been","o":["were you","have you been","did you","had you been"],"t":"Как долго вы ждали, когда врач наконец назвал ваше имя?","e":"Вопрос о длительности до момента в прошлом: had you been waiting."},{"q":"It ___ for days, so the ground was very wet.","a":"had been raining","o":["has been raining","rained","was rained","had been raining"],"t":"Дождь шёл уже несколько дней, поэтому земля была очень мокрой.","e":"Длительность до прошлого момента с видимым результатом: had been raining."},{"q":"She told me she ___ him before.","a":"had never met","o":["has never met","never meets","would never meet","had never met"],"t":"Она сказала мне, что никогда раньше не встречала его.","e":"Опыт до момента в прошлом: had never met."},{"q":"When we got to the cinema, the film ___.","a":"had already started","o":["has already started","was already start","already starts","had already started"],"t":"Когда мы пришли в кино, фильм уже начался.","e":"Начало фильма предшествовало нашему приходу: Past Perfect."},{"q":"I was sure I ___ my keys on the table, but they weren't there.","a":"had left","o":["have left","leave","was leaving","had left"],"t":"Я был уверен, что оставил ключи на столе, но их там не было.","e":"Действие раньше момента уверенности: had left."},{"q":"As soon as I opened the door, the cat ___ out.","a":"jumped","o":["had jumped","has jumped","jumps","jumped"],"t":"Как только я открыл дверь, кошка выскочила.","e":"События идут одно за другим: оба глагола в Past Simple."},{"q":"By the time he moved to Paris, he ___ in London for ten years.","a":"had lived / had been living","o":["had lived","lived","has lived","was living"],"t":"К моменту переезда в Париж он прожил в Лондоне десять лет.","e":"Период до прошлого момента: Past Perfect или Past Perfect Continuous."},{"q":"Until last week, I ___ never been on a plane.","a":"had","o":["have","was","did","had"],"t":"До прошлой недели я никогда не летал на самолёте.","e":"Конструкция had never been выражает опыт до момента в прошлом."},{"q":"Why were her shoes so dirty? She ___ in the garden.","a":"had been working","o":["has been working","have been working","is working","had been working"],"t":"Почему её туфли были такими грязными? Она работала в саду.","e":"Недавнее длительное действие объясняет прошлый результат: Past Perfect Continuous."},{"q":"He was out of breath because he ___.","a":"had been running","o":["has been running","was ran","runs","had been running"],"t":"Он запыхался, потому что бежал.","e":"Видимый результат в прошлом от длительного действия: had been running."},{"q":"The film ___ by the time we found our seats.","a":"had begun","o":["has begun","begins","was begun","had begun"],"t":"Фильм уже начался к тому времени, как мы нашли свои места.","e":"Более раннее действие относительно Past Simple (found): Past Perfect."}]},{"id":"b2-future-forms","level":"B2","title":"Формы будущего времени","summary":"will, going to, Present Continuous, Future Continuous, Future Perfect","rule":"<p>В английском есть несколько способов говорить о будущем, и выбор зависит от <b>намерения говорящего</b>.</p><table><tr><th>Форма</th><th>Когда используем</th><th>Пример</th></tr><tr><td>will + глагол</td><td>спонтанное решение, предсказание, обещание</td><td><i>I'll help you.</i></td></tr><tr><td>be going to</td><td>заранее принятый план; предсказание по видимым признакам</td><td><i>Look at those clouds! It's going to rain.</i></td></tr><tr><td>Present Continuous</td><td>личная договорённость, назначенная встреча</td><td><i>I'm meeting Anna at six.</i></td></tr><tr><td>Present Simple</td><td>расписание, график</td><td><i>The train leaves at 9.</i></td></tr><tr><td>Future Continuous (will be doing)</td><td>действие будет в процессе в конкретный момент</td><td><i>This time tomorrow I'll be flying to Rome.</i></td></tr><tr><td>Future Perfect (will have done)</td><td>действие завершится к определённому моменту</td><td><i>By Friday I'll have finished the report.</i></td></tr></table><p><b>Важно:</b> после союзов <i>when, as soon as, before, after, until, if</i> в придаточном предложении будущее не используется, вместо него Present Simple: <i>I'll call you when I arrive.</i> (не «when I will arrive»).</p><p>Также встречается <b>be about to</b> («вот-вот») и <b>be due to</b> («должен по графику»): <i>The film is about to start.</i></p><p><b>Частая ошибка:</b> использовать will для заранее решённого плана. Если билеты уже куплены, говорим <i>We are going to fly</i> или <i>We are flying</i>.</p>","ex":[{"q":"The phone is ringing. I ___ it.","a":"'ll get","o":["'ll get","'m getting","'m going to get","get"],"t":"Звонит телефон. Я возьму трубку.","e":"Спонтанное решение в момент речи выражаем с will."},{"q":"We have bought the tickets. We ___ to Italy in July.","a":"are going to fly","o":["are going to fly","will fly","fly shall","are flown"],"t":"Мы купили билеты. В июле мы собираемся лететь в Италию.","e":"Заранее принятый план: be going to."},{"q":"Look at that car! It ___ into the tree.","a":"is going to crash","o":["is going to crash","will crash","crashes","is crashing"],"t":"Смотри на ту машину! Она сейчас врежется в дерево.","e":"Предсказание по видимым признакам: be going to."},{"q":"I ___ the dentist at 4 p.m. tomorrow; I've already made an appointment.","a":"am seeing","o":["am seeing","will see","see","am going see"],"t":"Завтра в 4 часа я иду к стоматологу; я уже записался.","e":"Личная договорённость: Present Continuous."},{"q":"The film ___ at 8.15 tonight.","a":"starts","o":["starts","will be starting","is going start","is started"],"t":"Фильм начинается сегодня в 8.15.","e":"Расписание выражаем Present Simple."},{"q":"I'll phone you as soon as I ___ home.","a":"get","o":["get","will get","am going to get","will have got"],"t":"Я позвоню тебе, как только доберусь домой.","e":"После as soon as будущее заменяется Present Simple."},{"q":"This time next week I ___ on a beach in Greece.","a":"will be lying","o":["will be lying","will lie","am lying","will have lain"],"t":"В это время на следующей неделе я буду лежать на пляже в Греции.","e":"Действие в процессе в конкретный момент будущего: Future Continuous."},{"q":"By the end of this year she ___ here for ten years.","a":"will have worked","o":["will have worked","will be working","will work","is working"],"t":"К концу этого года она проработает здесь десять лет.","e":"Результат к определённому сроку: Future Perfect."},{"q":"Don't worry, I ___ you with your luggage.","a":"will help","o":["will help","am helping","help","have helped"],"t":"Не волнуйся, я помогу тебе с багажом.","e":"Предложение помощи в момент речи: will."},{"q":"Hurry up! The bus is ___ to leave.","a":"about","o":["about","going","due","likely"],"t":"Поторопись! Автобус вот-вот отправится.","e":"be about to + глагол значит «вот-вот»."},{"q":"If it ___ tomorrow, we'll stay at home.","a":"rains","o":["rains","will rain","is going to rain","would rain"],"t":"Если завтра пойдёт дождь, мы останемся дома.","e":"В условном придаточном будущее заменяется Present Simple."},{"q":"Don't call me at 7. I ___ dinner then.","a":"will be having","o":["will be having","will have","am having had","will have had"],"t":"Не звони мне в 7. Я буду ужинать.","e":"Процесс в конкретный момент будущего: Future Continuous."},{"q":"I think the Conservatives ___ the next election.","a":"will win","o":["will win","are winning","win","will be won"],"t":"Я думаю, консерваторы выиграют следующие выборы.","e":"Мнение-предсказание с I think: will."},{"q":"By the time you arrive, we ___ dinner.","a":"will have finished","o":["will have finished","will finish","are finishing","have finish"],"t":"К тому времени, как ты приедешь, мы закончим ужинать.","e":"Действие завершится до момента в будущем: Future Perfect."},{"q":"Wait here until the doctor ___ you.","a":"calls","o":["calls","will call","is going to call","will be calling"],"t":"Подождите здесь, пока врач вас не вызовет.","e":"После until будущее заменяется Present Simple."}]},{"id":"b2-gerund-infinitive-meaning","level":"B2","title":"Герундий и инфинитив: разница в значении","summary":"remember doing / to do, stop, try, regret, go on, mean","rule":"<p>Некоторые глаголы можно использовать и с герундием (<i>-ing</i>), и с инфинитивом (<i>to do</i>), но <b>значение меняется</b>.</p><table><tr><th>Глагол</th><th>+ герундий</th><th>+ инфинитив</th></tr><tr><td>remember</td><td>помнить, что сделал: <i>I remember locking the door.</i></td><td>не забыть сделать: <i>Remember to lock the door.</i></td></tr><tr><td>forget</td><td>забыть о прошлом факте: <i>I'll never forget meeting her.</i></td><td>забыть сделать: <i>I forgot to buy milk.</i></td></tr><tr><td>stop</td><td>прекратить действие: <i>He stopped smoking.</i></td><td>остановиться, чтобы сделать: <i>He stopped to smoke.</i></td></tr><tr><td>try</td><td>попробовать как эксперимент: <i>Try adding salt.</i></td><td>пытаться, прилагать усилие: <i>I tried to open the door.</i></td></tr><tr><td>regret</td><td>сожалеть о сделанном: <i>I regret telling her.</i></td><td>с сожалением сообщать: <i>We regret to inform you...</i></td></tr><tr><td>go on</td><td>продолжать то же: <i>She went on talking.</i></td><td>перейти к следующему: <i>He went on to become a doctor.</i></td></tr><tr><td>mean</td><td>влечь за собой: <i>This means working late.</i></td><td>намереваться: <i>I meant to call you.</i></td></tr></table><p><b>Только герундий</b> после: <i>enjoy, avoid, finish, mind, keep, consider, imagine, suggest, can't help</i>. <b>Только инфинитив</b> после: <i>decide, hope, manage, afford, refuse, promise, plan, learn</i>.</p><p><b>Без изменения смысла:</b> <i>begin, start, continue, like, love, hate, prefer</i> (<i>It started to rain / raining</i>). После предлога всегда герундий: <i>interested in learning</i>.</p><p><b>Частая ошибка:</b> «I stopped to smoke» вместо <i>I stopped smoking</i>, если вы бросили курить. Подумайте, что выражает вторая часть: цель (инфинитив) или само действие (герундий).</p>","ex":[{"q":"I remember ___ the door, so it can't be open.","a":"locking","o":["locking","to lock","lock","locked to"],"t":"Я помню, что запирал дверь, так что она не может быть открытой.","e":"Remember + герундий: помнить о прошлом действии."},{"q":"Remember ___ some milk on your way home.","a":"to buy","o":["to buy","buying","buy","bought"],"t":"Не забудь купить молока по дороге домой.","e":"Remember + инфинитив: не забыть сделать."},{"q":"He stopped ___ because it was bad for his health.","a":"smoking","o":["smoking","to smoke","smoke","to smoking"],"t":"Он бросил курить, потому что это вредно для здоровья.","e":"Stop + герундий: прекратить действие."},{"q":"We stopped ___ some petrol on the way.","a":"to buy","o":["to buy","buying","buy","bought"],"t":"Мы остановились, чтобы купить бензина по пути.","e":"Stop + инфинитив: остановиться ради цели."},{"q":"I tried ___ the window, but it was stuck.","a":"to open","o":["to open","opening","open","opened"],"t":"Я пытался открыть окно, но оно заклинило.","e":"Try + инфинитив: пытаться, но не получилось."},{"q":"If you have a headache, try ___ some water.","a":"drinking","o":["drinking","to drink","drink","drunk"],"t":"Если болит голова, попробуй выпить воды.","e":"Try + герундий: попробовать как способ решения."},{"q":"I regret ___ you that your application was unsuccessful.","a":"to tell","o":["to tell","telling","tell","told"],"t":"С сожалением сообщаю вам, что ваша заявка отклонена.","e":"Regret + инфинитив: с сожалением сообщать."},{"q":"I regret ___ him my secret. Now everyone knows.","a":"telling","o":["telling","to tell","tell","to telling"],"t":"Я жалею, что рассказал ему свой секрет. Теперь все знают.","e":"Regret + герундий: сожалеть о сделанном."},{"q":"I'm sorry, I forgot ___ your book. I'll bring it tomorrow.","a":"to bring","o":["to bring","bringing","bring","brought"],"t":"Извини, я забыл принести твою книгу. Принесу завтра.","e":"Forget + инфинитив: не выполнить действие."},{"q":"She enjoys ___ in the sea.","a":"swimming","o":["swimming","to swim","swim","swam"],"t":"Ей нравится плавать в море.","e":"После enjoy используется только герундий."},{"q":"They decided ___ a new house.","a":"to buy","o":["to buy","buying","buy","bought"],"t":"Они решили купить новый дом.","e":"После decide используется инфинитив."},{"q":"I'm not good at ___ decisions quickly.","a":"making","o":["making","to make","make","made"],"t":"Я не очень умею быстро принимать решения.","e":"После предлога at идёт герундий."},{"q":"This job will mean ___ at weekends.","a":"working","o":["working","to work","work","worked"],"t":"Эта работа будет означать работу по выходным.","e":"Mean в значении «влечь за собой» требует герундия."},{"q":"I'm sorry, I didn't mean ___ you.","a":"to upset","o":["to upset","upsetting","upset","upsets"],"t":"Прости, я не хотел тебя расстроить.","e":"Mean + инфинитив: намереваться."},{"q":"After finishing school, he went on ___ a lawyer.","a":"to become","o":["to become","becoming","become","became"],"t":"После школы он затем стал юристом.","e":"Go on + инфинитив: перейти к следующему действию."}]},{"id":"b2-linking-contrast","level":"B2","title":"Союзы противопоставления и уступки","summary":"although, despite, in spite of, however, whereas, even though","rule":"<p>Для выражения контраста в английском есть несколько групп слов, и у каждой свои грамматические требования.</p><table><tr><th>Слово</th><th>Что идёт после</th><th>Пример</th></tr><tr><td>although / though / even though</td><td>подлежащее + сказуемое</td><td><i>Although it was raining, we went out.</i></td></tr><tr><td>despite / in spite of</td><td>существительное или герундий</td><td><i>Despite the rain, we went out. In spite of being tired, she worked.</i></td></tr><tr><td>despite / in spite of the fact that</td><td>целое предложение</td><td><i>Despite the fact that it was cold, we swam.</i></td></tr><tr><td>however / nevertheless</td><td>отдельное предложение, запятая после</td><td><i>It was cold. However, we swam.</i></td></tr><tr><td>but / yet</td><td>соединяет части с запятой перед ними</td><td><i>It was cold, but we swam.</i></td></tr><tr><td>whereas / while</td><td>противопоставление двух фактов</td><td><i>Tom is shy, whereas his sister is outgoing.</i></td></tr><tr><td>on the one hand ... on the other hand</td><td>два взгляда на вопрос</td><td><i>On the one hand it is cheap; on the other hand it is slow.</i></td></tr></table><p><b>Сила значения:</b> <i>even though</i> сильнее, чем <i>although</i>. <i>Though</i> часто стоит в конце предложения: <i>The food was good. The service was slow, though.</i></p><p><b>Пунктуация:</b> <i>however</i> и <i>nevertheless</i> пишутся с точкой с запятой или точкой перед ними и запятой после. Нельзя соединять ими два предложения через запятую.</p><p><b>Частая ошибка:</b> «Despite he was tired» и «Although of the rain». После <i>despite</i> не бывает подлежащего с глаголом (без <i>the fact that</i>), а <i>although</i> не сочетается с <i>of</i>. Также нельзя использовать <i>although</i> вместе с <i>but</i> в одном предложении.</p>","ex":[{"q":"___ it was raining, we went for a walk.","a":"Although","o":["Although","Despite","In spite of","However"],"t":"Хотя шёл дождь, мы пошли гулять.","e":"После although идёт полное предложение."},{"q":"___ the rain, we went for a walk.","a":"Despite","o":["Despite","Although","Though","Whereas"],"t":"Несмотря на дождь, мы пошли гулять.","e":"После despite идёт существительное."},{"q":"She passed the exam ___ not studying much.","a":"despite","o":["despite","although","however","whereas"],"t":"Она сдала экзамен, несмотря на то что мало училась.","e":"После despite с глаголом нужен герундий (not studying)."},{"q":"The film was long. ___, I enjoyed it.","a":"However","o":["However","Although","Despite","Whereas"],"t":"Фильм был длинным. Однако он мне понравился.","e":"However открывает отдельное предложение, после него запятая."},{"q":"My brother loves football, ___ I prefer tennis.","a":"whereas","o":["whereas","despite","however","in spite"],"t":"Мой брат любит футбол, тогда как я предпочитаю теннис.","e":"Whereas противопоставляет два факта."},{"q":"In spite ___ the fact that he was ill, he went to work.","a":"of","o":["of","from","for","to"],"t":"Несмотря на то что он был болен, он пошёл на работу.","e":"Правильная форма: in spite of."},{"q":"I couldn't sleep ___ I was very tired.","a":"even though","o":["even though","despite","however","in spite"],"t":"Я не мог уснуть, хотя очень устал.","e":"Even though вводит придаточное предложение и усиливает контраст."},{"q":"The hotel was cheap. The rooms were dirty, ___.","a":"though","o":["though","despite","whereas","nevertheless"],"t":"Отель был дешёвым. Но номера были грязными.","e":"Though в конце предложения значит «впрочем, правда»."},{"q":"___ the fact that he is rich, he is not happy.","a":"Despite","o":["Despite","Although","However","Whereas"],"t":"Несмотря на то что он богат, он несчастлив.","e":"Despite the fact that + предложение."},{"q":"He had no money. ___, he bought her a present.","a":"Nevertheless","o":["Nevertheless","Although","Despite","Whereas"],"t":"У него не было денег. Тем не менее он купил ей подарок.","e":"Nevertheless открывает отдельное предложение."},{"q":"___ he was tired, he finished the report.","a":"Though","o":["Though","Despite","In spite","However"],"t":"Хотя он устал, он закончил отчёт.","e":"Though = although, дальше идёт полное предложение."},{"q":"It was a difficult task; ___, we completed it on time.","a":"nevertheless","o":["nevertheless","although","despite","whereas"],"t":"Это была трудная задача; тем не менее мы закончили её вовремя.","e":"После точки с запятой используем наречие nevertheless."},{"q":"___ being very rich, he lives in a small flat.","a":"In spite of","o":["In spite of","Although","Even though","However"],"t":"Несмотря на то что он очень богат, он живёт в маленькой квартире.","e":"In spite of + герундий (being)."},{"q":"On the one hand, the job pays well. ___, it requires long hours.","a":"On the other hand","o":["On the other hand","Despite","Although","Even though"],"t":"С одной стороны, работа хорошо оплачивается. С другой стороны, она требует долгих часов.","e":"Пара on the one hand ... on the other hand."},{"q":"She speaks Spanish well, ___ her husband can hardly say a word.","a":"whereas","o":["whereas","despite","nevertheless","in spite of"],"t":"Она хорошо говорит по-испански, тогда как её муж едва может сказать слово.","e":"Whereas противопоставляет двух людей."}]},{"id":"b2-modal-perfect","level":"B2","title":"Модальные глаголы с перфектным инфинитивом","summary":"must have, can't have, might have, should have, needn't have","rule":"<p>Конструкция <b>модальный глагол + have + V3</b> позволяет говорить о прошлом: либо делать <b>вывод</b> о том, что было, либо оценивать <b>действия, которые не случились</b>.</p><table><tr><th>Конструкция</th><th>Значение</th><th>Пример</th></tr><tr><td>must have done</td><td>уверен, что это было (почти точно)</td><td><i>He must have forgotten.</i> — Он, должно быть, забыл.</td></tr><tr><td>can't / couldn't have done</td><td>уверен, что этого не было</td><td><i>She can't have seen us.</i> — Не могла она нас видеть.</td></tr><tr><td>may / might / could have done</td><td>возможно, было</td><td><i>They might have got lost.</i> — Возможно, они заблудились.</td></tr><tr><td>should / ought to have done</td><td>надо было, но не сделал (упрёк)</td><td><i>You should have called.</i> — Тебе следовало позвонить.</td></tr><tr><td>shouldn't have done</td><td>не надо было, но сделал</td><td><i>I shouldn't have said that.</i> — Не следовало мне так говорить.</td></tr><tr><td>needn't have done</td><td>сделал зря, не было необходимости</td><td><i>You needn't have come.</i> — Тебе не нужно было приходить.</td></tr><tr><td>could have done</td><td>мог бы, но не сделал</td><td><i>You could have helped me.</i> — Ты мог бы мне помочь.</td></tr></table><p><b>Важно:</b> для вывода об отрицательном факте мы не используем <i>mustn't have</i>. Вместо него: <i>can't have</i>. Также различайте <i>needn't have done</i> (действие было сделано, зря) и <i>didn't need to do</i> (необходимости не было, неизвестно, делали ли).</p><p><b>Частая ошибка:</b> «He must forgot» или «should have went». После have всегда стоит третья форма глагола: <i>forgotten, gone</i>.</p>","ex":[{"q":"The lights are off. They ___ gone to bed.","a":"must have","o":["must have","can't have","needn't have","shouldn't have"],"t":"Свет выключен. Они, должно быть, легли спать.","e":"Уверенный вывод о прошлом: must have + V3."},{"q":"He ___ seen me; he was looking the other way.","a":"can't have","o":["can't have","must have","should have","needn't have"],"t":"Он не мог меня видеть; он смотрел в другую сторону.","e":"Уверенность, что этого не было: can't have."},{"q":"I don't know where Anna is. She ___ gone shopping.","a":"might have","o":["might have","can't have","shouldn't have","needn't have"],"t":"Не знаю, где Анна. Возможно, она пошла по магазинам.","e":"Возможность в прошлом: might have + V3."},{"q":"You ___ told me earlier! Now it's too late.","a":"should have","o":["should have","must have","can't have","might have"],"t":"Тебе надо было сказать мне раньше! Теперь уже поздно.","e":"Упрёк за несделанное: should have + V3."},{"q":"I ___ said that. I'm sorry.","a":"shouldn't have","o":["shouldn't have","can't have","must have","needn't have"],"t":"Не надо было мне этого говорить. Прости.","e":"Сожаление о сделанном: shouldn't have + V3."},{"q":"You ___ bought so much food. We have plenty.","a":"needn't have","o":["needn't have","can't have","mustn't have","shouldn't be"],"t":"Тебе не нужно было покупать столько еды. У нас её полно.","e":"Действие сделано зря: needn't have + V3."},{"q":"She isn't answering. She ___ left her phone at home.","a":"must have","o":["must have","can't have","should have","needn't have"],"t":"Она не отвечает. Должно быть, оставила телефон дома.","e":"Логический вывод о прошлом: must have."},{"q":"You ___ helped me, but you just watched TV.","a":"could have","o":["could have","must have","can't have","needn't have"],"t":"Ты мог бы мне помочь, а ты просто смотрел телевизор.","e":"Could have = мог бы, но не сделал."},{"q":"He ___ passed the exam. He didn't study at all!","a":"can't have","o":["can't have","must have","should have","may have"],"t":"Он не мог сдать экзамен. Он совсем не учился!","e":"Невозможность по логике: can't have + V3."},{"q":"The ground is wet. It ___ rained during the night.","a":"must have","o":["must have","can't have","needn't have","couldn't"],"t":"Земля мокрая. Ночью, наверное, шёл дождь.","e":"Вывод из наблюдаемого факта: must have + V3."},{"q":"The test was cancelled, so I ___ studied so hard.","a":"needn't have","o":["needn't have","can't have","must have","might have"],"t":"Тест отменили, так что мне не нужно было так усердно учиться.","e":"Усилие оказалось ненужным: needn't have + V3."},{"q":"You ___ driven so fast. You could have had an accident.","a":"shouldn't have","o":["shouldn't have","needn't have","must have","can't have"],"t":"Не надо было тебе так быстро ехать. Ты мог попасть в аварию.","e":"Критика совершённого действия: shouldn't have."},{"q":"I'm not sure, but she ___ have misunderstood me.","a":"may","o":["may","must","should","needn't"],"t":"Не уверен, но возможно, она неправильно меня поняла.","e":"Неуверенное предположение: may have + V3."},{"q":"They ___ arrived by now. The flight landed an hour ago.","a":"should have","o":["should have","can't have","needn't have","shouldn't have"],"t":"Они уже должны были прибыть. Рейс приземлился час назад.","e":"Ожидание, основанное на логике: should have."},{"q":"He ___ have known the answer, but he said nothing.","a":"could","o":["could","must","needn't","shouldn't"],"t":"Он мог знать ответ, но ничего не сказал.","e":"Возможность в прошлом: could have + V3."}]},{"id":"b2-passive-advanced","level":"B2","title":"Пассив: сложные случаи","summary":"have something done, it is said that, модальный и перфектный пассив","rule":"<p>Пассивный залог строится по схеме <b>be + V3</b> (причастие прошедшего времени). Время передаёт глагол <i>be</i>. На уровне B2 важны более сложные конструкции.</p><table><tr><th>Конструкция</th><th>Пример</th></tr><tr><td>Модальный пассив: modal + be + V3</td><td><i>The report must be finished today.</i></td></tr><tr><td>Перфектный пассив: have/has/had been + V3</td><td><i>The bridge has been repaired.</i></td></tr><tr><td>Продолженный пассив: is/was being + V3</td><td><i>The room is being cleaned.</i></td></tr><tr><td>Пассив инфинитива: to be + V3</td><td><i>He wants to be told the truth.</i></td></tr><tr><td>Пассив герундия: being + V3</td><td><i>I hate being kept waiting.</i></td></tr></table><p><b>Безличный пассив</b> (для сообщений и мнений): <i>It is said that he is rich. = He is said to be rich.</i> Так же работают <i>believed, thought, known, reported, expected</i>. Для прошлого действия используем перфектный инфинитив: <i>He is said to have left the country.</i></p><p><b>Каузатив have something done</b> описывает услугу, которую нам оказывает кто-то другой: <i>I had my car repaired.</i> (Я починил машину в мастерской, сам не чинил.) Также <i>get something done</i> в разговорной речи. Часто так говорят и о неприятностях: <i>She had her bag stolen.</i></p><p>Глаголы с двумя дополнениями (<i>give, tell, show, send</i>) допускают два пассива: <i>She was given a book. / A book was given to her.</i></p><p><b>Частая ошибка:</b> «I cut my hair» вместо <i>I had my hair cut</i>, если стригли не вы сами.</p>","ex":[{"q":"The new library ___ next year.","a":"will be opened","o":["will be opened","will open be","is opened will","will been opened"],"t":"Новую библиотеку откроют в следующем году.","e":"Пассив будущего: will be + V3."},{"q":"The documents ___ by the manager right now.","a":"are being checked","o":["are being checked","are checked","have been checked","are been checked"],"t":"Документы прямо сейчас проверяет менеджер.","e":"Действие идёт сейчас: is/are being + V3."},{"q":"This form must ___ in black ink.","a":"be filled out","o":["be filled out","fill out","been filled out","being filled out"],"t":"Эту форму нужно заполнить чёрными чернилами.","e":"Модальный пассив: must be + V3."},{"q":"I ___ my teeth checked twice a year.","a":"have","o":["have","am","do","make"],"t":"Я проверяю зубы у врача два раза в год.","e":"Каузатив: have + объект + V3."},{"q":"She is said ___ three languages fluently.","a":"to speak","o":["to speak","speaking","to be speak","that speaks"],"t":"Говорят, что она свободно говорит на трёх языках.","e":"Is said + to-инфинитив для настоящего."},{"q":"The thief is believed ___ the country last week.","a":"to have left","o":["to have left","to leave","to be left","leaving"],"t":"Считается, что вор покинул страну на прошлой неделе.","e":"Для прошлого действия нужен перфектный инфинитив: to have left."},{"q":"He hates ___ what to do.","a":"being told","o":["being told","to tell","telling","been told"],"t":"Он ненавидит, когда ему указывают, что делать.","e":"Пассив герундия: being + V3."},{"q":"We ___ our house painted last month.","a":"had","o":["had","were","have","did"],"t":"В прошлом месяце нам покрасили дом.","e":"Каузатив в прошедшем: had + объект + V3."},{"q":"The windows ___ yet, so the room is still dirty.","a":"haven't been cleaned","o":["haven't been cleaned","aren't being cleaned","didn't clean","weren't cleaned"],"t":"Окна ещё не вымыты, поэтому комната до сих пор грязная.","e":"Результат связан с настоящим: Present Perfect Passive."},{"q":"She ___ a prize at the ceremony yesterday.","a":"was given","o":["was given","gave","was gave","has given"],"t":"Ей вручили приз на вчерашней церемонии.","e":"Пассив прошедшего: was + V3 (given)."},{"q":"It is expected ___ the meeting will last two hours.","a":"that","o":["that","to","for","what"],"t":"Ожидается, что собрание продлится два часа.","e":"Безличная конструкция It is expected that + предложение."},{"q":"I'd like ___ about any changes in the schedule.","a":"to be informed","o":["to be informed","to inform","informing","being inform"],"t":"Я хотел бы, чтобы меня информировали о любых изменениях в расписании.","e":"Пассив инфинитива: to be + V3."},{"q":"Yesterday he ___ his wallet stolen on the bus.","a":"had","o":["had","was","did","got stolen"],"t":"Вчера в автобусе у него украли кошелёк.","e":"Have something done описывает и неприятные события."},{"q":"The suspect is known ___ in the area last night.","a":"to have been seen","o":["to have been seen","to see","to be seeing","to have seen"],"t":"Известно, что подозреваемого видели в этом районе прошлой ночью.","e":"Перфектный пассивный инфинитив: to have been + V3."}]},{"id":"b2-relative-clauses-advanced","level":"B2","title":"Относительные придаточные: углублённо","summary":"defining / non-defining, whose, предлог + which, which о всей ситуации","rule":"<p><b>Определительные</b> (defining) придаточные нужны, чтобы понять, о ком или о чём речь; запятых нет, <i>that</i> возможен, местоимение-дополнение можно опустить: <i>The book (that) I read was great.</i></p><p><b>Пояснительные</b> (non-defining) добавляют дополнительную информацию, выделяются запятыми, <i>that</i> использовать нельзя, и опускать местоимение нельзя: <i>My brother, who lives in Paris, is a chef.</i></p><table><tr><th>Слово</th><th>Использование</th><th>Пример</th></tr><tr><td>who / whom</td><td>люди (whom — формально, как дополнение)</td><td><i>The man whom I met was kind.</i></td></tr><tr><td>which</td><td>предметы; также вся предыдущая ситуация</td><td><i>He passed, which surprised us.</i></td></tr><tr><td>whose</td><td>принадлежность</td><td><i>The woman whose car was stolen called the police.</i></td></tr><tr><td>where / when / why</td><td>место, время, причина</td><td><i>The day when we met was Monday.</i></td></tr></table><p><b>Предлог + whom/which</b> (формальный стиль): <i>The girl with whom I work is Polish.</i> В разговорной речи предлог уходит в конец: <i>The girl (who) I work with.</i> Заметьте, что <i>that</i> после предлога не используется.</p><p><b>Союз-слово + число:</b> <i>some of which, none of whom, both of whom</i>: <i>He has three sisters, two of whom live abroad.</i></p><p>Причастные обороты сокращают придаточные: <i>The man standing there (= who is standing)</i>, <i>The letter written yesterday (= which was written)</i>.</p><p><b>Частая ошибка:</b> повтор местоимения: «The man who he lives next door». Нужно: <i>The man who lives next door.</i></p>","ex":[{"q":"The woman ___ car was stolen called the police.","a":"whose","o":["whose","who","which","that"],"t":"Женщина, у которой украли машину, позвонила в полицию.","e":"Принадлежность выражаем словом whose."},{"q":"My brother, ___ lives in Paris, is a chef.","a":"who","o":["who","that","whom","which"],"t":"Мой брат, который живёт в Париже, шеф-повар.","e":"В пояснительном придаточном that нельзя, для человека-подлежащего who."},{"q":"She failed the exam, ___ surprised everyone.","a":"which","o":["which","that","what","who"],"t":"Она провалила экзамен, что всех удивило.","e":"Which относится ко всей предыдущей ситуации."},{"q":"The girl with ___ I work is Polish.","a":"whom","o":["whom","who","that","which"],"t":"Девушка, с которой я работаю, полька.","e":"После предлога для человека используем whom."},{"q":"The house in ___ we lived was very old.","a":"which","o":["which","that","whom","where"],"t":"Дом, в котором мы жили, был очень старым.","e":"После предлога that нельзя, для предмета which."},{"q":"This is the place ___ we first met.","a":"where","o":["where","which","who","whose"],"t":"Это место, где мы впервые встретились.","e":"Where заменяет «предлог + место»."},{"q":"He has four children, two of ___ are doctors.","a":"whom","o":["whom","who","which","them"],"t":"У него четверо детей, двое из которых врачи.","e":"Some/two of + whom для людей."},{"q":"The book ___ you lent me was fascinating.","a":"that","o":["that","what","whose","where"],"t":"Книга, которую ты мне одолжил, была увлекательной.","e":"В определительном придаточном для предмета возможен that."},{"q":"Do you remember the day ___ we met?","a":"when","o":["when","which","where","what"],"t":"Ты помнишь день, когда мы познакомились?","e":"Для времени используем when."},{"q":"The man ___ standing by the door is my uncle.","a":"standing","o":["standing","who standing","is standing who","stands"],"t":"Мужчина, стоящий у двери, мой дядя.","e":"Причастный оборот заменяет who is standing, поэтому is отдельно не нужен."},{"q":"Everything ___ she said was true.","a":"that","o":["that","which","what","who"],"t":"Всё, что она сказала, было правдой.","e":"После everything, all, nothing обычно ставится that."},{"q":"The friend ___ I was talking about lives in Rome.","a":"whom","o":["whom","whose","what","where"],"t":"Друг, о котором я говорил, живёт в Риме.","e":"Whom здесь как дополнение к about; в разговорной речи можно who или опустить."},{"q":"The company, ___ headquarters are in Berlin, employs 5,000 people.","a":"whose","o":["whose","which","who","that"],"t":"Компания, штаб-квартира которой находится в Берлине, нанимает 5000 человек.","e":"Whose выражает принадлежность и для организаций."},{"q":"She gave me a lot of advice, ___ was very useful.","a":"most of which","o":["most of which","most of that","most of what","most which"],"t":"Она дала мне много советов, большинство из которых было полезно.","e":"Количество + of which для предметов."},{"q":"The reason ___ he left is still unknown.","a":"why","o":["why","which","what","whose"],"t":"Причина, по которой он ушёл, до сих пор неизвестна.","e":"После the reason используем why."}]},{"id":"b2-reported-questions-verbs","level":"B2","title":"Косвенные вопросы и глаголы передачи речи","summary":"asked if, wanted to know, reporting verbs: suggest, admit, promise","rule":"<p>В косвенной речи вопросы превращаются в <b>повествовательные предложения</b>: порядок слов прямой (подлежащее, потом сказуемое), вспомогательный глагол <i>do/does/did</i> исчезает, вопросительного знака нет.</p><ul><li><i>«Where do you live?»</i> → <i>He asked me where I lived.</i></li><li><i>«Are you tired?»</i> → <i>She asked if (whether) I was tired.</i></li></ul><p>Вопросы без вопросительного слова вводятся через <b>if / whether</b>. Времена сдвигаются «назад», если вводящий глагол в прошедшем: <i>do → did, will → would, can → could, have done → had done</i>.</p><p>Кроме <i>say</i> и <i>tell</i>, в B2 важны <b>глаголы передачи речи</b>, которые требуют разных конструкций:</p><table><tr><th>Конструкция</th><th>Глаголы</th><th>Пример</th></tr><tr><td>verb + to do</td><td>promise, offer, refuse, agree, threaten</td><td><i>He promised to call.</i></td></tr><tr><td>verb + person + to do</td><td>advise, warn, remind, invite, tell, ask</td><td><i>She advised me to wait.</i></td></tr><tr><td>verb + doing</td><td>suggest, admit, deny, recommend</td><td><i>He admitted taking the money.</i></td></tr><tr><td>verb + (that) + clause</td><td>suggest, explain, complain, announce</td><td><i>She explained that she was busy.</i></td></tr><tr><td>verb + предлог + doing</td><td>apologise for, insist on, accuse of</td><td><i>He apologised for being late.</i></td></tr></table><p><b>Частая ошибка:</b> «He suggested me to go». После <i>suggest</i> нет конструкции с to: правильно <i>He suggested going</i> или <i>He suggested that I go</i>. И нельзя сказать «She asked where did I live».</p>","ex":[{"q":"«Where do you work?» → She asked me where I ___.","a":"worked","o":["worked","work","did work","do work"],"t":"Она спросила меня, где я работаю.","e":"В косвенном вопросе порядок прямой, время сдвигается: worked."},{"q":"«Are you coming?» → He asked me ___ I was coming.","a":"if","o":["if","that","what","do"],"t":"Он спросил меня, приду ли я.","e":"Вопрос без вопросительного слова вводится через if или whether."},{"q":"«What time does the film start?» → He wanted to know what time the film ___.","a":"started","o":["started","does start","did start","starts did"],"t":"Он хотел узнать, во сколько начинается фильм.","e":"Вспомогательный did исчезает, глагол ставим в прошедшее время."},{"q":"«I'll call you tomorrow.» → He promised ___ me the next day.","a":"to call","o":["to call","calling","that call","him call"],"t":"Он пообещал позвонить мне на следующий день.","e":"После promise используется инфинитив с to."},{"q":"«You should see a doctor.» → She advised me ___ a doctor.","a":"to see","o":["to see","seeing","see","that see"],"t":"Она посоветовала мне обратиться к врачу.","e":"Advise + человек + to-инфинитив."},{"q":"«Let's go to the cinema.» → He suggested ___ to the cinema.","a":"going","o":["going","to go","us to go","me going"],"t":"Он предложил сходить в кино.","e":"После suggest идёт герундий (или that-clause), но не to-инфинитив."},{"q":"«I didn't steal the money.» → He denied ___ the money.","a":"stealing","o":["stealing","to steal","steal","that steal"],"t":"Он отрицал, что украл деньги.","e":"После deny используется герундий."},{"q":"«Sorry I'm late.» → She apologised ___ late.","a":"for being","o":["for being","to be","that being","about be"],"t":"Она извинилась за опоздание.","e":"Apologise for + герундий."},{"q":"«Don't touch the wire!» → He warned the children ___ the wire.","a":"not to touch","o":["not to touch","to not touch","don't touch","not touching"],"t":"Он предупредил детей, чтобы они не трогали провод.","e":"Отрицание: warn + человек + not to + глагол."},{"q":"«Why did you leave early?» → She asked me why I ___ early.","a":"had left","o":["had left","did leave","have left","leave"],"t":"Она спросила, почему я ушёл рано.","e":"Прошедшее простое в прямой речи переходит в Past Perfect."},{"q":"«I'm sorry, I broke the vase.» → He admitted ___ the vase.","a":"breaking","o":["breaking","to break","that break","for break"],"t":"Он признался, что разбил вазу.","e":"После admit используется герундий."},{"q":"«I won't help you!» → She refused ___ me.","a":"to help","o":["to help","helping","that help","for helping"],"t":"Она отказалась мне помогать.","e":"После refuse идёт to-инфинитив."},{"q":"«Don't forget to lock the door.» → She ___ me to lock the door.","a":"reminded","o":["reminded","suggested","admitted","denied"],"t":"Она напомнила мне запереть дверь.","e":"Remind + человек + to-инфинитив значит «напомнить»."},{"q":"«Can you swim?» → He asked me whether I ___ swim.","a":"could","o":["could","can","am able","did"],"t":"Он спросил меня, умею ли я плавать.","e":"Can в косвенной речи переходит в could."},{"q":"«You stole my idea!» → She accused him ___ her idea.","a":"of stealing","o":["of stealing","for stealing","to steal","that stealing"],"t":"Она обвинила его в краже её идеи.","e":"Accuse somebody of + герундий."}]},{"id":"c1-advanced-modals-hedging","level":"C1","title":"Модальные глаголы и смягчение утверждений (hedging)","summary":"May, might, would, tend to: как осторожно формулировать мысли","rule":"<p><b>Hedging</b> — это приём «смягчения»: автор показывает, что утверждение не абсолютно, и оставляет место для сомнения. В науке и деловом общении категоричное <i>This proves that...</i> звучит наивно; предпочитают <i>This suggests that...</i></p>\n<p><b>Основные средства:</b></p>\n<ul><li><b>Модальные глаголы:</b> <i>may, might, could</i> (возможность), <i>would</i> (гипотетичность), <i>should</i> (вероятность/рекомендация): <i>The effect may be due to sample size.</i></li>\n<li><b>Лексические глаголы:</b> <i>seem, appear, suggest, indicate, tend to, assume, propose</i>: <i>The results appear to confirm...; Men tend to underreport symptoms.</i></li>\n<li><b>Наречия:</b> <i>possibly, arguably, presumably, apparently, broadly, largely, generally</i>.</li>\n<li><b>Прилагательные и существительные:</b> <i>a possible explanation, a likely outcome, a tendency, the possibility that...</i></li>\n<li><b>Безличные конструкции:</b> <i>It is likely that..., It could be argued that..., There is some evidence to suggest...</i></li></ul>\n<table><tr><th>Категорично</th><th>С hedging</th></tr>\n<tr><td>This causes anxiety.</td><td>This <i>may</i> cause anxiety.</td></tr>\n<tr><td>The drug is effective.</td><td>The drug <i>appears to be</i> effective.</td></tr>\n<tr><td>Stress reduces memory.</td><td>Stress <i>tends to</i> reduce memory.</td></tr></table>\n<p><b>Тонкости.</b> Для прошлого используйте перфектный инфинитив: <i>may/might have been</i> (возможно, было), <i>could have</i>; <i>must have been</i> — почти уверенный вывод, а не смягчение. <i>Can</i> в значении «возможно» в утвердительных предложениях о конкретном факте не употребляют (нельзя: <i>It can be true</i> вместо <i>It may be true</i>), зато <i>can</i> говорит об общей потенциальной возможности: <i>Stress can impair memory.</i> <i>Would</i> смягчает: <i>One would expect...; I would argue that...</i></p>\n<p><b>Баланс.</b> Не нагромождайте средства: <i>It would perhaps seem possible that it might...</i> — перебор. Одного-двух маркеров на утверждение достаточно.</p>","ex":[{"q":"The data ___ that the intervention was effective, although more research is needed.","a":"suggest","o":["suggest","prove","show clearly","are certain"],"t":"Данные позволяют предположить, что вмешательство было эффективным, но нужны дополнительные исследования.","e":"Suggest — типичный глагол-смягчитель; prove звучит слишком категорично рядом с «нужны исследования»."},{"q":"The difference ___ be due to sampling error.","a":"may","o":["may","must have","will","is"],"t":"Разница может быть обусловлена ошибкой выборки.","e":"May выражает возможность; will/is — категоричны, must have требует have + V3."},{"q":"The earlier results ___ have been affected by poor equipment.","a":"might","o":["might","can","may be","will be"],"t":"Предыдущие результаты, возможно, были искажены плохим оборудованием.","e":"Для возможности в прошлом: might + have + V3. Can have так не используется, may be не сочетается с have been."},{"q":"Adolescents ___ to underestimate risk.","a":"tend","o":["tend","tends","are tending","are tended"],"t":"Подростки склонны недооценивать риск.","e":"Tend to — обобщение с мягкостью; подлежащее множественное — tend."},{"q":"It is ___ that the effect will persist in the long term.","a":"unlikely","o":["unlikely","unlike","not like","dislikely"],"t":"Маловероятно, что эффект сохранится в долгосрочной перспективе.","e":"Устойчивая конструкция It is unlikely that..."},{"q":"The author ___ argue that the model is too simplistic.","a":"could","o":["could","can to","would to","must to"],"t":"Можно было бы возразить, что модель слишком упрощённая.","e":"Could argue — осторожное допущение; после модального глагола нет to."},{"q":"Stress ___ impair memory, but not in every case.","a":"can","o":["can","must","will certainly","has to"],"t":"Стресс может ухудшать память, но не во всех случаях.","e":"Can — общая потенциальная возможность; must и will certainly не сочетаются с «не во всех случаях»."},{"q":"The results are ___ consistent with the hypothesis.","a":"broadly","o":["broadly","absolutely","exactly","definitely"],"t":"Результаты в целом согласуются с гипотезой.","e":"Broadly — наречие-смягчитель; остальные усиливают."},{"q":"There ___ to be a link between sleep and attention.","a":"appears","o":["appears","appear","is appearing","is appeared"],"t":"По-видимому, существует связь между сном и вниманием.","e":"Подлежащее there + a link (ед. число) → appears to be; appear не согласуется."},{"q":"Which hedge is the weakest (most cautious)? The policy ___ have contributed to the decline.","a":"may","o":["may","must","will","has"],"t":"Политика, возможно, способствовала спаду.","e":"May have + V3 — осторожное предположение; must have — почти уверенность."},{"q":"One ___ expect the figures to be higher.","a":"would","o":["would","will","did","is"],"t":"Можно было бы ожидать, что цифры выше.","e":"One would expect — стандартная осторожная формула."},{"q":"___ the data are incomplete, the conclusions must be treated with caution.","a":"Given that","o":["Given that","Despite that","Unless that","Whereas it"],"t":"Поскольку данные неполны, к выводам следует относиться осторожно.","e":"Given that = «учитывая, что»; остальные варианты не образуют корректной связи."},{"q":"It could be ___ that the sample was unrepresentative.","a":"argued","o":["argued","arguing","argument","argues"],"t":"Можно утверждать, что выборка была нерепрезентативной.","e":"Пассив после could be: could be argued that."},{"q":"The new treatment is ___ more effective than the old one, though the evidence is limited.","a":"arguably","o":["arguably","undoubtedly","certainly","obviously"],"t":"Новое лечение, возможно, эффективнее прежнего, хотя доказательств мало.","e":"Arguably — смягчитель («можно утверждать»); остальные категоричны."},{"q":"That ___ have been the reason; we simply cannot say for sure.","a":"could","o":["could","must","had to","shall"],"t":"Это могло быть причиной; мы просто не можем сказать наверняка.","e":"Could have been — возможность; must have been выражает уверенность, что противоречит продолжению."}]},{"id":"c1-advanced-passives-noun-phrases","level":"C1","title":"Продвинутый пассив и сложные именные группы","summary":"Безличный пассив, causative, пассив с предлогами и длинные именные группы","rule":"<p>На уровне C1 пассив используется не только как «обратный порядок слов», а как средство организации информации: известное — в начало, новое и важное — в конец, исполнитель часто не нужен.</p>\n<p><b>1. Безличный пассив с глаголами мнения.</b> Два варианта:</p>\n<ul><li><i>It is said / believed / thought / reported / known / alleged that + clause:</i> <i>It is believed that the fire started at night.</i></li>\n<li><i>Subject + is said / believed + to-infinitive:</i> <i>The fire is believed to have started at night.</i> Для предшествующего действия — перфектный инфинитив (<i>to have started</i>), для длительного — <i>to be doing</i>.</li></ul>\n<p><b>2. Passive causative:</b> <i>have / get + object + V3</i> — действие выполнил кто-то другой: <i>We had the roof repaired.</i> <i>She got her passport stolen</i> (неприятное событие, с которым что-то случилось). Нельзя: <i>We repaired the roof</i>, если мы не делали этого сами.</p>\n<p><b>3. Пассив с предлогами и составными глаголами:</b> предлог остаётся после глагола: <i>The proposal was looked into. The patient was taken care of.</i> Двухобъектные глаголы: <i>She was given a prize</i> (естественнее) — <i>A prize was given to her</i>. Пассив с <i>being</i>: <i>He resented being told what to do. I remember being taken to the zoo.</i> Перфектный пассив: <i>having been completed</i>.</p>\n<p><b>4. Пассив с модальными глаголами:</b> <i>modal + be + V3</i> (<i>The report must be submitted</i>); о прошлом — <i>modal + have been + V3</i> (<i>The error could have been avoided</i>).</p>\n<p><b>5. Сложные именные группы.</b> Схема: <i>определители + премодификаторы + существительное + постмодификаторы</i>: <i>the recently published, widely cited study of memory in older adults [which was conducted in Japan]</i>. Постмодификаторы: предложные группы, причастные обороты (<i>the data collected last year, the methods being used</i>), придаточные (<i>the idea that...</i>), инфинитив (<i>the ability to adapt</i>). Составные определения пишутся через дефис: <i>a well-known author, a three-year study, a long-term effect</i> (существительное в составном определении — в ед. числе: <i>a three-year study, не three-years</i>).</p>\n<table><tr><th>Громоздко</th><th>Компактно</th></tr>\n<tr><td>the people who are affected by the changes</td><td>the people <i>affected by the changes</i></td></tr>\n<tr><td>the method that is being used in the lab</td><td>the method <i>being used in the lab</i></td></tr></table>","ex":[{"q":"The suspect ___ to have left the country last week.","a":"is believed","o":["is believed","believes","is believing","believed that"],"t":"Считается, что подозреваемый покинул страну на прошлой неделе.","e":"Безличный пассив: subject + is believed + to have + V3."},{"q":"It ___ that the company will announce job cuts.","a":"is rumoured","o":["is rumoured","rumours","is rumouring","has rumoured"],"t":"Ходят слухи, что компания объявит о сокращениях.","e":"Безличный пассив: It is rumoured that + clause."},{"q":"We ___ our kitchen redesigned last year.","a":"had","o":["had","did","made","were"],"t":"В прошлом году нам переделали кухню.","e":"Passive causative: have + object + V3 (кто-то сделал для нас)."},{"q":"The new policy is ___ to improve public health.","a":"expected","o":["expected","expecting","expect","been expected"],"t":"Ожидается, что новая политика улучшит общественное здоровье.","e":"Is expected to + infinitive — пассивная конструкция с модальным смыслом."},{"q":"The matter is currently ___ into by a special committee.","a":"being looked","o":["being looked","looking","been looked","looked being"],"t":"Этим вопросом сейчас занимается специальный комитет.","e":"Длительный пассив (is being + V3); предлог into остаётся после глагола look."},{"q":"He remembers ___ to the airport by his uncle.","a":"being taken","o":["being taken","to take","taking","been taken"],"t":"Он помнит, как дядя отвёз его в аэропорт.","e":"После remember о прошлом — герундий в пассиве: being taken."},{"q":"The error could ___ avoided if the data had been checked.","a":"have been","o":["have been","be","has been","had been"],"t":"Ошибки можно было бы избежать, если бы данные проверили.","e":"Модальный пассив в прошлом: could have been + V3."},{"q":"The residents ___ by the closure of the factory are demanding compensation.","a":"affected","o":["affected","affecting","who affected","having affected"],"t":"Жители, пострадавшие из-за закрытия фабрики, требуют компенсации.","e":"Причастие прошедшего времени с пассивным значением — сокращённое придаточное (who are affected)."},{"q":"It was a ___ study, which followed participants for a decade.","a":"long-term","o":["long-term","long-terms","long terms","longly term"],"t":"Это было долгосрочное исследование, наблюдавшее участников десять лет.","e":"Составное определение пишется через дефис; существительное остаётся в ед. числе."},{"q":"She was awarded a ___ research grant.","a":"three-year","o":["three-year","three-years","three years","three year's"],"t":"Ей присудили исследовательский грант на три года.","e":"В составном определении числительное + существительное в ед. числе через дефис."},{"q":"The painting is thought ___ stolen during the war.","a":"to have been","o":["to have been","to be","being","that was"],"t":"Считается, что картину украли во время войны.","e":"Прошлое действие — перфектный инфинитив пассива: to have been stolen."},{"q":"He got his bag ___ on the train.","a":"stolen","o":["stolen","steal","stealing","to steal"],"t":"У него украли сумку в поезде.","e":"Get + object + V3 — неприятное событие (causative)."},{"q":"The idea ___ the economy will recover soon is widely shared.","a":"that","o":["that","which","what","of"],"t":"Идея о том, что экономика скоро восстановится, широко распространена.","e":"После существительного idea придаточное-приложение вводится that (не which)."},{"q":"The proposals ___ by the board were rejected.","a":"put forward","o":["put forward","putting forward","were putting forward","forward put"],"t":"Предложения, выдвинутые советом, были отклонены.","e":"Причастие put forward (V3) — постмодификатор, пассивное значение."},{"q":"The patient is said ___ recovering well after the operation.","a":"to be","o":["to be","being","to have","is"],"t":"Говорят, пациент хорошо восстанавливается после операции.","e":"Длительное действие в настоящем: is said + to be + V-ing."}]},{"id":"c1-cleft-sentences","level":"C1","title":"Расщеплённые предложения (cleft sentences)","summary":"It was Maria who..., What I need is..., All I want is...","rule":"<p><b>Cleft sentences</b> разбивают одну мысль на две части, чтобы выделить главное. Это способ расставить акценты без интонации и повторов.</p><p><b>1. It-cleft:</b> <i>It + be + выделяемая часть + that / who</i>.</p><ul><li><i>It was Maria who solved the problem.</i> — Именно Мария решила задачу.</li><li><i>It was in 2019 that they moved to Berlin.</i> — Именно в 2019 году они переехали.</li><li><i>It wasn't the price that put me off.</i> — Меня отпугнула не цена.</li></ul><p><b>2. Wh-cleft (pseudo-cleft):</b> <i>What + клауза + be + выделяемая часть</i>.</p><ul><li><i>What I need is a long holiday.</i></li><li><i>What she did was call the police.</i> (после <i>did</i> часто идёт инфинитив без to)</li><li><i>What happened was that the engine stopped.</i></li><li><i>All I want is a quiet evening.</i></li></ul><p><b>3. Обратный вариант:</b> <i>A long holiday is what I need.</i></p><table><tr><th>Модель</th><th>Что выделяет</th></tr><tr><td>It was ... that</td><td>подлежащее, дополнение, обстоятельство</td></tr><tr><td>What ... is/was</td><td>действие или предмет желания</td></tr></table><p><b>Частые ошибки:</b> <i>who</i> относится только к людям, а <i>that</i> подходит ко всему. Нельзя пропускать <i>it</i> в начале. Время глагола <i>be</i> согласуется с исходным предложением: <i>What he did was...</i></p>","ex":[{"q":"___ was Maria who solved the problem.","a":"It","o":["It","This","There","That"],"t":"Именно Мария решила эту проблему.","e":"It-cleft всегда начинается с It: It was ... who."},{"q":"It was in 2019 ___ they moved to Berlin.","a":"that","o":["that","what","who","where"],"t":"Именно в 2019 году они переехали в Берлин.","e":"После выделенного обстоятельства времени в it-cleft ставится that."},{"q":"___ I need is a long holiday.","a":"What","o":["What","That","Which","It"],"t":"Что мне нужно, так это долгий отпуск.","e":"Wh-cleft начинается с What: What I need is..."},{"q":"What she did ___ call the police.","a":"was","o":["was","is","were","does"],"t":"Она позвонила в полицию (Что она сделала, так это позвонила в полицию).","e":"Исходное время прошедшее, поэтому be в форме was."},{"q":"It was John ___ broke the window.","a":"who","o":["who","whom","what","whose"],"t":"Именно Джон разбил окно.","e":"Выделяется человек в роли подлежащего, поэтому who."},{"q":"All I want ___ a quiet evening.","a":"is","o":["is","are","does","has"],"t":"Всё, чего я хочу, это спокойный вечер.","e":"All I want is... — устойчивая модель, be в настоящем времени."},{"q":"It wasn't the price ___ put me off; it was the quality.","a":"that","o":["that","what","who","as"],"t":"Меня отпугнула не цена, а качество.","e":"Выделяется неодушевлённое подлежащее, ставим that."},{"q":"What annoys me ___ the way he never apologises.","a":"is","o":["is","are","does","it is"],"t":"Меня раздражает то, что он никогда не извиняется.","e":"После wh-клаузы стоит глагол be: What annoys me is..."},{"q":"A new laptop is ___ I need.","a":"what","o":["what","that","which","it"],"t":"Новый ноутбук — вот что мне нужно.","e":"Обратный cleft: выделяемая часть + is + what-клауза."},{"q":"What happened ___ that the engine suddenly stopped.","a":"was","o":["was","did","has been","is happening"],"t":"Случилось то, что двигатель вдруг заглох.","e":"What happened was that... — модель для рассказа о событии."},{"q":"It is only when you lose something ___ you appreciate it.","a":"that","o":["that","what","which","than"],"t":"Только когда что-то теряешь, начинаешь это ценить.","e":"It is only when ... that: выделение обстоятельства придаточным."},{"q":"It was not ___ I got home that I noticed my keys were missing.","a":"until","o":["until","when","while","after"],"t":"Только придя домой, я заметил, что ключей нет.","e":"Модель It was not until ... that — «только когда»."},{"q":"What I'd like you to do ___ to be more patient.","a":"is","o":["is","does","will","has"],"t":"Я бы хотел, чтобы ты был терпеливее.","e":"Wh-cleft с глаголом be в настоящем времени."},{"q":"It was Tom and Anna ___ organised the party.","a":"who","o":["who","whom","what","where"],"t":"Именно Том и Анна организовали вечеринку.","e":"Выделяются люди в роли подлежащего: who."}]},{"id":"c1-ellipsis-substitution","level":"C1","title":"Эллипсис и подстановка (ellipsis, substitution)","summary":"Как не повторяться: do so, one, so, not, пропуск слов","rule":"<p>Чтобы текст не звучал тяжело, носитель языка опускает повторяющиеся слова (<b>эллипсис</b>) или заменяет их короткими словами-заместителями (<b>подстановка</b>). Читатель при этом легко восстанавливает смысл из контекста.</p>\n<table><tr><th>Приём</th><th>Пример</th></tr>\n<tr><td><b>Эллипсис после and/but/or</b></td><td>She opened the window and (she) looked out. <i>Подлежащее и вспомогательный глагол часто опускаются.</i></td></tr>\n<tr><td><b>Вспомогательный/модальный глагол</b></td><td>I haven't read it, but Tom <i>has</i>. — She can swim and he <i>can</i>, too.</td></tr>\n<tr><td><b>do so / do it / do that</b></td><td>He was told to leave and he <i>did so</i> at once. <i>(do so — формальнее)</i></td></tr>\n<tr><td><b>one / ones</b></td><td>I prefer the red car to the blue <i>one</i>. — Which ones? <i>(только для исчисляемых существительных)</i></td></tr>\n<tr><td><b>so / not</b></td><td>Will it rain? — I think <i>so</i> / I hope <i>not</i>. I'm afraid <i>so</i>.</td></tr>\n<tr><td><b>to без инфинитива</b></td><td>You can come if you want <i>to</i>. — I'd love <i>to</i>.</td></tr></table>\n<p><b>Важные правила.</b></p>\n<ol><li>После пропуска нужен тот же глагольный элемент: <i>He hasn't finished, but I have</i> (have = have finished). Если форма отличается, дублируйте глагол: <i>He has never been, but I have</i> — верно; <i>He never went, but I have</i> — нарушение, лучше <i>but I have been</i>.</li>\n<li>Если в первой части нет вспомогательного глагола, во второй используется <i>do/does/did</i>: <i>She likes jazz and so does he.</i></li>\n<li>Структуры <b>so + aux + подлежащее</b> (согласие с утверждением) и <b>neither/nor + aux + подлежащее</b> (с отрицанием): <i>She isn't coming. — Neither am I.</i> Сравните <i>So do I / Neither do I</i>.</li>\n<li>Глагол <i>do</i> как заместитель не может заменять глагол состояния без do-so: нельзя <i>He is tall and so does she</i>; нужно <i>so is she</i>.</li>\n<li>В формальном письме эллипсис возможен после союзов: <i>when asked, if necessary, although tired, where possible</i> (когда подлежащее совпадает).</li></ol>\n<p><b>Контекстуальный эллипсис</b> в разговорной речи: <i>(Do you) Want some tea? (I) Can't hear you. (It's) Nice to meet you.</i></p>","ex":[{"q":"I haven't seen the film, but my sister ___.","a":"has","o":["has","did","does","is"],"t":"Я не смотрел фильм, а моя сестра смотрела.","e":"Haven't seen → во второй части повторяем вспомогательный глагол has (= has seen)."},{"q":"Will they accept the offer? — I'm afraid ___.","a":"not","o":["not","no","don't","so not"],"t":"Они примут предложение? — Боюсь, что нет.","e":"I'm afraid not = «боюсь, что нет»; после afraid используется so/not."},{"q":"He asked her to leave, and she ___ immediately.","a":"did so","o":["did so","done so","made so","did it so"],"t":"Он попросил её уйти, и она сделала это сразу.","e":"Do so заменяет глагол с дополнением; в прошедшем — did so."},{"q":"I like both bags, but I prefer the leather ___.","a":"one","o":["one","it","that","ones"],"t":"Мне нравятся обе сумки, но я предпочитаю кожаную.","e":"One заменяет исчисляемое существительное в ед. числе после прилагательного."},{"q":"She doesn't smoke, and neither ___ her husband.","a":"does","o":["does","is","do not","has"],"t":"Она не курит, и её муж тоже.","e":"После neither нужен вспомогательный глагол той же формы: does (от doesn't smoke)."},{"q":"'I can't swim.' — 'Neither ___ I.'","a":"can","o":["can","do","am","have"],"t":"— Я не умею плавать. — Я тоже.","e":"Neither + модальный глагол из первой фразы: can."},{"q":"He's allowed to go if he wants ___.","a":"to","o":["to","it","so","that"],"t":"Ему разрешено идти, если он хочет.","e":"Эллипсис инфинитива: после want опускается сам глагол, но to остаётся."},{"q":"Who left the lights on? — Not me. I think Paul ___.","a":"did","o":["did","was","does","is"],"t":"Кто оставил свет включённым? — Не я. Думаю, Пол.","e":"Did заменяет left the lights on; do-подстановка в прошедшем времени."},{"q":"'Is the meeting cancelled?' — 'I hope ___.'","a":"not","o":["not","no","it not","so not"],"t":"Встречу отменили? — Надеюсь, что нет.","e":"Hope + not (сокращённый отрицательный ответ); hope no невозможно."},{"q":"The first proposal was rejected, but the second ___ was accepted.","a":"one","o":["one","it","ones","that one"],"t":"Первое предложение отклонили, а второе приняли.","e":"The second one — заменитель существительного после порядкового числительного; it без артикля в таком виде не используется."},{"q":"Her first novel was a bestseller, and ___ was her second.","a":"so","o":["so","also","too","neither"],"t":"Её первый роман стал бестселлером, и второй тоже.","e":"So + глагол + подлежащее (инверсия): so was her second; was — повторяет be."},{"q":"'You should apologise.' — 'I know I ___.'","a":"should","o":["should","do","will","would"],"t":"Тебе следует извиниться. — Знаю, что следует.","e":"Эллипсис после модального глагола: повторяем should; apologise опущено."},{"q":"Although ___ for several hours, the committee reached no decision.","a":"debating","o":["debating","debated","they debate","it debating"],"t":"Хотя комитет обсуждал вопрос несколько часов, решение принято не было.","e":"После although подлежащее и be опускаются: although (they were) debating; подлежащее совпадает с главным."},{"q":"He said he would call me, but he never ___.","a":"did","o":["did","has","would","does"],"t":"Он сказал, что позвонит мне, но так и не позвонил.","e":"Never did — прошедшее время, подстановка do вместо called me."},{"q":"I didn't want to go to the party, but I went ___ in the end.","a":"anyway","o":["anyway","so","not","one"],"t":"Я не хотел идти на вечеринку, но в итоге всё равно пошёл.","e":"Anyway — наречие уступки; so/not/one здесь не подходят по смыслу и грамматике."}]},{"id":"c1-inversion","level":"C1","title":"Инверсия после отрицательных и ограничительных слов","summary":"Never have I seen, Not only did he, Hardly had we, Had I known","rule":"<p>В формальной и выразительной речи отрицательное или ограничительное выражение выносится в начало предложения. Тогда подлежащее и вспомогательный глагол <b>меняются местами</b>, как в вопросе. Если вспомогательного глагола нет, добавляется <i>do / does / did</i>.</p><table><tr><th>Начало предложения</th><th>Пример</th></tr><tr><td>never, rarely, seldom, little</td><td><i>Rarely do we see such dedication.</i></td></tr><tr><td>not only ... but also</td><td><i>Not only did he lie, but he also stole.</i></td></tr><tr><td>hardly / scarcely / barely ... when; no sooner ... than</td><td><i>No sooner had she left than it rained.</i></td></tr><tr><td>under no circumstances, on no account, in no way</td><td><i>Under no circumstances should you open it.</i></td></tr><tr><td>only after / only when / not until</td><td><i>Only then did I understand.</i></td></tr></table><p><b>Условная инверсия</b> заменяет <i>if</i>: <i>Had I known</i> (= If I had known), <i>Were he here</i> (= If he were here), <i>Should you need help</i> (= If you should need help).</p><p><b>Инверсия с so / such:</b> <i>So tired was he that he fell asleep. Such was the noise that nobody slept.</i></p><p><b>Частая ошибка:</b> сохранять прямой порядок слов («Never I have seen...»). После <i>Hardly / No sooner</i> используется Past Perfect: <i>had we left</i>. В главной части предложения после <i>Not until ...</i> инверсия нужна именно там, где стоит главное предложение.</p>","ex":[{"q":"Never ___ such a beautiful sunset.","a":"have I seen","o":["have I seen","I have seen","I saw","did I seen"],"t":"Никогда я не видел такого красивого заката.","e":"После Never в начале предложения вспомогательный глагол стоит перед подлежащим: have I seen."},{"q":"Not only ___ late, but he also forgot the documents.","a":"did he arrive","o":["did he arrive","he arrived","arrived he","he did arrive"],"t":"Он не только опоздал, но и забыл документы.","e":"После Not only нужна инверсия, а в Past Simple добавляется did: did he arrive."},{"q":"Hardly ___ the house when it began to rain.","a":"had we left","o":["had we left","we had left","did we leave","we left"],"t":"Едва мы вышли из дома, как начался дождь.","e":"Hardly ... when: Past Perfect с инверсией, had we left."},{"q":"Under no circumstances ___ the door open.","a":"should you leave","o":["should you leave","you should leave","you leave","do you should leave"],"t":"Ни при каких обстоятельствах не оставляйте дверь открытой.","e":"После Under no circumstances модальный глагол выходит вперёд: should you leave."},{"q":"Little ___ that the plan would fail.","a":"did they know","o":["did they know","they knew","knew they","they did know"],"t":"Они и не подозревали, что план провалится.","e":"Little в значении «совсем не» требует инверсии: did they know."},{"q":"Only after the meeting ___ the truth.","a":"did she learn","o":["did she learn","she learned","learned she","she did learn"],"t":"Только после собрания она узнала правду.","e":"После Only after + обстоятельство инверсия в главной части: did she learn."},{"q":"___ I known about the delay, I would have booked another flight.","a":"Had","o":["Had","Have","Did","If had"],"t":"Знай я о задержке, я бы забронировал другой рейс.","e":"Условная инверсия вместо If I had known: Had I known."},{"q":"Should you ___ any problems, please contact us.","a":"have","o":["have","had","having","will have"],"t":"Если у вас возникнут проблемы, свяжитесь с нами.","e":"Should + подлежащее + инфинитив без to заменяет If you should have."},{"q":"No sooner ___ down than the phone rang.","a":"had she sat","o":["had she sat","she had sat","did she sit","she sat"],"t":"Едва она села, как зазвонил телефон.","e":"No sooner ... than: Past Perfect с инверсией, had she sat."},{"q":"Rarely ___ such dedication.","a":"do we see","o":["do we see","we see","see we","we do see"],"t":"Редко мы видим такую самоотдачу.","e":"Rarely в начале требует вспомогательного глагола перед подлежащим: do we see."},{"q":"On no account ___ luggage be left unattended.","a":"may","o":["may","is","does","has"],"t":"Ни в коем случае нельзя оставлять багаж без присмотра.","e":"После On no account нужен модальный глагол перед подлежащим: may luggage be left."},{"q":"Had it not been for your help, we ___ failed.","a":"would have","o":["would have","would","had","will have"],"t":"Если бы не ваша помощь, мы бы потерпели неудачу.","e":"Третий тип условного предложения: главная часть с would have + V3."},{"q":"So tired ___ that he fell asleep at his desk.","a":"was he","o":["was he","he was","did he","he is"],"t":"Он был так утомлён, что заснул за столом.","e":"После So + прилагательное в начале предложения инверсия: was he."},{"q":"Such ___ the noise that nobody could sleep.","a":"was","o":["was","were","did","had"],"t":"Шум был такой, что никто не мог уснуть.","e":"Such + was + существительное в единственном числе: Such was the noise."},{"q":"Not until the lights went out ___ how dark it was.","a":"did he realise","o":["did he realise","he realised","realised he","he did realise"],"t":"Только когда погас свет, он осознал, как темно.","e":"Инверсия нужна в главной части после Not until-оборота: did he realise."}]},{"id":"c1-nominalisation-academic","level":"C1","title":"Номинализация в академическом стиле","summary":"Как превращать глаголы и прилагательные в существительные","rule":"<p><b>Номинализация</b> — превращение глагола или прилагательного в существительное (<i>decide → decision</i>, <i>different → difference</i>). Это ключевая черта академического и делового английского: текст становится плотнее, безличнее и «весомее».</p>\n<table><tr><th>Разговорный стиль</th><th>Академический стиль</th></tr>\n<tr><td>People <i>decided</i> quickly, which surprised us.</td><td>The speed of their <i>decision</i> surprised us.</td></tr>\n<tr><td>Prices <i>rose</i> sharply.</td><td>There was a sharp <i>rise</i> in prices.</td></tr>\n<tr><td>We need to <i>analyse</i> the data.</td><td>An <i>analysis</i> of the data is needed.</td></tr></table>\n<p><b>Типичные суффиксы:</b></p><ul><li><i>-tion / -sion</i>: investigate → investigation, conclude → conclusion;</li><li><i>-ment</i>: develop → development, assess → assessment;</li><li><i>-ance / -ence</i>: perform → performance, differ → difference;</li><li><i>-ity / -ness</i>: able → ability, aware → awareness;</li><li><i>-al</i>: refuse → refusal, arrive → arrival; без суффикса: <i>a rise, an increase, a decline</i> (ударение меняется: <i>to inCREASE — an INcrease</i>).</li></ul>\n<p><b>Как строится фраза.</b> Исполнитель действия переходит в <i>of</i>-группу или притяжательную форму, а глагол-связка заменяется «смысловым» глаголом: <i>Scientists failed to replicate the results → The failure to replicate the results</i> <i>led to / resulted in / gave rise to ...</i> Частые глаголы-носители: <i>lead to, result in, account for, contribute to, undermine, bring about</i>.</p>\n<p><b>Предостережение.</b> Избыток номинализаций делает текст тяжёлым. Если в предложении несколько существительных подряд (<i>the implementation of the evaluation of the reform</i>), верните часть смысла в глаголы. Используйте номинализацию, чтобы связывать предложения: <i>Prices rose. This rise (this increase) ...</i> — слово <i>this</i> + существительное подхватывает всю предыдущую мысль.</p>","ex":[{"q":"The government ___ the policy led to widespread protests.","a":"'s abolition of","o":["'s abolition of","abolishing of","abolish of","abolished"],"t":"Отмена политики правительством привела к массовым протестам.","e":"Номинализация: abolition (сущ.) + притяжательная форма/of; глагольные формы здесь не подходят."},{"q":"There has been a steady ___ in the number of students.","a":"increase","o":["increase","increasing of","increased","increasingly"],"t":"Наблюдается неуклонный рост числа студентов.","e":"После артикля/прилагательного нужно существительное: increase."},{"q":"The ___ of the experiment was due to poorly calibrated equipment.","a":"failure","o":["failure","failing to","fail","failed"],"t":"Неудача эксперимента была вызвана плохо настроенным оборудованием.","e":"После the нужно существительное failure; fail — глагол."},{"q":"Her ___ to the problem impressed the committee.","a":"response","o":["response","responding","responsive","respond"],"t":"Её реакция на проблему впечатлила комитет.","e":"Существительное response (response to). Прилагательное responsive и глагол здесь невозможны."},{"q":"The ___ of new evidence forced a reassessment of the theory.","a":"emergence","o":["emergence","emerging of","emergent","emerged"],"t":"Появление новых данных вынудило пересмотреть теорию.","e":"Emergence — существительное от emerge; после the + of-группа."},{"q":"Economists are concerned about the ___ of inflation.","a":"persistence","o":["persistence","persistent","persisting","persist"],"t":"Экономистов беспокоит устойчивость инфляции.","e":"После the нужно существительное persistence; persistent — прилагательное."},{"q":"The study's findings ___ to a better understanding of memory.","a":"contributed","o":["contributed","contribution","contributing of","contributory"],"t":"Результаты исследования способствовали лучшему пониманию памяти.","e":"Нужен глагол в роли сказуемого: contributed to (существительное understanding уже есть)."},{"q":"The company's ___ to adapt resulted in its collapse.","a":"inability","o":["inability","unable","not able","disabling"],"t":"Неспособность компании адаптироваться привела к её краху.","e":"После притяжательного нужно существительное: inability (от unable)."},{"q":"Rapid urbanisation has given ___ to numerous social problems.","a":"rise","o":["rise","raise","rising","arising"],"t":"Быстрая урбанизация породила множество социальных проблем.","e":"Устойчивое выражение give rise to; raise так не употребляется."},{"q":"Which is the most formal rewording of 'They investigated the cause carefully'? A careful ___ of the cause was carried out.","a":"investigation","o":["investigation","investigate","investigated","investigating"],"t":"Тщательное расследование причины было проведено.","e":"После прилагательного careful нужно существительное: investigation."},{"q":"The report draws attention to the ___ of existing safety regulations.","a":"inadequacy","o":["inadequacy","inadequate","inadequately","adequate"],"t":"В докладе обращается внимание на недостаточность действующих норм безопасности.","e":"Номинализация прилагательного inadequate — inadequacy; после the … of."},{"q":"Prices rose. This ___ was largely unexpected.","a":"increase","o":["increase","increasing","increased","to increase"],"t":"Цены выросли. Этот рост был в основном неожиданным.","e":"This + существительное подхватывает предыдущую мысль; increase — сущ."},{"q":"The ___ of the two variables is not yet fully understood.","a":"relationship","o":["relationship","relating","relative","relate"],"t":"Взаимосвязь двух переменных пока не до конца понятна.","e":"Нужно существительное relationship; relative — прилагательное."},{"q":"Their refusal ___ the terms delayed the agreement.","a":"to accept","o":["to accept","accepting of","acceptance","accepted"],"t":"Их отказ принять условия задержал соглашение.","e":"Refusal сохраняет глагольное управление: refusal to + infinitive."}]},{"id":"c1-participle-clauses","level":"C1","title":"Причастные обороты (participle clauses)","summary":"Having finished, Built in 1200, Not knowing, With the door open","rule":"<p><b>Participle clauses</b> сокращают придаточные предложения и делают речь компактной. Подлежащее у причастия обычно <b>то же, что и в главном предложении</b>.</p><table><tr><th>Форма</th><th>Значение</th><th>Пример</th></tr><tr><td>V-ing</td><td>активное, одновременное действие</td><td><i>Opening the door, she noticed the window.</i></td></tr><tr><td>Having + V3</td><td>активное, действие раньше</td><td><i>Having finished the report, he went home.</i></td></tr><tr><td>V3 / Being + V3</td><td>пассивное значение</td><td><i>Built in 1200, the castle is now a museum.</i></td></tr><tr><td>Having been + V3</td><td>пассивное, раньше</td><td><i>Having been warned, we stayed at home.</i></td></tr><tr><td>Not + причастие</td><td>отрицание</td><td><i>Not knowing what to do, she asked a friend.</i></td></tr></table><p><b>Определительные обороты</b> заменяют придаточные с who / which: <i>The woman sitting next to me (= who was sitting)</i>; <i>The letters sent yesterday (= which were sent)</i>.</p><p><b>Дополнительные модели:</b></p><ul><li>После союзов и предлогов: <i>Although feeling tired, he kept working. On opening the door...</i></li><li>Абсолютная конструкция <i>with + объект + причастие</i>: <i>With the children put to bed, we relaxed.</i></li><li>Результат или сопутствующее действие: <i>He left, slamming the door.</i></li></ul><p><b>Частая ошибка:</b> «висящее» причастие с другим подлежащим. Неверно: <i>Walking down the street, the rain started.</i> Нужно: <i>Walking down the street, I felt the rain.</i></p>","ex":[{"q":"___ the report, he went home.","a":"Having finished","o":["Having finished","Finished","To finish","Being finished"],"t":"Закончив отчёт, он пошёл домой.","e":"Действие завершилось раньше, поэтому Having + V3."},{"q":"___ by the noise, the baby started to cry.","a":"Frightened","o":["Frightened","Frightening","To frighten","Having frightened"],"t":"Напуганный шумом, малыш заплакал.","e":"Ребёнка напугали, значение пассивное: причастие V3."},{"q":"On ___ the door, she noticed the broken window.","a":"opening","o":["opening","opened","to open","having opened"],"t":"Открыв дверь, она заметила разбитое окно.","e":"После предлога on идёт V-ing, это почти одновременное действие."},{"q":"The woman ___ nex
