<style>

:root{--bg:#F4F6FA;--surface:#FFFFFF;--ink:#111B33;--mute:#5B6785;--line:#DDE3EE;--accent:#2D5BFF;--accent-ink:#FFFFFF;--soft:#E8EEFF;--ok:#14935F;--okbg:#DDF5EA;--bad:#D6403A;--badbg:#FBE4E2;

:root[data-theme="dark"]{--bg:#0D1322;--surface:#151D31;--ink:#E8ECF7;--mute:#94A0BD;--line:#26304A;--accent:#6C8CFF;--accent-ink:#0D1322;--soft:#1C2748;--ok:#3DD598;--okbg:#12362B;--bad:#FF7A74;--badbg:#3A1D1F;color-scheme:dark}

body{background:var(--bg);color:var(--ink);font:16px/1.5 var(--body);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 48px}
.wrap{max-width:880px;margin:0 auto}
h1,h2,h3{font-family:var(--display);font-weight:500;margin:0;text-wrap:balance;letter-spacing:-.01em}
h2{font-size:1.25rem}h3{font-size:1rem}
button,input,textarea,select{font:inherit;color:inherit}

:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}

.bar{display:flex;align-items:center;gap:16px;padding-block:12px;flex-wrap:wrap}
.logo{font-family:var(--display);font-weight:700;font-size:1.05rem;display:flex;align-items:center;gap:8px;margin-right:auto}

.stage{min-height:260px;display:grid;gap:16px;align-content:center;text-align:center}
.word{font-family:var(--display);font-size:clamp(1.6rem,6vw,2.4rem);font-weight:500;overflow-wrap:anywhere}
.ex{font-style:italic;color:var(--mute)}
.opts{display:grid;gap:10px}
.opt{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:14px 16px;text-align:left;font-weight:500}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt.good{background:var(--okbg);border-color:var(--ok);color:var(--ok)}
.opt.wrong{background:var(--badbg);border-color:var(--bad);color:var(--bad)}
.inp{width:100%;padding:14px 16px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-size:1.2rem;text-align:center}

тив","Prospect theory describes how people evaluate outcomes as gains and losses relative to a reference point."],["loss aversion","неприятие потерь","Loss aversion implies that losses loom larger than equivalent gains in the valuation of options."],["expected utility theory","теория ожидаемой полезности","Expected utility theory serves as a normative standard against which actual choices are compared."],["subjective expected utility","субъективная ожидаемая полезность","Choices were modeled as maximization of subjective expected utility based on personal probabilities and values."],["bounded rationality","ограниченная рациональность","Bounded rationality emphasizes that decision makers operate under limits of time, information and computational capacity."],["satisficing","удовлетворение критерию достаточности (сатисфайсинг)","Satisficing individuals accept the first option that meets their aspiration level instead of seeking the optimum."],["intertemporal choice","межвременной выбор","Intertemporal choice involves trade-offs between outcomes occurring at different points in time."],["delay discounting","временное (отсроченное) обесценивание","Steeper delay discounting was associated with a stronger preference for immediate smaller rewards."],["hyperbolic discounting","гиперболическое дисконтирование","Hyperbolic discounting produces preference reversals as a reward approaches in time."],["nudge","подталкивание (нудж)","A nudge alters behavior predictably without forbidding options or significantly changing economic incentives."],["choice architecture","архитектура выбора","Choice architecture shapes decisions through the way options are organized and presented."],["risk aversion","неприятие риска","Risk aversion was observed predominantly in the domain of gains, whereas risk seeking prevailed for losses."],["reference point","точка отсчёта","Outcomes were evaluated relative to a reference point rather than in terms of final wealth."],["probability weighting","взвешивание вероятностей","Probability weighting reflects overestimation of small probabilities and underestimation of moderate and large ones."],["certainty effect","эффект определённости","The certainty effect causes outcomes that are certain to be overweighted relative to merely probable ones."],["ambiguity aversion","неприятие неопределённости (неоднозначности)","Ambiguity aversion was demonstrated by a preference for known probabilities over unknown ones."],["decision under uncertainty","принятие решений в условиях неопределённости","Decision under uncertainty often relies on simplifying strategies rather than exhaustive probabilistic calculation."],["decision making","принятие решений","Research on decision making has increasingly integrated behavioral and neuroscientific methods."],["judgment and decision making","суждения и принятие решений","The field of judgment and decision making examines how people evaluate evidence and select among options."],["regret","сожаление","Anticipated regret influenced participants to avoid options whose unfavorable outcomes could be attributed to their own choice."],["choice overload","избыток выбора","Choice overload decreased satisfaction and purchase rates when an extensive assortment was presented."],["need for cognition","потребность в познании","Individuals high in need for cognition engage in effortful analytic thinking more readily."],["actively open-minded thinking","активное открытое мышление","Actively open-minded thinking predicted greater willingness to revise beliefs in light of disconfirming evidence."],["crystallized intelligence","кристаллизованный интеллект","Crystallized intelligence reflects accumulated knowledge and verbal skills and remains stable into later adulthood."],["g factor","генеральный фактор интеллекта (g-фактор)","The g factor accounts for the positive correlations observed among diverse cognitive ability tests."],["intelligence quotient","коэффициент интеллекта (IQ)","The intelligence quotient is const GR=[{"id":"a1-to-be","level":"A1","title":"Глагол to be: am, is, are","summary":"Я, ты, он: утверждения, отрицания, вопросы","rule":"<p>Глагол <b>to be</b> («быть») в настоящем времени имеет три формы. В русском мы его обычно не произносим, а в английском предложение без него невозможно.</p><table><tr><th>Лицо</th><th>Форма</th><th>Пример</th></tr><tr><td>I</td><td>am</td><td>I am a student.</td></tr><tr><td>he / she / it</td><td>is</td><td>She is at home.</td></tr><tr><td>you / we / they</td><td>are</td><td>They are friends.</td></tr></table><p><b>Отрицание:</b> добавляем <i>not</i> после глагола: <i>He is not (isn't) tired.</i> — Он не устал. <i>I am not hungry.</i> — Я не голоден.</p><p><b>Вопрос:</b> глагол выходит вперёд: <i>Are you ready?</i> — Ты готов? <i>Is she your sister?</i> — Она твоя сестра?</p><p>Краткие формы: I'm, he's, she's, we're, they're, isn't, aren't.</p><p><b>Частая ошибка:</b> пропуск глагола. Нельзя сказать <i>She a doctor</i> или <i>They at school</i>. Нужно: <i>She is a doctor. They are at school.</i></p>","ex":[{"q":"She ___ a teacher.","a":"is","o":["am","is","are"],"t":"Она учитель.","e":"С she, he, it используем is."},{"q":"I ___ from Russia.","a":"am","o":["is","are","am"],"t":"Я из России.","e":"Только с I используется форма am."},{"q":"We ___ at school now.","a":"are","o":["is","am","are","be"],"t":"Сейчас мы в школе.","e":"С we, you, they используем are."},{"q":"It ___ a big dog.","a":"is","o":["are","am","is"],"t":"Это большая собака.","e":"С it используем is."},{"q":"They ___ my friends.","a":"are","o":["is","am","are"],"t":"Они мои друзья.","e":"С they используем are."},{"q":"My brother ___ ten years old.","a":"is","o":["are","am","is","be"],"t":"Моему брату десять лет.","e":"My brother = he, поэтому is."},{"q":"Tom and Anna ___ at home.","a":"are","o":["is","am","are"],"t":"Том и Анна дома.","e":"Два человека = they, поэтому are."},{"q":"I ___ not hungry.","a":"am","o":["is","are","am"],"t":"Я не голоден.","e":"С I всегда am, отрицание: am not."},{"q":"He ___ not tired.","a":"is","o":["are","am","is"],"t":"Он не устал.","e":"С he используем is: is not (isn't)."},{"q":"You ___ not late.","a":"are","o":["is","am","are"],"t":"Ты не опоздал.","e":"С you используем are: are not (aren't)."},{"q":"She ___ at home. She is at work.","a":"isn't / is not","o":["isn't","aren't","am not","don't"],"t":"Её нет дома. Она на работе.","e":"С she в отрицании: is not (isn't)."},{"q":"___ you ready?","a":"Are","o":["Is","Am","Are","Do"],"t":"Ты готов?","e":"В вопросе глагол стоит перед you: Are you...?"},{"q":"___ she your sister?","a":"Is","o":["Are","Am","Is","Do"],"t":"Она твоя сестра?","e":"С she в вопросе: Is she...?"},{"q":"___ I late?","a":"Am","o":["Is","Are","Am","Do"],"t":"Я опоздал?","e":"Вопрос с I: Am I...?"},{"q":"Where ___ your keys?","a":"are","o":["is","am","are","be"],"t":"Где твои ключи?","e":"Keys во множественном числе, поэтому are."},{"q":"The books ___ on the table.","a":"are","o":["is","am","are"],"t":"Книги на столе.","e":"Books = they, поэтому are."}]},{"id":"a1-articles","level":"A1","title":"Артикли a, an, the","summary":"Когда ставить a, an или the","rule":"<p>В английском перед существительным часто нужен артикль. Русского аналога нет, поэтому его надо запомнить.</p><ul><li><b>a</b> — перед согласным звуком: <i>a book</i> — книга, <i>a car</i> — машина.</li><li><b>an</b> — перед гласным звуком: <i>an apple</i> — яблоко, <i>an hour</i> — час (h не читается).</li><li><b>the</b> — когда ясно, о чём речь: <i>The dog is big.</i> — Собака большая.</li></ul><p><b>a / an</b> значат «один из многих» и ставятся только перед исчисляемым существительным в единственном числе. Мы используем их, когда говорим о предмете впервые или называем профессию: <i>She is a doctor.</i> — Она врач. <i>I have an egg.</i> — У меня есть яйцо.</p><p><b>the</b> ставим, когда предмет уже упоминался или он единственный: <i>I see a cat. The cat is black.</i> — Я вижу кошку. Кошка чёрная. <i>The sun is hot.</i> — Солнце жаркое.</p><p>Выбор a или an зависит от <b>звука</b>, а не от буквы: <i>a university</i> (звук «ю»), <i>an umbrella</i>.</p><p><b>Частая ошибка:</b> пропуск артикля. Нельзя сказать <i>I have dog</i> или <i>She is teacher</i>. Нужно: <i>I have a dog. She is a teacher.</i></p>","ex":[{"q":"I have ___ apple.","a":"an","o":["a","an","the"],"t":"У меня есть яблоко.","e":"Apple начинается с гласного звука, поэтому an."},{"q":"She is ___ doctor.","a":"a","o":["an","a","the"],"t":"Она врач.","e":"Профессия: a, doctor начинается с согласного звука."},{"q":"It is ___ red car.","a":"a","o":["an","a","the"],"t":"Это красная машина.","e":"Red начинается с согласного звука, поэтому a."},{"q":"My sister is ___ engineer.","a":"an","o":["a","an","the"],"t":"Моя сестра инженер.","e":"Engineer начинается с гласного звука, поэтому an."},{"q":"I see a cat. ___ cat is black.","a":"The","o":["A","An","The"],"t":"Я вижу кошку. Кошка чёрная.","e":"Кошка уже упоминалась, поэтому the."},{"q":"___ sun is hot today.","a":"The","o":["A","An","The"],"t":"Сегодня солнце жаркое.","e":"Солнце одно на всех, поэтому the."},{"q":"What ___ nice day!","a":"a","o":["an","a","the"],"t":"Какой хороший день!","e":"В восклицании What a... перед исчисляемым существительным ставится a."},{"q":"Moscow is ___ capital of Russia.","a":"the","o":["a","an","the"],"t":"Москва — столица России.","e":"Столица одна, поэтому the."},{"q":"He is ___ honest man.","a":"an","o":["a","an","the"],"t":"Он честный человек.","e":"Буква h не читается, звук гласный, поэтому an."},{"q":"She is ___ university student.","a":"a","o":["an","a","the"],"t":"Она студентка университета.","e":"Слово university начинается со звука «ю», поэтому a."},{"q":"She plays ___ piano.","a":"the","o":["a","an","the"],"t":"Она играет на пианино.","e":"С названиями музыкальных инструментов после play ставится the."},{"q":"It is ___ interesting book.","a":"an","o":["a","an","the"],"t":"Это интересная книга.","e":"Interesting начинается с гласного звука, поэтому an."},{"q":"There is a table in the room. ___ table is old.","a":"The","o":["A","An","The"],"t":"В комнате есть стол. Стол старый.","e":"Стол уже упоминался, поэтому the."},{"q":"Look at ___ moon!","a":"the","o":["a","an","the"],"t":"Посмотри на луну!","e":"Луна одна, поэтому the."},{"q":"We have ___ hour for lunch.","a":"an","o":["a","an","the"],"t":"У нас есть час на обед.","e":"Hour начинается с гласного звука (h не читается), поэтому an."}]},{"id":"a1-plural-nouns","level":"A1","title":"Множественное число существительных","summary":"Books, boxes, cities, children, men","rule":"<p>Чтобы образовать множественное число, к существительному обычно добавляют <b>-s</b>: <i>a book — books</i>.</p><table><tr><th>Правило</th><th>Пример</th></tr><tr><td>-s, -x, -ch, -sh, -ss → <b>-es</b></td><td>bus — buses, box — boxes, dish — dishes</td></tr><tr><td>согласная + y → <b>-ies</b></td><td>city — cities, baby — babies</td></tr><tr><td>гласная + y → <b>-s</b></td><td>day — days, boy — boys</td></tr><tr><td>-f / -fe → <b>-ves</b></td><td>knife — knives, leaf — leaves</td></tr></table><p><b>Особые формы</b> нужно запомнить: man — men, woman — women, child — children, foot — feet, tooth — teeth, person — people. У слова <i>sheep</i> форма не меняется: one sheep, two sheep.</p><p>Примеры: <i>I have two brothers.</i> — У меня два брата. <i>The children are in the garden.</i> — Дети в саду. <i>There are many people here.</i> — Здесь много людей.</p><p><b>Частая ошибка:</b> добавлять -s к особым формам: <i>childs, mans, foots</i>. Правильно: <i>children, men, feet</i>. Также после числительных нужно множественное число: <i>two books</i>, а не <i>two book</i>.</p>","ex":[{"q":"One book, two ___.","a":"books","o":["bookes","books","bookies"],"t":"Одна книга, две книги.","e":"Обычное правило: добавляем -s."},{"q":"One day, three ___.","a":"days","o":["daies","days","dayes"],"t":"Один день, три дня.","e":"Перед y стоит гласная, поэтому просто -s."},{"q":"One box, three ___.","a":"boxes","o":["boxs","boxes","boxies"],"t":"Одна коробка, три коробки.","e":"После -x добавляем -es."},{"q":"One bus, five ___.","a":"buses","o":["buss","buses","busies"],"t":"Один автобус, пять автобусов.","e":"После -s добавляем -es."},{"q":"One dish, two ___.","a":"dishes","o":["dishs","dishes","dishies"],"t":"Одно блюдо, два блюда.","e":"После -sh добавляем -es."},{"q":"One city, two ___.","a":"cities","o":["citys","cities","cityes"],"t":"Один город, два города.","e":"Согласная + y: меняем y на -ies."},{"q":"One baby, two ___.","a":"babies","o":["babys","babies","babyes"],"t":"Один малыш, два малыша.","e":"Согласная + y: меняем y на -ies."},{"q":"One knife, two ___.","a":"knives","o":["knifes","knives","knifies"],"t":"Один нож, два ножа.","e":"Слова на -fe меняют окончание на -ves."},{"q":"One man, two ___.","a":"men","o":["mans","mens","men"],"t":"Один мужчина, два мужчины.","e":"Особая форма: man — men."},{"q":"One woman, three ___.","a":"women","o":["womans","womens","women"],"t":"Одна женщина, три женщины.","e":"Особая форма: woman — women."},{"q":"She has one child, but he has three ___.","a":"children","o":["childs","childrens","children"],"t":"У неё один ребёнок, а у него трое детей.","e":"Особая форма: child — children."},{"q":"One foot, two ___.","a":"feet","o":["foots","feets","feet"],"t":"Одна ступня, две ступни.","e":"Особая форма: foot — feet."},{"q":"One tooth, many ___.","a":"teeth","o":["tooths","teeths","teeth"],"t":"Один зуб, много зубов.","e":"Особая форма: tooth — teeth."},{"q":"There are many ___ in the park.","a":"people","o":["peoples","people","peoplees"],"t":"В парке много людей.","e":"People — особая форма множественного числа, без -s."},{"q":"One sheep, two ___.","a":"sheep","o":["sheeps","sheepes","sheep"],"t":"Одна овца, две овцы.","e":"У слова sheep форма не меняется."}]},{"id":"a1-this-that","level":"A1","title":"This, that, these, those","summary":"Этот, тот, эти, те: близко и далеко","rule":"<p>Эти слова называются <b>указательными местоимениями</b>. Они показывают, близко предмет или далеко, один он или несколько.</p><table><tr><th></th><th>Близко (здесь)</th><th>Далеко (там)</th></tr><tr><td>Один предмет</td><td><b>this</b> — этот</td><td><b>that</b> — тот</td></tr><tr><td>Много предметов</td><td><b>these</b> — эти</td><td><b>those</b> — те</td></tr></table><p>Примеры: <i>This is my book.</i> — Это моя книга (в моих руках). <i>That is a big house.</i> — То большой дом (вдали). <i>These apples are red.</i> — Эти яблоки красные. <i>Those boys are my friends.</i> — Те мальчики мои друзья.</p><p>Эти слова можно ставить перед существительным: <i>this bag, that car, these shoes, those flowers</i>. Глагол согласуется с числом: <i>This is..., These are...</i></p><p>Вопросы: <i>What is this?</i> — Что это? <i>Who are those people?</i> — Кто эти люди (там)?</p><p><b>Частая ошибка:</b> смешивать единственное и множественное число: <i>this shoes</i> или <i>these book</i>. Правильно: <i>these shoes, this book</i>. Также помните: <i>that</i> и <i>those</i> — про дальние предметы, а не просто «тот».</p>","ex":[{"q":"___ is my phone, here on the table.","a":"This","o":["That","These","Those","This"],"t":"Это мой телефон, вот здесь на столе.","e":"Предмет рядом и один: this."},{"q":"___ book in my hand is new.","a":"This","o":["That","These","Those","This"],"t":"Эта книга в моей руке новая.","e":"Предмет рядом и один: this."},{"q":"___ house over there is big.","a":"That","o":["This","These","That"],"t":"Тот дом вон там большой.","e":"Предмет далеко и один: that."},{"q":"Take ___ chair here, please.","a":"this","o":["that","these","those","this"],"t":"Возьми вот этот стул, пожалуйста.","e":"Стул рядом и один: this."},{"q":"___ shoes here are mine.","a":"These","o":["This","That","Those","These"],"t":"Эти туфли здесь мои.","e":"Предметы рядом и их несколько: these."},{"q":"___ are my keys, right here.","a":"These","o":["This","That","Those","These"],"t":"Это мои ключи, вот они.","e":"Ключи рядом и их несколько: these."},{"q":"___ mountains over there are beautiful.","a":"Those","o":["These","This","That","Those"],"t":"Те горы вдали красивые.","e":"Предметы далеко и их несколько: those."},{"q":"Look at ___ cat on the roof over there!","a":"that","o":["this","these","those","that"],"t":"Посмотри на ту кошку на крыше вон там!","e":"Кошка далеко и одна: that."},{"q":"Is ___ your bag here next to me?","a":"this","o":["that","these","those","this"],"t":"Это твоя сумка здесь рядом со мной?","e":"Сумка рядом и одна: this."},{"q":"What are ___ over there? They are birds.","a":"those","o":["these","this","that","those"],"t":"Что это там вдали? Это птицы.","e":"Они далеко и их несколько: those."},{"q":"I like ___ flowers in my hands.","a":"these","o":["this","that","those","these"],"t":"Мне нравятся эти цветы в моих руках.","e":"Цветы рядом и их несколько: these."},{"q":"___ man over there is my teacher.","a":"That","o":["This","These","Those","That"],"t":"Тот мужчина вон там мой учитель.","e":"Человек далеко и один: that."},{"q":"How much are ___ apples here?","a":"these","o":["this","that","those","these"],"t":"Сколько стоят эти яблоки здесь?","e":"Яблоки рядом и их несколько: these."},{"q":"Who is ___ girl over there?","a":"that","o":["this","these","those","that"],"t":"Кто та девочка вон там?","e":"Девочка далеко и одна: that."},{"q":"___ cars on the street over there are fast.","a":"Those","o":["This","That","These","Those"],"t":"Те машины на улице вдали быстрые.","e":"Машины далеко и их несколько: those."}]},{"id":"a1-possessives","level":"A1","title":"Притяжательные местоимения и 's","summary":"My, your, his, her и Tom's","rule":"<p>Притяжательные местоимения показывают, кому что принадлежит. Они стоят <b>перед существительным</b> и не изменяются по числу.</p><table><tr><th>Кто</th><th>Форма</th><th>Пример</th></tr><tr><td>I</td><td>my</td><td>my dog</td></tr><tr><td>you</td><td>your</td><td>your car</td></tr><tr><td>he / she / it</td><td>his / her / its</td><td>his sister, her brother, its food</td></tr><tr><td>we / they</td><td>our / their</td><td>our house, their cat</td></tr></table><p><b>Притяжательный падеж</b>: к имени или существительному добавляем <b>'s</b>: <i>Tom's bag</i> — сумка Тома, <i>my father's car</i> — машина моего отца. Если слово во множественном числе заканчивается на -s, ставим только апостроф: <i>the boys' room</i>. У неправильных форм: <i>the children's toys</i>.</p><p>Примеры: <i>This is my book.</i> — Это моя книга. <i>She loves her job.</i> — Она любит свою работу. <i>That is Anna's coat.</i> — Это пальто Анны.</p><p><b>Частая ошибка:</b> путать <i>his</i> и <i>her</i>. Выбор зависит от <b>владельца</b>, а не от предмета: <i>He has a sister. His sister is nice.</i> Также нельзя путать <i>its</i> (принадлежность) и <i>it's</i> (it is).</p>","ex":[{"q":"I have a dog. ___ dog is big.","a":"My","o":["Me","Mine","I","My"],"t":"У меня есть собака. Моя собака большая.","e":"К I относится притяжательное my."},{"q":"Anna, where are ___ shoes?","a":"your","o":["you","yours","you're","your"],"t":"Анна, где твои туфли?","e":"Обращаемся к Анне (you), значит your."},{"q":"He has a sister. ___ sister is nice.","a":"His","o":["Her","He","Him","His"],"t":"У него есть сестра. Его сестра милая.","e":"Владелец он (he), значит his."},{"q":"She has a brother. ___ brother is tall.","a":"Her","o":["His","She","Hers","Her"],"t":"У неё есть брат. Её брат высокий.","e":"Владелец она (she), значит her."},{"q":"We have a house. ___ house is old.","a":"Our","o":["We","Ours","Us","Our"],"t":"У нас есть дом. Наш дом старый.","e":"К we относится our."},{"q":"They have a cat. ___ cat is white.","a":"Their","o":["There","They","Theirs","Their"],"t":"У них есть кошка. Их кошка белая.","e":"К they относится their."},{"q":"The cat likes ___ food.","a":"its","o":["it's","it","their","its"],"t":"Кошка любит свою еду.","e":"Its — притяжательное для it, it's значит it is."},{"q":"Tom and I are friends. ___ school is near.","a":"Our","o":["Their","My","Your","Our"],"t":"Мы с Томом друзья. Наша школа рядом.","e":"Tom and I = we, значит our."},{"q":"My parents are at home. ___ house is big.","a":"Their","o":["Our","His","Her","Their"],"t":"Мои родители дома. Их дом большой.","e":"Parents = they, значит their."},{"q":"John is here with ___ wife.","a":"his","o":["her","him","he","his"],"t":"Джон здесь со своей женой.","e":"Владелец John (он), значит his."},{"q":"My sister likes ___ job.","a":"her","o":["his","she","hers","her"],"t":"Моей сестре нравится её работа.","e":"Сестра — она, значит her."},{"q":"Peter, is this ___ coat?","a":"your","o":["you","my","yours","your"],"t":"Питер, это твоё пальто?","e":"Обращаемся к Питеру (you), значит your."},{"q":"It is my father's bag. Whose bag is it? It is my ___ bag.","a":"father's","o":["fathers","fathers'","father's"],"t":"Это сумка моего отца. Чья она? Это сумка моего отца.","e":"Для одного владельца добавляем 's."},{"q":"The ___ toys are on the floor.","a":"children's","o":["childrens","childrens'","children's"],"t":"Игрушки детей лежат на полу.","e":"Children — особая форма множественного числа, добавляем 's."},{"q":"Lucy has a mother. ___ mother is a nurse.","a":"Her","o":["His","She","Hers","Her"],"t":"У Люси есть мама. Её мама медсестра.","e":"Lucy — она, значит her."}]},{"id":"a1-can-cant","level":"A1","title":"Can / Can't: умения и возможности","summary":"Что я умею и что мне разрешено","rule":"<p><b>Can</b> — модальный глагол, он означает «могу, умею» или «можно». Для всех лиц форма одна и та же, окончание -s не добавляется.</p><table><tr><th>Форма</th><th>Пример</th></tr><tr><td>Утверждение</td><td>I can swim. She can drive.</td></tr><tr><td>Отрицание: cannot / can't</td><td>He can't dance.</td></tr><tr><td>Вопрос: Can + подлежащее + глагол?</td><td>Can you help me?</td></tr></table><ul><li>После can глагол стоит в начальной форме, без <i>to</i>: <i>I can swim</i>, а не «I can to swim».</li><li>Do / does не нужны: <i>Can she cook?</i>, а не «Does she can cook?»</li><li>Краткие ответы: <i>Yes, I can. / No, I can't.</i></li></ul><p><i>Can I open the window?</i> — Можно мне открыть окно? (просьба)<br><i>My brother can play the guitar.</i> — Мой брат умеет играть на гитаре.</p><p><b>Частая ошибка:</b> «She cans swim». Правильно: <i>She can swim.</i></p>","ex":[{"q":"I ___ swim very well.","a":"can","o":["can","cans","am can","do can"],"t":"Я очень хорошо плаваю.","e":"Can не меняется по лицам."},{"q":"She ___ speak three languages.","a":"can","o":["can","cans","can to","is can"],"t":"Она говорит на трёх языках.","e":"С she тоже просто can, без -s."},{"q":"He ___ drive a car.","a":"can't","o":["can't","don't","isn't","doesn't"],"t":"Он не умеет водить машину.","e":"Отрицание: can't."},{"q":"___ you play the piano?","a":"Can","o":["Can","Do","Are","Does"],"t":"Ты умеешь играть на пианино?","e":"Вопрос начинается с can."},{"q":"Can you help me? — Yes, I ___.","a":"can","o":["can","do","am","help"],"t":"Ты можешь мне помочь? — Да.","e":"Краткий ответ повторяет can."},{"q":"Can he cook? — No, he ___.","a":"can't","o":["can't","doesn't","isn't","don't"],"t":"Он умеет готовить? — Нет.","e":"Краткий ответ: can't."},{"q":"They can ___ English well.","a":"speak","o":["speak","speaks","to speak","speaking"],"t":"Они хорошо говорят по-английски.","e":"После can глагол в начальной форме."},{"q":"My dog can ___ a ball.","a":"catch","o":["catch","catches","to catch","catching"],"t":"Моя собака умеет ловить мяч.","e":"После can нет -s и нет to."},{"q":"I ___ see you. It is too dark.","a":"can't","o":["can't","can","don't","am not"],"t":"Я тебя не вижу. Слишком темно.","e":"По смыслу нужно отрицание: can't."},{"q":"___ she dance?","a":"Can","o":["Can","Does","Is","Do"],"t":"Она умеет танцевать?","e":"С can вспомогательный do не нужен."},{"q":"We ___ come to the party tomorrow.","a":"can't","o":["can't","don't","aren't","cans"],"t":"Мы не можем прийти на вечеринку завтра.","e":"Отрицание от can: can't."},{"q":"___ I open the window, please?","a":"Can","o":["Can","Do","Am","Does"],"t":"Можно я открою окно?","e":"Can используется для просьбы о разрешении."},{"q":"Birds can ___.","a":"fly","o":["fly","flies","to fly","flying"],"t":"Птицы умеют летать.","e":"После can глагол без изменений."},{"q":"A fish ___ walk.","a":"can't","o":["can't","doesn't","isn't","not"],"t":"Рыба не умеет ходить.","e":"Отрицание: can't."},{"q":"What ___ you do?","a":"can","o":["can","are","does","cans"],"t":"Что ты умеешь делать?","e":"С вопросительным словом используем can."}]},{"id":"a1-prepositions-place-time","level":"A1","title":"Предлоги места и времени: in, on, at","summary":"Где и когда: in the room, on Monday, at 5","rule":"<p>Предлоги <b>in, on, at</b> используются и для места, и для времени. Русским «в» и «на» они соответствуют не всегда, поэтому лучше выучить типичные сочетания.</p><table><tr><th>Предлог</th><th>Время</th><th>Место</th></tr><tr><td><b>at</b></td><td>at 5 o'clock, at night, at the weekend</td><td>at home, at school, at work, at the bus stop</td></tr><tr><td><b>on</b></td><td>on Monday, on 5 May, on my birthday</td><td>on the table, on the wall, on the floor</td></tr><tr><td><b>in</b></td><td>in May, in 2020, in summer, in the morning</td><td>in the room, in London, in a box</td></tr></table><ul><li><b>at</b> — точка: конкретный час или место-пункт.</li><li><b>on</b> — день, дата и поверхность.</li><li><b>in</b> — более длинный период, город, страна или замкнутое пространство.</li></ul><p>Ещё: <i>under</i> (под), <i>next to</i> (рядом с), <i>between</i> (между), <i>in front of</i> (перед).</p><p><b>Частая ошибка:</b> «in Monday» или «at the morning». Правильно: <i>on Monday, in the morning.</i></p>","ex":[{"q":"The lesson starts ___ nine o'clock.","a":"at","o":["at","on","in","to"],"t":"Урок начинается в девять часов.","e":"Точное время: at."},{"q":"My birthday is ___ May.","a":"in","o":["in","on","at","of"],"t":"Мой день рождения в мае.","e":"Месяц: in."},{"q":"We have a test ___ Monday.","a":"on","o":["on","in","at","by"],"t":"У нас контрольная в понедельник.","e":"День недели: on."},{"q":"The book is ___ the table.","a":"on","o":["on","in","at","to"],"t":"Книга лежит на столе.","e":"Поверхность: on."},{"q":"She lives ___ London.","a":"in","o":["in","on","at","to"],"t":"Она живёт в Лондоне.","e":"Город: in."},{"q":"He is ___ home now.","a":"at","o":["at","in","on","to"],"t":"Сейчас он дома.","e":"Устойчивое выражение: at home."},{"q":"I get up early ___ the morning.","a":"in","o":["in","on","at","by"],"t":"Утром я рано встаю.","e":"Часть дня: in the morning."},{"q":"The cat is ___ the box.","a":"in","o":["in","on","at","to"],"t":"Кошка в коробке.","e":"Внутри чего-то: in."},{"q":"We go to bed ___ night.","a":"at","o":["at","in","on","by"],"t":"Ночью мы ложимся спать.","e":"Выражение at night."},{"q":"The picture is ___ the wall.","a":"on","o":["on","in","at","to"],"t":"Картина висит на стене.","e":"Поверхность стены: используем предлог on."},{"q":"I was born ___ 2005.","a":"in","o":["in","on","at","of"],"t":"Я родился в 2005 году.","e":"Перед годом используем предлог in."},{"q":"See you ___ the weekend!","a":"at","o":["at","in","on","to"],"t":"Увидимся на выходных!","e":"Выражение at the weekend."},{"q":"The dog is ___ the chair.","a":"under","o":["under","on","at","between"],"t":"Собака под стулом.","e":"Under означает «под»."},{"q":"My school is ___ the park.","a":"next to","o":["next to","at to","in to","on to"],"t":"Моя школа рядом с парком.","e":"Next to означает «рядом с, около»."},{"q":"We have a party ___ 5 June.","a":"on","o":["on","in","at","by"],"t":"У нас вечеринка 5 июня.","e":"Перед датой используем предлог on."}]},{"id":"a1-present-continuous","level":"A1","title":"Present Continuous: действие сейчас","summary":"Что происходит прямо сейчас: I am reading","rule":"<p><b>Present Continuous</b> описывает действие, которое происходит <b>сейчас</b>, в момент речи. Формула: <b>am / is / are + глагол с -ing</b>.</p><table><tr><th>Лицо</th><th>Форма</th><th>Пример</th></tr><tr><td>I</td><td>am</td><td>I am reading.</td></tr><tr><td>he / she / it</td><td>is</td><td>She is cooking.</td></tr><tr><td>you / we / they</td><td>are</td><td>They are playing.</td></tr></table><p><b>Отрицание:</b> <i>He isn't sleeping.</i> <b>Вопрос:</b> <i>Are you working?</i></p><p><b>Правописание -ing:</b></p><ul><li>обычно + ing: <i>work → working</i></li><li>немая -e отпадает: <i>make → making</i></li><li>короткий глагол с одной гласной и согласной: согласная удваивается: <i>run → running, sit → sitting</i></li></ul><p>Слова-подсказки: <i>now, at the moment, right now, look!</i></p><p><b>Частая ошибка:</b> «I reading» или «I am read». Нужно: <i>I am reading.</i></p>","ex":[{"q":"I ___ a book now.","a":"am reading","o":["am reading","is reading","read","are reading"],"t":"Сейчас я читаю книгу.","e":"С I используем am + глагол с -ing."},{"q":"She ___ dinner at the moment.","a":"is cooking","o":["is cooking","are cooking","cooks","am cooking"],"t":"Сейчас она готовит ужин.","e":"С she используем is + -ing."},{"q":"They ___ football now.","a":"are playing","o":["are playing","is playing","plays","am playing"],"t":"Сейчас они играют в футбол.","e":"С they используем are + -ing."},{"q":"Look! It ___.","a":"is raining","o":["is raining","rains","are raining","rain"],"t":"Смотри! Идёт дождь.","e":"Слово look! подсказывает: действие происходит сейчас."},{"q":"We ___ TV right now.","a":"are watching","o":["are watching","watch","is watching","watches"],"t":"Мы сейчас смотрим телевизор.","e":"С we используем are + -ing."},{"q":"He ___ a letter at the moment.","a":"is writing","o":["is writing","is writeing","writes","are writing"],"t":"Сейчас он пишет письмо.","e":"Немая -e отпадает: write → writing."},{"q":"The children ___ in the garden.","a":"are running","o":["are running","are runing","is running","run"],"t":"Дети бегают в саду.","e":"Короткий глагол: согласная удваивается, run → running."},{"q":"I ___ to music now.","a":"am not listening","o":["am not listening","not listening","don't listening","isn't listening"],"t":"Сейчас я не слушаю музыку.","e":"Отрицание: am + not + -ing."},{"q":"She ___ TV. She is busy.","a":"isn't watching","o":["isn't watching","doesn't watching","aren't watching","not watch"],"t":"Она не смотрит телевизор. Она занята.","e":"Отрицание с she: isn't + -ing."},{"q":"___ you working now?","a":"Are","o":["Are","Do","Is","Does"],"t":"Ты сейчас работаешь?","e":"В вопросе с you ставим are вперёд."},{"q":"___ he sleeping?","a":"Is","o":["Is","Are","Does","Do"],"t":"Он спит?","e":"В вопросе с he ставим is вперёд."},{"q":"Is she reading? — No, she ___.","a":"isn't","o":["isn't","doesn't","don't","not"],"t":"Она читает? — Нет.","e":"Краткий ответ повторяет is: isn't."},{"q":"Look at Tom! He ___ a bike.","a":"is riding","o":["is riding","is rideing","rides","are riding"],"t":"Посмотри на Тома! Он едет на велосипеде.","e":"Немая -e отпадает: ride → riding."},{"q":"The baby ___ now.","a":"is sitting","o":["is sitting","is siting","sits","are sitting"],"t":"Малыш сейчас сидит.","e":"Sit → sitting с удвоением t."},{"q":"What ___ you doing?","a":"are","o":["are","do","is","does"],"t":"Что ты делаешь?","e":"С you в Present Continuous нужен are."}]},{"id":"a1-present-simple-questions","level":"A1","title":"Present Simple: вопросы и отрицания","summary":"Do you...? She doesn't...","rule":"<p>В Present Simple вопросы и отрицания строятся с помощью вспомогательного глагола <b>do / does</b>. Смысловой глагол после него стоит в начальной форме, без -s.</p><table><tr><th>Лицо</th><th>Отрицание</th><th>Вопрос</th></tr><tr><td>I / you / we / they</td><td>do not (don't)</td><td>Do + подлежащее + глагол?</td></tr><tr><td>he / she / it</td><td>does not (doesn't)</td><td>Does + подлежащее + глагол?</td></tr></table><p><i>I don't like tea.</i> — Я не люблю чай.<br><i>She doesn't work here.</i> — Она здесь не работает.<br><i>Do you speak English?</i> — Ты говоришь по-английски?<br><i>Does he live in Moscow?</i> — Он живёт в Москве?</p><p><b>Краткие ответы:</b> <i>Yes, I do. / No, I don't. Yes, she does. / No, she doesn't.</i></p><ul><li>Окончание -s остаётся только в утверждении: <i>He works</i>, но <i>Does he work?</i></li><li>С глаголом <b>to be</b> do/does не нужен: <i>Is she a doctor?</i></li></ul><p><b>Частая ошибка:</b> «Does she works?» Правильно: <i>Does she work?</i></p>","ex":[{"q":"___ you like coffee?","a":"Do","o":["Do","Does","Are","Is"],"t":"Ты любишь кофе?","e":"С you в вопросе используем do."},{"q":"___ she live in London?","a":"Does","o":["Does","Do","Is","Has"],"t":"Она живёт в Лондоне?","e":"С she в вопросе используем does."},{"q":"I ___ like fish.","a":"don't","o":["don't","doesn't","am not","not"],"t":"Я не люблю рыбу.","e":"С I отрицание образуем с don't."},{"q":"He ___ play tennis.","a":"doesn't","o":["doesn't","don't","isn't","not"],"t":"Он не играет в теннис.","e":"С he отрицание образуем с doesn't."},{"q":"Does Tom ___ football?","a":"play","o":["play","plays","playing","to play"],"t":"Том играет в футбол?","e":"После does глагол стоит без -s."},{"q":"They ___ work on Sundays.","a":"don't","o":["don't","doesn't","aren't","not"],"t":"Они не работают по воскресеньям.","e":"С they используем don't."},{"q":"___ your parents speak French?","a":"Do","o":["Do","Does","Are","Is"],"t":"Твои родители говорят по-французски?","e":"Your parents = they, поэтому do."},{"q":"My sister doesn't ___ coffee.","a":"drink","o":["drink","drinks","drinking","drank"],"t":"Моя сестра не пьёт кофе.","e":"После doesn't глагол без -s."},{"q":"___ the shop open at nine?","a":"Does","o":["Does","Do","Is","Are"],"t":"Магазин открывается в девять?","e":"The shop = it, поэтому does."},{"q":"We ___ have a car.","a":"don't","o":["don't","doesn't","haven't not","aren't"],"t":"У нас нет машины.","e":"С we отрицание образуем с don't."},{"q":"Do you like pizza? — Yes, I ___.","a":"do","o":["do","does","am","like"],"t":"Ты любишь пиццу? — Да.","e":"Краткий ответ повторяет do."},{"q":"Does he work here? — No, he ___.","a":"doesn't","o":["doesn't","don't","isn't","not"],"t":"Он здесь работает? — Нет.","e":"Краткий ответ с he: doesn't."},{"q":"The train ___ stop here.","a":"doesn't","o":["doesn't","don't","isn't","not"],"t":"Поезд здесь не останавливается.","e":"The train = it, поэтому doesn't."},{"q":"___ you get up early?","a":"Do","o":["Do","Does","Are","Have"],"t":"Ты рано встаёшь?","e":"С you в вопросе используем do."},{"q":"Where ___ he work?","a":"does","o":["does","do","is","has"],"t":"Где он работает?","e":"После вопросительного слова с he идёт does."}]},{"id":"a1-present-simple","level":"A1","title":"Present Simple: утверждение","summary":"Привычки и факты: I work, she works","rule":"<p><b>Present Simple</b> рассказывает о том, что происходит регулярно, о привычках, фактах и расписании. Для I, you, we, they глагол не меняется. Для he, she, it добавляем <b>-s</b>.</p><table><tr><th>Лицо</th><th>Пример</th></tr><tr><td>I / you / we / they</td><td>I work, they play</td></tr><tr><td>he / she / it</td><td>he works, it plays</td></tr></table><p><b>Правописание -s:</b></p><ul><li>обычно + s: <i>work → works</i></li><li>после -s, -sh, -ch, -x, -o + es: <i>watch → watches, go → goes</i></li><li>согласная + y: y → ies: <i>study → studies</i> (но <i>play → plays</i>)</li><li>особый случай: <i>have → has</i></li></ul><p><i>She works here.</i> — Она работает здесь.<br><i>I get up at seven.</i> — Я встаю в семь.<br><i>My brother studies English.</i> — Мой брат изучает английский.<br><i>The sun rises in the east.</i> — Солнце встаёт на востоке.</p><p><b>Частая ошибка:</b> забывают -s у he, she, it: «He work every day». Правильно: <i>He works every day.</i></p>","ex":[{"q":"She ___ in a bank.","a":"works","o":["works","work","working","is work"],"t":"Она работает в банке.","e":"С she к глаголу добавляем -s."},{"q":"They ___ football on Sundays.","a":"play","o":["play","plays","playes","is play"],"t":"Они играют в футбол по воскресеньям.","e":"С they глагол не меняется."},{"q":"He ___ TV in the evening.","a":"watches","o":["watches","watchs","watch","watchies"],"t":"Вечером он смотрит телевизор.","e":"После -ch добавляем -es: watches."},{"q":"My sister ___ English at university.","a":"studies","o":["studies","studys","study","studyes"],"t":"Моя сестра изучает английский в университете.","e":"Согласная + y: y меняется на ies."},{"q":"I ___ breakfast at eight.","a":"have","o":["have","has","haves","am have"],"t":"Я завтракаю в восемь.","e":"С I используем have, без изменений."},{"q":"Anna ___ a big dog.","a":"has","o":["has","have","haves","is have"],"t":"У Анны большая собака.","e":"С he, she, it глагол have превращается в has."},{"q":"We ___ to school by bus.","a":"go","o":["go","goes","gos","going"],"t":"Мы ездим в школу на автобусе.","e":"С we глагол остаётся без -s."},{"q":"He ___ to school by bike.","a":"goes","o":["goes","go","gos","going"],"t":"Он ездит в школу на велосипеде.","e":"После -o добавляем -es: goes."},{"q":"The cat ___ milk.","a":"likes","o":["likes","like","likees","is like"],"t":"Кошка любит молоко.","e":"The cat = it, поэтому нужен -s."},{"q":"My dad ___ at six o'clock.","a":"gets up","o":["gets up","get up","getting up","gets ups"],"t":"Мой папа встаёт в шесть часов.","e":"My dad = he, поэтому get превращается в gets."},{"q":"You ___ very well.","a":"cook","o":["cook","cooks","cookes","is cook"],"t":"Ты очень хорошо готовишь.","e":"С you глагол не меняется."},{"q":"Tom ___ his teeth after breakfast.","a":"brushes","o":["brushes","brushs","brush","brushies"],"t":"Том чистит зубы после завтрака.","e":"После -sh добавляем -es: brushes."},{"q":"The bus ___ at nine.","a":"arrives","o":["arrives","arrive","arrivs","arrivees"],"t":"Автобус прибывает в девять.","e":"The bus = it, поэтому нужен -s."},{"q":"Mary ___ the piano every day.","a":"plays","o":["plays","playes","plaies","play"],"t":"Мэри играет на пианино каждый день.","e":"После гласной + y просто добавляем -s: plays."},{"q":"My parents ___ in London.","a":"live","o":["live","lives","livees","is live"],"t":"Мои родители живут в Лондоне.","e":"My parents = they, глагол без -s."}]},{"id":"a1-question-words","level":"A1","title":"Вопросительные слова","summary":"What, where, when, who, why, how","rule":"<p>Вопросительные слова ставятся в начало вопроса. Порядок слов такой: <b>вопросительное слово + do/does (или to be) + подлежащее + глагол</b>.</p><table><tr><th>Слово</th><th>Значение</th><th>Пример</th></tr><tr><td>what</td><td>что, какой</td><td>What do you like?</td></tr><tr><td>where</td><td>где, куда</td><td>Where does she live?</td></tr><tr><td>when</td><td>когда</td><td>When is your lesson?</td></tr><tr><td>who</td><td>кто</td><td>Who is he?</td></tr><tr><td>why</td><td>почему</td><td>Why are you sad?</td></tr><tr><td>how</td><td>как</td><td>How are you?</td></tr><tr><td>whose</td><td>чей</td><td>Whose bag is this?</td></tr></table><ul><li>Why → ответ с <i>because</i>: <i>Why are you late? — Because I missed the bus.</i></li><li><i>How old</i> — сколько лет, <i>how many</i> — сколько (считаемое), <i>how much</i> — сколько (несчитаемое) или цена.</li><li>Если <b>who</b> — подлежащее, do/does не нужны: <i>Who lives here?</i></li></ul><p><b>Частая ошибка:</b> «Where she lives?» Правильно: <i>Where does she live?</i></p>","ex":[{"q":"___ is your name?","a":"What","o":["What","Where","Who","Why"],"t":"Как тебя зовут?","e":"О имени спрашиваем what."},{"q":"___ do you live?","a":"Where","o":["Where","When","Who","Whose"],"t":"Где ты живёшь?","e":"О месте спрашиваем where."},{"q":"___ is your birthday?","a":"When","o":["When","Where","Who","How"],"t":"Когда твой день рождения?","e":"О времени спрашиваем when."},{"q":"___ is that man?","a":"Who","o":["Who","What","Where","Why"],"t":"Кто этот мужчина?","e":"О человеке спрашиваем who."},{"q":"___ are you late?","a":"Why","o":["Why","How","When","Who"],"t":"Почему ты опаздываешь?","e":"О причине спрашиваем why."},{"q":"___ are you? — I'm fine.","a":"How","o":["How","What","Who","Where"],"t":"Как дела? — Хорошо.","e":"О самочувствии спрашиваем how."},{"q":"___ bag is this?","a":"Whose","o":["Whose","Who","What","Where"],"t":"Чья это сумка?","e":"Для принадлежности используем whose."},{"q":"___ old are you?","a":"How","o":["How","What","Which","When"],"t":"Сколько тебе лет?","e":"Возраст: how old."},{"q":"___ does she work?","a":"Where","o":["Where","Who","Whose","Why"],"t":"Где она работает?","e":"О месте спрашиваем where."},{"q":"What ___ you do in the evening?","a":"do","o":["do","does","are","is"],"t":"Что ты делаешь вечером?","e":"С you после what нужен do."},{"q":"Where ___ he live?","a":"does","o":["does","do","is","are"],"t":"Где он живёт?","e":"С he после where нужен does."},{"q":"How ___ apples are there?","a":"many","o":["many","much","old","long"],"t":"Сколько там яблок?","e":"Яблоки считаются, поэтому how many."},{"q":"How ___ is this book?","a":"much","o":["much","many","old","long"],"t":"Сколько стоит эта книга?","e":"Для цены используем how much."},{"q":"Why do you study English? — ___ I like it.","a":"Because","o":["Because","And","So","But"],"t":"Почему ты учишь английский? — Потому что он мне нравится.","e":"Ответ на why начинается с because."},{"q":"___ lives in this house?","a":"Who","o":["Who","Whose","Where","What"],"t":"Кто живёт в этом доме?","e":"Who как подлежащее: do/does не нужны."}]},{"id":"a1-there-is-are","level":"A1","title":"There is / There are","summary":"Что где находится: there is a book, there are two books","rule":"<p>Конструкция <b>there is / there are</b> говорит о том, что что-то есть или находится где-то. Русский аналог: «есть», «находится», «имеется».</p><table><tr><th>Форма</th><th>Когда</th><th>Пример</th></tr><tr><td>there is (there's)</td><td>один предмет или неисчисляемое</td><td>There is a cat in the room.</td></tr><tr><td>there are</td><td>несколько предметов</td><td>There are two chairs here.</td></tr></table><p><b>Отрицание:</b> <i>There isn't a bank near here. There aren't any shops.</i><br><b>Вопрос:</b> глагол выходит вперёд: <i>Is there a park? Are there any shops?</i><br><b>Краткие ответы:</b> <i>Yes, there is. / No, there isn't. Yes, there are. / No, there aren't.</i></p><ul><li>В утверждении перед множественным числом можно говорить <i>some</i>, в отрицании и вопросе обычно <i>any</i>.</li><li>Выбор is или are зависит от первого предмета после there: <i>There is a pen and two books.</i></li></ul><p><b>Частая ошибка:</b> «In the room is a table». Нужно: <i>There is a table in the room.</i></p>","ex":[{"q":"There ___ a book on the table.","a":"is","o":["is","are","am","be"],"t":"На столе лежит книга.","e":"Книга одна, поэтому there is."},{"q":"There ___ three students in the room.","a":"are","o":["are","is","am","be"],"t":"В комнате три студента.","e":"Студентов несколько, поэтому there are."},{"q":"There ___ a bank near here.","a":"isn't","o":["isn't","aren't","not","don't"],"t":"Рядом нет банка.","e":"Единственное число: there isn't."},{"q":"There ___ any chairs in the kitchen.","a":"aren't","o":["aren't","isn't","not","doesn't"],"t":"На кухне нет стульев.","e":"Множественное число: there aren't."},{"q":"___ there a cinema in your town?","a":"Is","o":["Is","Are","Does","Do"],"t":"В вашем городе есть кинотеатр?","e":"Один предмет: Is there...?"},{"q":"___ there any apples in the bag?","a":"Are","o":["Are","Is","Do","Does"],"t":"В сумке есть яблоки?","e":"Яблоки во множественном числе: Are there...?"},{"q":"Is there a park here? — Yes, there ___.","a":"is","o":["is","are","does","has"],"t":"Здесь есть парк? — Да.","e":"Краткий ответ повторяет is."},{"q":"Are there any shops? — No, there ___.","a":"aren't","o":["aren't","isn't","don't","not"],"t":"Магазины есть? — Нет.","e":"Краткий ответ повторяет are: aren't."},{"q":"There ___ some milk in the fridge.","a":"is","o":["is","are","am","be"],"t":"В холодильнике есть молоко.","e":"Milk неисчисляемое, поэтому is."},{"q":"There ___ two cats in the garden.","a":"are","o":["are","is","be","have"],"t":"В саду две кошки.","e":"Две кошки: there are."},{"q":"There is ___ apple on the plate.","a":"an","o":["an","a","some","two"],"t":"На тарелке лежит яблоко.","e":"Перед гласным звуком ставим an."},{"q":"There aren't ___ people in the street.","a":"any","o":["any","a","an","is"],"t":"На улице нет людей.","e":"В отрицании с множественным числом используем any."},{"q":"There ___ a lot of water in the lake.","a":"is","o":["is","are","have","be"],"t":"В озере много воды.","e":"Water неисчисляемое, поэтому is."},{"q":"___ there any milk in the cup?","a":"Is","o":["Is","Are","Do","Does"],"t":"В чашке есть молоко?","e":"Milk неисчисляемое: Is there...?"},{"q":"There ___ a pen and two books on the desk.","a":"is","o":["is","are","has","have"],"t":"На столе ручка и две книги.","e":"Первое слово после there — a pen, поэтому is."}]},{"id":"a2-past-simple-regular","level":"A2","title":"Past Simple: правильные глаголы и was/were","summary":"Рассказываем о прошлом: worked, played, was, were","rule":"<p><b>Past Simple</b> — прошедшее время для законченных действий: <i>yesterday, last week, two years ago, in 2010</i>.</p>\n<p>У правильных глаголов добавляем <b>-ed</b> ко всем лицам: <i>work → worked</i>. Правила написания:</p>\n<table><tr><th>Правило</th><th>Пример</th></tr>\n<tr><td>глагол на -e: добавляем -d</td><td>live → lived</td></tr>\n<tr><td>согласная + y: y → ied</td><td>study → studied</td></tr>\n<tr><td>короткий глагол: удваиваем согласную</td><td>stop → stopped</td></tr></table>\n<p>Глагол <b>to be</b> в прошлом: <i>I / he / she / it — was</i>; <i>we / you / they — were</i>. Отрицание: <i>wasn't, weren't</i>. Вопрос: <i>Were you at home?</i></p>\n<ul><li><i>I played football yesterday.</i> — Вчера я играл в футбол.</li>\n<li><i>She lived in Paris in 2015.</i> — Она жила в Париже в 2015 году.</li>\n<li><i>We were at the cinema.</i> — Мы были в кино.</li>\n<li><i>The weather wasn't good.</i> — Погода была нехорошей.</li></ul>\n<p><b>Частая ошибка:</b> говорят <i>I was play</i> или <i>He worked</i> с лишним was. Нужно либо was/were (быть), либо глагол с -ed, но не вместе.</p>","ex":[{"q":"I ___ football yesterday.","a":"played","o":["play","played","playing"],"t":"Вчера я играл в футбол.","e":"Слово yesterday показывает прошлое, поэтому добавляем -ed."},{"q":"She ___ a teacher in 2015.","a":"was","o":["is","were","was"],"t":"В 2015 году она была учителем.","e":"Прошлое время, she — значит was."},{"q":"We ___ at the cinema last night.","a":"were","o":["was","were","are"],"t":"Вчера вечером мы были в кино.","e":"С we в прошедшем времени используем were."},{"q":"They ___ the door and went in.","a":"opened","o":["open","opened","opens"],"t":"Они открыли дверь и вошли.","e":"Действие в прошлом, добавляем -ed."},{"q":"He ___ in London two years ago.","a":"lived","o":["lived","liveed","lives"],"t":"Два года назад он жил в Лондоне.","e":"Глагол заканчивается на -e, поэтому добавляем только -d."},{"q":"The baby ___ all night.","a":"cried","o":["cryed","cried","cries"],"t":"Малыш плакал всю ночь.","e":"После согласной y меняется на i: cry → cried."},{"q":"We ___ the bus at the corner.","a":"stopped","o":["stoped","stopped","stopeed"],"t":"Мы остановили автобус на углу.","e":"Короткий глагол с одной гласной и согласной: удваиваем p."},{"q":"My brother ___ in the garden last summer.","a":"worked","o":["works","worked","was work"],"t":"Прошлым летом мой брат работал в саду.","e":"Last summer — прошлое. После was глагол с -ed не нужен."},{"q":"He ___ English at school.","a":"studied","o":["studyed","studied","studdied"],"t":"Он изучал английский в школе.","e":"Согласная + y: меняем y на ied."},{"q":"She ___ me an hour ago.","a":"phoned","o":["phone","phoned","phones"],"t":"Она позвонила мне час назад.","e":"Ago — признак прошлого. К глаголу на -e добавляем -d."},{"q":"___ you at home last Sunday?","a":"Were","o":["Was","Were","Did"],"t":"Ты был дома в прошлое воскресенье?","e":"В вопросе с to be в прошлом ставим were перед you."},{"q":"The weather ___ good last weekend.","a":"wasn't / was not","o":["wasn't","weren't","isn't"],"t":"На прошлых выходных погода была нехорошей.","e":"Weather — единственное число, значит was. Отрицание: wasn't."},{"q":"The shops ___ open yesterday because it was a holiday.","a":"weren't / were not","o":["wasn't","weren't","aren't"],"t":"Вчера магазины были закрыты, потому что был праздник.","e":"Shops — множественное число: weren't."},{"q":"Where ___ your parents born?","a":"were","o":["was","were","did"],"t":"Где родились твои родители?","e":"Parents — множественное число, поэтому were."},{"q":"She ___ the room and then went out.","a":"cleaned","o":["cleaned","cleaning","cleans"],"t":"Она убрала комнату и вышла.","e":"Went out показывает прошлое, значит нужен глагол с -ed."}]},{"id":"a2-past-simple-irregular","level":"A2","title":"Past Simple: неправильные глаголы, отрицание и вопросы","summary":"went, saw, did you...?, didn't + глагол","rule":"<p>У <b>неправильных глаголов</b> вторая форма не оканчивается на -ed, её нужно запомнить: <i>go → went, see → saw, have → had, buy → bought, eat → ate, take → took, write → wrote</i>.</p>\n<p>Отрицания и вопросы строятся с помощью вспомогательного глагола <b>did</b>. После did (и didn't) глагол всегда стоит в начальной форме.</p>\n<table><tr><th>Тип</th><th>Схема</th><th>Пример</th></tr>\n<tr><td>утверждение</td><td>подлежащее + V2</td><td>He went home.</td></tr>\n<tr><td>отрицание</td><td>didn't + V1</td><td>He didn't go home.</td></tr>\n<tr><td>вопрос</td><td>Did + подлежащее + V1?</td><td>Did he go home?</td></tr></table>\n<ul><li><i>I bought a new phone.</i> — Я купил новый телефон.</li>\n<li><i>We didn't see the film.</i> — Мы не видели этот фильм.</li>\n<li><i>Did you eat breakfast?</i> — Ты завтракал?</li>\n<li><i>Where did she go?</i> — Куда она пошла?</li></ul>\n<p><b>Частая ошибка:</b> ставят прошедшую форму дважды: <i>Did you went?</i> или <i>He didn't took</i>. Правильно: <i>Did you go? He didn't take.</i> Прошедшее время показывает только did.</p>","ex":[{"q":"I ___ to the market yesterday.","a":"went","o":["go","went","goed"],"t":"Вчера я ходил на рынок.","e":"Прошлое время от go — went."},{"q":"She ___ a new dress last week.","a":"bought","o":["buyed","bought","buy"],"t":"На прошлой неделе она купила новое платье.","e":"Buy — неправильный глагол: bought."},{"q":"We ___ pizza for dinner last night.","a":"ate","o":["eated","ate","eat"],"t":"Вчера на ужин мы ели пиццу.","e":"Eat — неправильный глагол: ate."},{"q":"Did you ___ the film yesterday?","a":"see","o":["saw","see","seen"],"t":"Ты вчера смотрел этот фильм?","e":"После did глагол стоит в начальной форме: see."},{"q":"He didn't ___ his homework last night.","a":"do","o":["did","do","does"],"t":"Вчера вечером он не сделал домашнее задание.","e":"После didn't используем начальную форму: do."},{"q":"I ___ not see Tom at the party.","a":"did","o":["do","did","was"],"t":"Я не видел Тома на вечеринке.","e":"Отрицание в прошлом: did + not + глагол."},{"q":"___ she come to your birthday party?","a":"Did","o":["Does","Did","Was"],"t":"Она приходила на твой день рождения?","e":"Вопрос в Past Simple начинается с did."},{"q":"They ___ a lot of photos on holiday.","a":"took","o":["taked","took","taken"],"t":"Они сделали много фотографий в отпуске.","e":"Take — неправильный глагол: took."},{"q":"What time did you ___ up this morning?","a":"get","o":["got","get","getting"],"t":"Во сколько ты сегодня встал?","e":"После did нужна начальная форма: get."},{"q":"My mother ___ me a letter last month.","a":"wrote","o":["writed","wrote","written"],"t":"В прошлом месяце мама написала мне письмо.","e":"Write — неправильный глагол: wrote."},{"q":"We didn't ___ the bus, so we walked.","a":"take","o":["took","take","taking"],"t":"Мы не поехали на автобусе, поэтому пошли пешком.","e":"После didn't глагол стоит в начальной форме."},{"q":"Where ___ you go on Saturday?","a":"did","o":["do","did","are"],"t":"Куда ты ходил в субботу?","e":"Для вопроса в прошлом нужен did."},{"q":"He ___ his keys and couldn't open the door.","a":"lost","o":["losed","lost","lose"],"t":"Он потерял ключи и не мог открыть дверь.","e":"Lose — неправильный глагол: lost."},{"q":"She ___ come to school yesterday because she was ill.","a":"didn't / did not","o":["didn't","wasn't","doesn't"],"t":"Вчера она не пришла в школу, потому что болела.","e":"Отрицание в прошлом с обычным глаголом: didn't + come."},{"q":"How much money did he ___ on the trip?","a":"spend","o":["spent","spend","spends"],"t":"Сколько денег он потратил в поездке?","e":"После did используем начальную форму: spend."}]},{"id":"a2-past-continuous","level":"A2","title":"Past Continuous и его контраст с Past Simple","summary":"was/were + -ing: длительное действие в прошлом","rule":"<p><b>Past Continuous</b> показывает действие, которое было в процессе в определённый момент прошлого. Формула: <b>was / were + глагол с -ing</b>.</p>\n<table><tr><th>Тип</th><th>Пример</th></tr>\n<tr><td>утверждение</td><td>I was reading. They were playing.</td></tr>\n<tr><td>отрицание</td><td>She wasn't sleeping.</td></tr>\n<tr><td>вопрос</td><td>Were you working?</td></tr></table>\n<p><b>Контраст:</b> длинное действие (фон) — Past Continuous, короткое действие, которое его прервало, — Past Simple. С <i>while</i> обычно идёт Past Continuous, с <i>when</i> — часто Past Simple.</p>\n<ul><li><i>At 8 o'clock I was having breakfast.</i> — В восемь часов я завтракал.</li>\n<li><i>I was cooking when my friend arrived.</i> — Я готовил, когда пришёл друг.</li>\n<li><i>While we were walking, it started to rain.</i> — Пока мы шли, начался дождь.</li>\n<li><i>He broke his leg while he was skiing.</i> — Он сломал ногу, катаясь на лыжах.</li></ul>\n<p><b>Частая ошибка:</b> использовать Past Simple для процесса: <i>When she called, I watched TV</i>. Если действие шло в момент звонка, нужно <i>I was watching TV</i>.</p>","ex":[{"q":"At 8 o'clock yesterday I ___ breakfast.","a":"was having","o":["had","was having","am having"],"t":"Вчера в восемь часов я завтракал.","e":"Действие шло в конкретный момент прошлого: was + -ing."},{"q":"They ___ football when it started to rain.","a":"were playing","o":["played","were playing","was playing"],"t":"Они играли в футбол, когда пошёл дождь.","e":"Длинное действие, которое прервал дождь: were playing."},{"q":"It started to rain while we ___ home.","a":"were walking","o":["walked","were walking","was walking"],"t":"Дождь начался, пока мы шли домой.","e":"После while обычно идёт процесс: were walking."},{"q":"She ___ TV when the phone rang.","a":"was watching","o":["watched","was watching","were watching"],"t":"Она смотрела телевизор, когда зазвонил телефон.","e":"Процесс в момент звонка: was watching."},{"q":"I was cooking when my friend ___.","a":"arrived","o":["was arriving","arrived","arrive"],"t":"Я готовил, когда пришёл мой друг.","e":"Короткое действие, прервавшее процесс, — Past Simple."},{"q":"What ___ you doing at 10 last night?","a":"were","o":["was","were","did"],"t":"Что ты делал вчера в десять вечера?","e":"С you в Past Continuous используем were."},{"q":"He ___ his leg while he was skiing.","a":"broke","o":["was breaking","broke","breaks"],"t":"Он сломал ногу, катаясь на лыжах.","e":"Перелом — короткое законченное действие: Past Simple."},{"q":"I ___ sleeping when you called, I was reading.","a":"wasn't / was not","o":["wasn't","weren't","didn't"],"t":"Я не спал, когда ты позвонил, я читал.","e":"Отрицание в Past Continuous: wasn't + -ing."},{"q":"Tom was cooking and Anna ___ music at the same time.","a":"was listening","o":["listened","was listening","were listening"],"t":"Том готовил, а Анна в это же время слушала музыку.","e":"Два процесса одновременно: was listening."},{"q":"The children ___ when the teacher came in.","a":"were laughing","o":["laughed","were laughing","was laughing"],"t":"Дети смеялись, когда вошёл учитель.","e":"Процесс в момент входа: were laughing."},{"q":"We ___ a lovely bird in the park yesterday.","a":"saw","o":["were seeing","saw","see"],"t":"Вчера в парке мы увидели красивую птицу.","e":"Одно законченное действие в прошлом: Past Simple."},{"q":"___ it raining when you left home?","a":"Was","o":["Did","Was","Were"],"t":"Шёл ли дождь, когда ты вышел из дома?","e":"It — единственное число: Was it raining?"},{"q":"I ___ my phone when I was running.","a":"dropped","o":["was dropping","dropped","drop"],"t":"Я уронил телефон, когда бежал.","e":"Короткое действие во время процесса: Past Simple."},{"q":"Last night at nine, my sister ___ a bath.","a":"was taking","o":["took","was taking","were taking"],"t":"Вчера в девять вечера моя сестра принимала ванну.","e":"Конкретное время и процесс: was taking."},{"q":"While she ___ the dishes, she dropped a glass.","a":"was washing","o":["washed","was washing","were washing"],"t":"Пока она мыла посуду, она уронила стакан.","e":"После while — процесс: was washing."}]},{"id":"a2-will-going-to","level":"A2","title":"Будущее: will и be going to","summary":"Планы и намерения или решения и прогнозы","rule":"<p>Для будущего есть две основные формы.</p>\n<p><b>be going to + глагол</b> — план, намерение или прогноз по тому, что видно сейчас. <b>will + глагол</b> — решение, принятое в момент речи, обещание, предложение помощи, предположение.</p>\n<table><tr><th>Форма</th><th>Когда</th><th>Пример</th></tr>\n<tr><td>am/is/are going to</td><td>заранее решённый план; очевидные признаки</td><td>We are going to visit Rome.</td></tr>\n<tr><td>will (won't)</td><td>спонтанное решение, обещание, мнение</td><td>I'll help you.</td></tr></table>\n<ul><li><i>Look at those clouds! It is going to rain.</i> — Смотри, какие тучи! Будет дождь.</li>\n<li><i>The phone is ringing. I will answer it.</i> — Телефон звонит. Я отвечу.</li>\n<li><i>I promise I won't tell anyone.</i> — Обещаю, что никому не скажу.</li>\n<li><i>Are you going to buy a new car?</i> — Ты собираешься купить новую машину?</li></ul>\n<p>После will и going to глагол стоит в начальной форме. Отрицание: <i>won't</i> и <i>isn't going to</i>.</p>\n<p><b>Частая ошибка:</b> пропускают be: <i>I going to study</i>. Нужно <i>I am going to study</i>. Ещё не ставят to после will: <i>I will to go</i> — неверно.</p>","ex":[{"q":"Look at those clouds! It ___ rain.","a":"is going to","o":["will","is going to","are going to"],"t":"Посмотри на эти тучи! Будет дождь.","e":"Прогноз по видимым признакам — be going to."},{"q":"The phone is ringing. I ___ answer it.","a":"will","o":["am going","will","would"],"t":"Телефон звонит. Я отвечу.","e":"Решение, принятое в момент речи, — will."},{"q":"We ___ visit my grandparents next Sunday. We have already bought the tickets.","a":"are going to","o":["will","are going to","is going to"],"t":"В следующее воскресенье мы поедем к бабушке и дедушке. Билеты уже куплены.","e":"Заранее подготовленный план — be going to. С we нужен are."},{"q":"Perhaps people ___ live on Mars in 100 years.","a":"will","o":["are going","will","do"],"t":"Возможно, через сто лет люди будут жить на Марсе.","e":"Предположение о далёком будущем без признаков — will."},{"q":"I have decided: I ___ learn to drive this year.","a":"am going to","o":["will","am going to","going to"],"t":"Я решил: в этом году научусь водить.","e":"Уже принятое решение — be going to. После I нужен am."},{"q":"I promise I ___ tell anyone your secret.","a":"won't / will not","o":["won't","don't","not will"],"t":"Обещаю, что никому не расскажу твой секрет.","e":"Обещание — will; отрицание — won't."},{"q":"___ you going to buy a new car?","a":"Are","o":["Do","Are","Will"],"t":"Ты собираешься купить новую машину?","e":"Вопрос с be going to: Are you going to...?"},{"q":"He ___ going to play tennis tomorrow, he has a cold.","a":"isn't / is not","o":["isn't","doesn't","won't"],"t":"Завтра он не собирается играть в теннис, у него простуда.","e":"Отрицание с going to: isn't going to."},{"q":"Wait, I ___ help you with the bag.","a":"will","o":["am going","will","do"],"t":"Подожди, я помогу тебе с сумкой.","e":"Предложение помощи в момент речи — will."},{"q":"Be careful! You ___ fall!","a":"are going to","o":["will","are going to","go to"],"t":"Осторожно! Ты упадёшь!","e":"Опасность видна прямо сейчас — be going to."},{"q":"I don't know what to eat. I ___ have the soup, please.","a":"will","o":["am going","will","do"],"t":"Не знаю, что съесть. Я возьму суп, пожалуйста.","e":"Решение принято прямо сейчас — will."},{"q":"I'm sure you ___ pass the exam.","a":"will","o":["are going","will","do"],"t":"Я уверен, что ты сдашь экзамен.","e":"Мнение или предположение — will."},{"q":"Next year I ___ be 30.","a":"will","o":["am going","will","do"],"t":"В следующем году мне будет 30.","e":"Простой факт о будущем — will."},{"q":"Who ___ win the match, do you think?","a":"will","o":["is going","will","does"],"t":"Как ты думаешь, кто выиграет матч?","e":"Просим мнение о будущем — will."},{"q":"They ___ build a new school here. I saw the plans.","a":"are going to","o":["will","are going to","is going to"],"t":"Они собираются построить здесь новую школу. Я видел планы.","e":"Есть план (я видел проекты) — be going to. С they — are."}]},{"id":"a2-comparatives-superlatives","level":"A2","title":"Сравнительная и превосходная степень прилагательных","summary":"bigger, more interesting, the best","rule":"<p>Чтобы сравнить два предмета, используем <b>сравнительную степень</b> + <i>than</i> («чем»). Чтобы выделить один из многих — <b>превосходную</b> с <i>the</i>.</p>\n<table><tr><th>Прилагательное</th><th>Сравнительная</th><th>Превосходная</th></tr>\n<tr><td>короткое: tall</td><td>taller</td><td>the tallest</td></tr>\n<tr><td>на -e: nice</td><td>nicer</td><td>the nicest</td></tr>\n<tr><td>на -y: happy</td><td>happier</td><td>the happiest</td></tr>\n<tr><td>удвоение: big, hot</td><td>bigger, hotter</td><td>the biggest</td></tr>\n<tr><td>длинное: interesting</td><td>more interesting</td><td>the most interesting</td></tr>\n<tr><td>исключения: good / bad</td><td>better / worse</td><td>the best / the worst</td></tr></table>\n<ul><li><i>A car is faster than a bicycle.</i> — Машина быстрее велосипеда.</li>\n<li><i>This book is more interesting than that one.</i> — Эта книга интереснее той.</li>\n<li><i>Everest is the highest mountain in the world.</i> — Эверест — самая высокая гора в мире.</li>\n<li><i>It was the worst day of my life.</i> — Это был худший день в моей жизни.</li></ul>\n<p><b>Частая ошибка:</b> смешивают два способа: <i>more taller</i> или <i>the most best</i>. Нужен только один: <i>taller</i>, <i>the best</i>. Ещё забывают <i>the</i> в превосходной степени.</p>","ex":[{"q":"A car is ___ than a bicycle.","a":"faster","o":["fast","faster","more fast"],"t":"Машина быстрее велосипеда.","e":"Короткое прилагательное + -er + than."},{"q":"Mount Everest is the ___ mountain in the world.","a":"highest","o":["higher","highest","most high"],"t":"Эверест — самая высокая гора в мире.","e":"После the нужна превосходная степень: highest."},{"q":"This book is ___ than that one.","a":"more interesting","o":["interestinger","more interesting","most interesting"],"t":"Эта книга интереснее той.","e":"Длинное прилагательное: more + прилагательное."},{"q":"Today is ___ than yesterday. Yesterday it was 20 degrees, today it is 25.","a":"hotter","o":["hoter","hotter","more hot"],"t":"Сегодня жарче, чем вчера. Вчера было 20 градусов, сегодня 25.","e":"Hot — удваиваем t и добавляем -er."},{"q":"She is the ___ girl in our class.","a":"most beautiful","o":["more beautiful","most beautiful","beautifullest"],"t":"Она самая красивая девочка в нашем классе.","e":"Для длинного прилагательного: the most + прилагательное."},{"q":"My English is ___ than before.","a":"better","o":["gooder","better","more good"],"t":"Мой английский лучше, чем раньше.","e":"Good — исключение: better."},{"q":"This is the ___ day of my life!","a":"worst","o":["baddest","worst","worse"],"t":"Это худший день в моей жизни!","e":"Bad — исключение. После the нужна превосходная степень: worst."},{"q":"Gold is ___ expensive than silver.","a":"more","o":["most","more","much"],"t":"Золото дороже серебра.","e":"Сравнение двух предметов с длинным прилагательным: more."},{"q":"My sister is ___ than me. She is 25 and I am 20.","a":"older","o":["oldest","older","more old"],"t":"Моя сестра старше меня. Ей 25, а мне 20.","e":"Сравниваем двух человек: older + than."},{"q":"Tom is the ___ boy in our class. He is 1.90 m.","a":"tallest","o":["taller","tallest","most tall"],"t":"Том — самый высокий мальчик в классе. Его рост 1,90 м.","e":"Он выделяется среди всех: the tallest."},{"q":"Is this the ___ way to the station?","a":"shortest","o":["shorter","shortest","more short"],"t":"Это самая короткая дорога до вокзала?","e":"Выбираем из многих вариантов: the shortest."},{"q":"I'm ___ now than last year. I have a new job.","a":"happier","o":["more happy","happier","happyer"],"t":"Сейчас я счастливее, чем в прошлом году. У меня новая работа.","e":"Прилагательное на -y: меняем y на i и добавляем -er."},{"q":"That was the ___ film I have ever seen. I almost fell asleep.","a":"most boring","o":["boringest","more boring","most boring"],"t":"Это был самый скучный фильм из всех, что я видел. Я чуть не уснул.","e":"Длинное прилагательное в превосходной степени: the most boring."},{"q":"Russia is ___ than France.","a":"bigger","o":["biger","bigger","more big"],"t":"Россия больше Франции.","e":"Big — удваиваем g: bigger."},{"q":"The traffic is ___ than usual today. We are late.","a":"worse","o":["worse","worst","badder"],"t":"Сегодня пробки хуже обычного. Мы опаздываем.","e":"Bad — исключение. Сравнение с than: worse."},{"q":"This test is ___ than the last one. I finished it quickly.","a":"easier","o":["more easy","easier","easyer"],"t":"Этот тест легче предыдущего. Я быстро его закончил.","e":"Easy оканчивается на -y: easier."}]},{"id":"a2-countable-uncountable","level":"A2","title":"Исчисляемые и неисчисляемые существительные","summary":"some, any, much, many, a lot of, a few, a little","rule":"<p>Исчисляемые существительные можно посчитать: <i>an apple, two apples</i>. Неисчисляемые нельзя: <i>milk, water, bread, money, time, information</i>. У них нет множественного числа и нет <i>a/an</i>.</p>\n<table><tr><th>Слово</th><th>Исчисляемые</th><th>Неисчисляемые</th></tr>\n<tr><td>some (утверждения, предложения)</td><td>some apples</td><td>some milk</td></tr>\n<tr><td>any (отрицания, вопросы)</td><td>any apples</td><td>any milk</td></tr>\n<tr><td>many / much (вопросы, отрицания)</td><td>many friends</td><td>much time</td></tr>\n<tr><td>a lot of</td><td>a lot of books</td><td>a lot of money</td></tr>\n<tr><td>a few / a little</td><td>a few friends</td><td>a little money</td></tr></table>\n<ul><li><i>I have some apples.</i> — У меня есть несколько яблок.</li>\n<li><i>We don't have any milk.</i> — У нас нет молока.</li>\n<li><i>How much water do you drink?</i> — Сколько воды ты пьёшь?</li>\n<li><i>She has a few friends here.</i> — У неё здесь есть несколько друзей.</li></ul>\n<p><b>Частая ошибка:</b> считают то, что в английском неисчисляемое: <i>an information, advices, a money</i>. Правильно: <i>some information, some advice, some money</i>. Глагол тоже в единственном числе: <i>The money is here.</i></p>","ex":[{"q":"I have ___ apples in my bag.","a":"some","o":["any","some","much"],"t":"У меня в сумке есть несколько яблок.","e":"В утверждении с множественным числом используем some."},{"q":"We don't have ___ milk.","a":"any","o":["some","any","many"],"t":"У нас нет молока.","e":"В отрицании используем any."},{"q":"Is there ___ sugar in your tea?","a":"any","o":["any","many","a few"],"t":"В твоём чае есть сахар?","e":"Вопрос с неисчисляемым существительным: any."},{"q":"How ___ water do you drink every day?","a":"much","o":["many","much","few"],"t":"Сколько воды ты пьёшь каждый день?","e":"Water неисчисляемое, поэтому much."},{"q":"How ___ brothers have you got?","a":"many","o":["much","many","little"],"t":"Сколько у тебя братьев?","e":"Brothers исчисляемое, поэтому many."},{"q":"There are ___ people in the park today. It is very crowded.","a":"a lot of","o":["much","a lot of","a little"],"t":"Сегодня в парке очень много людей. Тесно.","e":"A lot of подходит к людям в утверждении; much здесь не годится."},{"q":"I only have ___ money. I can't buy a car.","a":"a little","o":["a few","a little","many"],"t":"У меня совсем немного денег. Я не могу купить машину.","e":"Money неисчисляемое: a little."},{"q":"She has ___ friends in London, so she isn't lonely.","a":"a few","o":["a little","a few","much"],"t":"У неё в Лондоне есть несколько друзей, так что она не одинока.","e":"Friends исчисляемое: a few."},{"q":"Would you like ___ tea?","a":"some","o":["any","some","many"],"t":"Хотите чаю?","e":"В предложении и просьбе обычно используем some."},{"q":"There are too ___ cars in the city.","a":"many","o":["much","many","little"],"t":"В городе слишком много машин.","e":"Cars исчисляемое, поэтому many."},{"q":"I'd like ___ information about trains.","a":"some","o":["an","some","many"],"t":"Мне нужна информация о поездах.","e":"Information неисчисляемое: some, без a/an."},{"q":"We have very ___ time, so hurry up.","a":"little","o":["few","little","a few"],"t":"У нас очень мало времени, так что поторопись.","e":"Time неисчисляемое: very little."},{"q":"There ___ a lot of milk in the fridge.","a":"is","o":["are","is","be"],"t":"В холодильнике много молока.","e":"Milk неисчисляемое, поэтому is."},{"q":"I haven't got ___ time to talk now.","a":"much","o":["many","much","a few"],"t":"Сейчас у меня нет времени на разговор.","e":"Time неисчисляемое: much в отрицании."},{"q":"Do you have ___ brothers or sisters?","a":"any","o":["some","any","much"],"t":"У тебя есть братья или сёстры?","e":"В вопросе используем any."}]},{"id":"a2-modals-obligation","level":"A2","title":"Модальные глаголы: must, have to, should","summary":"Обязанность, запрет, отсутствие нужды, совет","rule":"<p>После модальных глаголов стоит инфинитив без <i>to</i>. У них нет -s в третьем лице.</p>\n<table><tr><th>Форма</th><th>Значение</th><th>Пример</th></tr>\n<tr><td>must / have to</td><td>надо, обязан</td><td>You must stop.</td></tr>\n<tr><td>mustn't</td><td>нельзя, запрещено</td><td>You mustn't smoke.</td></tr>\n<tr><td>don't / doesn't have to</td><td>не нужно, можно не</td><td>You don't have to pay.</td></tr>\n<tr><td>should / shouldn't</td><td>стоит, совет</td><td>You should rest.</td></tr></table>\n<ul><li><i>You must stop at a red light.</i> — Нужно останавливаться на красный свет.</li>\n<li><i>You mustn't smoke here.</i> — Здесь нельзя курить.</li>\n<li><i>She has to go to school by bus.</i> — Ей приходится ездить в школу на автобусе.</li>\n<li><i>We don't have to get up early tomorrow.</i> — Нам не нужно рано вставать завтра.</li>\n<li><i>You should see a doctor.</i> — Тебе стоит сходить к врачу.</li></ul>\n<p><b>Частая ошибка:</b> путают <i>mustn't</i> и <i>don't have to</i>. Первое значит «нельзя», второе — «не обязательно». Также нельзя сказать <i>must to go</i> или <i>she musts</i>.</p>","ex":[{"q":"You ___ stop at a red light.","a":"must","o":["must","mustn't","should to"],"t":"Нужно останавливаться на красный свет.","e":"Обязательное правило: must."},{"q":"You ___ smoke here. It's forbidden.","a":"mustn't","o":["don't have to","mustn't","must"],"t":"Здесь нельзя курить. Это запрещено.","e":"Запрет выражаем через mustn't."},{"q":"You ___ wear a uniform at our school. It's a rule.","a":"have to","o":["must to","have to","has to"],"t":"В нашей школе нужно носить форму. Это правило.","e":"С you используем have to."},{"q":"Tomorrow is Sunday. We ___ get up early.","a":"don't have to","o":["mustn't","don't have to","haven't to"],"t":"Завтра воскресенье. Нам не нужно рано вставать.","e":"Нет необходимости: don't have to."},{"q":"You look ill. You ___ see a doctor.","a":"should","o":["should","shouldn't","are"],"t":"Ты плохо выглядишь. Тебе стоит сходить к врачу.","e":"Совет выражаем с should."},{"q":"He ___ work on Sundays. It's his day off.","a":"doesn't have to","o":["doesn't has to","doesn't have to","mustn't"],"t":"Он не обязан работать по воскресеньям. Это его выходной.","e":"С he нужен doesn't have to, а после doesn't глагол без -s."},{"q":"She ___ go to school by bus because it is far.","a":"has to","o":["have to","has to","must to"],"t":"Ей приходится ездить в школу на автобусе, потому что далеко.","e":"С she используем has to."},{"q":"You ___ eat so much sugar. It's bad for you.","a":"shouldn't","o":["shouldn't","don't have to","not should"],"t":"Тебе не стоит есть столько сахара. Это вредно.","e":"Совет не делать — shouldn't."},{"q":"___ I wear a tie to the interview?","a":"Should","o":["Should","Do","Am"],"t":"Мне надеть галстук на собеседование?","e":"Спрашиваем совета: Should I...?"},{"q":"Do we ___ bring our own food?","a":"have to","o":["must","have to","has to"],"t":"Нам нужно приносить свою еду?","e":"В вопросе с do используем have to."},{"q":"Children ___ play with matches. It's dangerous.","a":"mustn't","o":["don't have to","mustn't","aren't must"],"t":"Детям нельзя играть со спичками. Это опасно.","e":"Запрет: mustn't."},{"q":"I ___ finish this report today. My boss needs it.","a":"have to","o":["have to","has to","should to"],"t":"Мне нужно закончить этот отчёт сегодня. Он нужен начальнику.","e":"Обязанность; с I используем have to."},{"q":"You ___ pay to enter the museum. It's free.","a":"don't have to","o":["mustn't","don't have to","can't to"],"t":"Платить за вход в музей не нужно. Он бесплатный.","e":"Вход бесплатный, значит не нужно: don't have to."},{"q":"We ___ be late. The film starts in five minutes!","a":"mustn't","o":["don't have to","mustn't","aren't"],"t":"Мы не должны опаздывать. Фильм начинается через пять минут!","e":"Нельзя опаздывать: mustn't."},{"q":"My eyes hurt. I think I ___ use the computer less.","a":"should","o":["must to","should","have"],"t":"У меня болят глаза. Мне стоит меньше сидеть за компьютером.","e":"Совет самому себе: should."}]},{"id":"a2-present-perfect","level":"A2","title":"Present Perfect: опыт и недавние события","summary":"have/has + V3, ever, never, just, already, yet","rule":"<p><b>Present Perfect</b> связывает прошлое с настоящим. Формула: <b>have / has + третья форма глагола (V3)</b>. У правильных глаголов V3 = -ed, у неправильных её нужно выучить: <i>seen, been, done, eaten</i>.</p>\n<p>Используем: 1) для жизненного опыта (когда неважно, когда это было); 2) для недавних событий с результатом сейчас. Точное время прошлого (<i>yesterday, in 2010</i>) здесь не используется.</p>\n<table><tr><th>Слово</th><th>Значение и место</th></tr>\n<tr><td>ever</td><td>когда-либо, в вопросах</td></tr>\n<tr><td>never</td><td>никогда, перед V3</td></tr>\n<tr><td>just / already</td><td>только что / уже, перед V3</td></tr>\n<tr><td>yet</td><td>ещё, уже: в конце вопроса и отрицания</td></tr></table>\n<ul><li><i>Have you ever been to London?</i> — Ты когда-нибудь был в Лондоне?</li>\n<li><i>I have never eaten sushi.</i> — Я никогда не ел суши.</li>\n<li><i>She has just bought a car.</i> — Она только что купила машину.</li>\n<li><i>I haven't seen that film yet.</i> — Я ещё не видел этот фильм.</li></ul>\n<p><b>Частая ошибка:</b> <i>I have seen him yesterday</i>. С yesterday нужен Past Simple: <i>I saw him yesterday</i>. Также различайте: <i>has been to</i> (был и вернулся) и <i>has gone to</i> (уехал и ещё там).</p>","ex":[{"q":"I ___ visited Spain twice.","a":"have","o":["has","have","did"],"t":"Я бывал в Испании дважды.","e":"Опыт без точного времени: have + V3."},{"q":"She has just ___ a new car.","a":"bought","o":["buy","bought","buyed"],"t":"Она только что купила новую машину.","e":"После has нужна третья форма: bought."},{"q":"Have you ___ been to London?","a":"ever","o":["never","ever","already"],"t":"Ты когда-нибудь был в Лондоне?","e":"В вопросах об опыте используем ever."},{"q":"I have ___ eaten sushi. I don't like fish.","a":"never","o":["ever","never","yet"],"t":"
