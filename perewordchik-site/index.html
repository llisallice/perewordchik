Я никогда не ел суши. Я не люблю рыбу.","e":"Опыта нет, значит never."},{"q":"He ___ already finished his homework.","a":"has","o":["have","has","is"],"t":"Он уже закончил домашнее задание.","e":"С he используем has."},{"q":"I haven't seen that film ___.","a":"yet","o":["already","yet","ever"],"t":"Я ещё не видел этот фильм.","e":"В отрицании в конце предложения ставим yet."},{"q":"Wow! You've ___ cleaned the whole house!","a":"already","o":["yet","already","ever"],"t":"Ого! Ты уже убрал весь дом!","e":"Действие уже сделано: already перед V3."},{"q":"We've ___ arrived. We are at the hotel now.","a":"just","o":["just","yet","ever"],"t":"Мы только что приехали. Сейчас мы в отеле.","e":"Только что: just."},{"q":"Have you ___ my keys?","a":"seen","o":["saw","seen","see"],"t":"Ты не видел мои ключи?","e":"После have нужна V3: seen."},{"q":"They have ___ to Italy three times.","a":"been","o":["gone","been","went"],"t":"Они были в Италии три раза.","e":"Был и вернулся: been to."},{"q":"Oh no! I ___ lost my keys.","a":"have","o":["am","have","had"],"t":"О нет! Я потерял ключи.","e":"Результат сейчас (ключей нет): have + V3."},{"q":"He ___ not eaten anything today.","a":"has","o":["have","has","did"],"t":"Он сегодня ничего не ел.","e":"С he в Present Perfect используем has."},{"q":"Have you ___ a horse?","a":"ridden","o":["rode","ridden","ride"],"t":"Ты когда-нибудь ездил на лошади?","e":"V3 от ride — ridden."},{"q":"Mary isn't here. She has ___ to the shop.","a":"gone","o":["been","gone","went"],"t":"Мэри здесь нет. Она ушла в магазин.","e":"Ушла и ещё не вернулась: gone to."},{"q":"___ you ever eaten Indian food?","a":"Have","o":["Did","Have","Has"],"t":"Ты когда-нибудь ел индийскую еду?","e":"Вопрос об опыте: Have you ever + V3?"},{"q":"I have ___ my homework, so I can watch TV.","a":"done","o":["did","done","do"],"t":"Я сделал домашнее задание, так что могу смотреть телевизор.","e":"После have нужна V3: done."}]},{"id":"a2-conjunctions","level":"A2","title":"Союзы: and, but, because, so, when, if","summary":"как соединять части предложения","rule":"<p><b>Союзы</b> соединяют слова и части предложения. На уровне A2 важно уверенно пользоваться шестью основными.</p><table><tr><th>Союз</th><th>Значение</th><th>Пример</th></tr><tr><td>and</td><td>и</td><td><i>I like tea and coffee.</i></td></tr><tr><td>but</td><td>но, а</td><td><i>I like tea, but I don't like coffee.</i></td></tr><tr><td>or</td><td>или</td><td><i>Do you want tea or coffee?</i></td></tr><tr><td>because</td><td>потому что (причина)</td><td><i>I'm tired because I worked late.</i></td></tr><tr><td>so</td><td>поэтому (результат)</td><td><i>I worked late, so I'm tired.</i></td></tr><tr><td>when</td><td>когда</td><td><i>Call me when you arrive.</i></td></tr><tr><td>if</td><td>если</td><td><i>If it rains, we will stay at home.</i></td></tr></table><p><b>Because и so</b> показывают одну и ту же связь с разных сторон. После <i>because</i> идёт причина, после <i>so</i> — следствие.</p><p><b>Правила:</b> перед <i>but</i> и <i>so</i> в середине предложения обычно ставят запятую. После <i>when</i> и <i>if</i> в значении будущего глагол стоит в настоящем времени: <i>If it rains tomorrow...</i>, а не «will rain». Если предложение начинается с <i>when / if</i>, после первой части ставится запятая.</p><p><b>Частая ошибка:</b> «Because I was ill, so I stayed at home». Нужен один союз: <i>Because I was ill, I stayed at home</i> или <i>I was ill, so I stayed at home.</i></p>","ex":[{"q":"I have a dog ___ a cat.","a":"and","o":["and","but","because","so"],"t":"У меня есть собака и кошка.","e":"Перечисление двух предметов: and."},{"q":"I wanted to go out, ___ it was raining.","a":"but","o":["but","and","so","because"],"t":"Я хотел выйти, но шёл дождь.","e":"Противопоставление: but (но)."},{"q":"Would you like juice ___ water?","a":"or","o":["or","and","but","so"],"t":"Хочешь сок или воду?","e":"Выбор между вариантами: or."},{"q":"She stayed at home ___ she was ill.","a":"because","o":["because","so","but","or"],"t":"Она осталась дома, потому что была больна.","e":"Здесь указана причина: because."},{"q":"It was very cold, ___ we put on our coats.","a":"so","o":["so","because","but","if"],"t":"Было очень холодно, поэтому мы надели пальто.","e":"Результат, следствие: so."},{"q":"Please call me ___ you get home.","a":"when","o":["when","if","because","but"],"t":"Позвони мне, когда придёшь домой.","e":"Это произойдёт точно, поэтому when (когда)."},{"q":"___ you are hungry, I can make you a sandwich.","a":"If","o":["If","Because","So","But"],"t":"Если ты голоден, я могу сделать тебе бутерброд.","e":"Условие, возможное событие: if."},{"q":"I was late ___ I missed the bus.","a":"because","o":["because","so","but","or"],"t":"Я опоздал, потому что пропустил автобус.","e":"Пропустил автобус — это причина опоздания: because."},{"q":"I missed the bus, ___ I was late.","a":"so","o":["so","because","if","or"],"t":"Я пропустил автобус, поэтому опоздал.","e":"Опоздание — результат, поэтому so."},{"q":"He is rich, ___ he isn't happy.","a":"but","o":["but","so","because","and"],"t":"Он богат, но несчастлив.","e":"Две части противоречат друг другу: but."},{"q":"If it ___ tomorrow, we will stay at home.","a":"rains","o":["rains","will rain","rained","is raining"],"t":"Если завтра пойдёт дождь, мы останемся дома.","e":"После if в значении будущего используем Present Simple, а не will."},{"q":"I was watching TV ___ the phone rang.","a":"when","o":["when","if","so","because"],"t":"Я смотрел телевизор, когда зазвонил телефон.","e":"Указывает на момент действия: when (когда)."},{"q":"We can walk to the cinema ___ take a bus.","a":"or","o":["or","but","because","so"],"t":"Мы можем дойти до кинотеатра пешком или поехать на автобусе.","e":"Два возможных варианта: or."},{"q":"I like her ___ she is always kind.","a":"because","o":["because","so","but","when"],"t":"Она мне нравится, потому что всегда добра.","e":"Объясняем причину симпатии: because."}]},{"id":"a2-frequency-manner-adverbs","level":"A2","title":"Наречия частоты и образа действия","summary":"always, usually, never; well, fast, hard, -ly","rule":"<p><b>Наречия частоты</b> отвечают на вопрос «как часто?»: <i>always</i> (всегда), <i>usually</i> (обычно), <i>often</i> (часто), <i>sometimes</i> (иногда), <i>never</i> (никогда).</p><p><b>Порядок слов:</b> наречие стоит <b>перед</b> обычным глаголом, но <b>после</b> <i>to be</i>. <i>Sometimes</i> можно поставить и в начало предложения.</p><ul><li><i>I usually get up at seven.</i> — Я обычно встаю в семь.</li><li><i>She is never late.</i> — Она никогда не опаздывает.</li><li><i>Sometimes we walk home.</i> — Иногда мы идём домой пешком.</li></ul><p><b>Наречия образа действия</b> отвечают на вопрос «как?». Обычно их образуют так: прилагательное + <b>-ly</b> (<i>slow — slowly, careful — carefully, quiet — quietly</i>). Они стоят после глагола.</p><ul><li><i>He drives carefully.</i> — Он водит осторожно.</li></ul><p>Особые слова: <i>good</i> — прилагательное, а наречие от него <b>well</b>. <i>Fast</i> и <i>hard</i> не меняются: <i>She runs fast. He works hard.</i></p><p><b>Частая ошибка:</b> говорят «He speaks English good» или «He works hardly». Правильно: <i>He speaks English well. He works hard.</i> (<i>hardly</i> значит «почти не»). Также с <i>never</i> не нужно второе отрицание.</p>","ex":[{"q":"I ___ eat meat. I am a vegetarian.","a":"never","o":["never","always","often","usually"],"t":"Я никогда не ем мясо. Я вегетарианец.","e":"Вегетарианец не ест мясо вообще, поэтому never (никогда)."},{"q":"The sun ___ rises in the east.","a":"always","o":["always","never","sometimes","hardly"],"t":"Солнце всегда встаёт на востоке.","e":"Это происходит каждый день, поэтому always (всегда)."},{"q":"Tom ___ late for school.","a":"is never","o":["is never","never is","does never be","is not never"],"t":"Том никогда не опаздывает в школу.","e":"Наречие частоты ставится после глагола to be: is never."},{"q":"How ___ do you go to the gym?","a":"often","o":["often","much","long","many"],"t":"Как часто ты ходишь в спортзал?","e":"Вопрос «как часто» — How often."},{"q":"___ I go to the park, but not very often.","a":"Sometimes","o":["Sometimes","Always","Usually","Never"],"t":"Иногда я хожу в парк, но не очень часто.","e":"Sometimes (иногда) можно поставить в начало предложения."},{"q":"My sister speaks French very ___.","a":"well","o":["well","good","goodly","nice"],"t":"Моя сестра очень хорошо говорит по-французски.","e":"Наречие к глаголу speaks — well, а не good."},{"q":"He is a very ___ driver.","a":"good","o":["good","well","goodly","fastly"],"t":"Он очень хороший водитель.","e":"Перед существительным нужно прилагательное good."},{"q":"This train is very ___.","a":"fast","o":["fast","fastly","fasten","fasty"],"t":"Этот поезд очень быстрый.","e":"Fast — и прилагательное, и наречие. Формы fastly нет."},{"q":"The boy runs very ___.","a":"fast","o":["fast","fastly","fasty","fastish"],"t":"Мальчик бегает очень быстро.","e":"Наречие fast не принимает -ly."},{"q":"She works ___ every day.","a":"hard","o":["hard","hardly","hardy","harder"],"t":"Она усердно работает каждый день.","e":"Hard значит «усердно». Hardly значит «почти не»."},{"q":"Please speak ___. I don't understand.","a":"slowly","o":["slowly","slowy","slowing","slowness"],"t":"Пожалуйста, говорите медленно. Я не понимаю.","e":"Наречие образуем так: slow + -ly = slowly."},{"q":"The baby sleeps ___.","a":"quietly","o":["quietly","quiet","quietness","quieten"],"t":"Малыш спит тихо.","e":"После глагола нужно наречие: quiet + -ly."},{"q":"Anna sings ___.","a":"beautifully","o":["beautifully","beautiful","beauty","beautifuly"],"t":"Анна поёт красиво.","e":"Beautiful + -ly = beautifully. Это наречие к глаголу sings."},{"q":"Be ___ with the glass!","a":"careful","o":["careful","carefully","care","carefuly"],"t":"Будь осторожен со стаканом!","e":"После глагола be нужно прилагательное: careful."},{"q":"My father drives very ___.","a":"carefully","o":["carefully","careful","care","carefuly"],"t":"Мой отец водит очень осторожно.","e":"Глагол drives описывает наречие: carefully."}]},{"id":"a2-gerund-infinitive-basics","level":"A2","title":"Герундий и инфинитив: основы","summary":"enjoy doing, want to do: какая форма после глагола","rule":"<p>Когда после одного глагола стоит второй, он принимает особую форму: либо <b>инфинитив с to</b> (<i>to do</i>), либо <b>-ing</b> форму (герундий). Выбор зависит от первого глагола, его нужно запомнить.</p><table><tr><th>После глаголов</th><th>Форма</th><th>Пример</th></tr><tr><td>want, need, hope, decide, plan, learn, would like</td><td>to + глагол</td><td><i>I want to go home.</i></td></tr><tr><td>enjoy, like, love, hate, finish, stop, mind, keep</td><td>глагол + -ing</td><td><i>She enjoys reading.</i></td></tr></table><p>Глаголы <i>like, love, hate, start, begin</i> допускают обе формы почти без разницы: <i>I like swimming / to swim.</i> Но <i>would like</i> — только с to: <i>I would like to swim.</i></p><ul><li>После предлогов всегда -ing: <i>He is good at drawing. Thanks for helping.</i></li><li>После модальных глаголов (can, must, should) идёт голый инфинитив без to: <i>I can swim.</i></li></ul><p><b>Частая ошибка:</b> «I enjoy to read» или «I want going». Правильно: <i>I enjoy reading. I want to go.</i></p>","ex":[{"q":"I want ___ a new phone.","a":"to buy","o":["to buy","buying","buy","bought"],"t":"Я хочу купить новый телефон.","e":"После want идёт инфинитив с to."},{"q":"She enjoys ___ to music.","a":"listening","o":["listening","to listen","listen","listened"],"t":"Ей нравится слушать музыку.","e":"После enjoy используем -ing форму."},{"q":"We decided ___ a taxi.","a":"to take","o":["to take","taking","take","took"],"t":"Мы решили взять такси.","e":"После decide идёт инфинитив с to."},{"q":"He has finished ___ his homework.","a":"doing","o":["doing","to do","do","done"],"t":"Он закончил делать домашнее задание.","e":"После finish используем -ing форму."},{"q":"I'm good at ___ pictures.","a":"drawing","o":["drawing","to draw","draw","drew"],"t":"Я хорошо рисую.","e":"После предлога at используется -ing форма."},{"q":"Would you like ___ some tea?","a":"to have","o":["to have","having","have","had"],"t":"Хотите выпить чаю?","e":"После would like идёт инфинитив с to."},{"q":"They hope ___ you soon.","a":"to see","o":["to see","seeing","see","saw"],"t":"Они надеются скоро тебя увидеть.","e":"После hope идёт инфинитив с to."},{"q":"Do you mind ___ the window?","a":"opening","o":["opening","to open","open","opened"],"t":"Вы не против открыть окно?","e":"После mind используем -ing форму."},{"q":"My brother can ___ very well.","a":"swim","o":["swim","to swim","swimming","swims"],"t":"Мой брат очень хорошо плавает.","e":"После модального глагола can идёт глагол без to."},{"q":"She hates ___ up early.","a":"getting","o":["getting","to getting","get","got"],"t":"Она ненавидит рано вставать.","e":"После hate допустимо -ing (также to get), но не to getting и не get."},{"q":"I need ___ more water.","a":"to drink","o":["to drink","drinking","drink","drank"],"t":"Мне нужно пить больше воды.","e":"После need идёт инфинитив с to."},{"q":"Thank you for ___ me.","a":"helping","o":["helping","to help","help","helped"],"t":"Спасибо, что помогаешь мне.","e":"После предлога for используем -ing форму."},{"q":"He keeps ___ the same question.","a":"asking","o":["asking","to ask","ask","asked"],"t":"Он продолжает задавать один и тот же вопрос.","e":"После keep используем -ing форму."},{"q":"We plan ___ to Spain in summer.","a":"to travel","o":["to travel","travelling","travel","travelled"],"t":"Мы планируем поехать в Испанию летом.","e":"После plan идёт инфинитив с to."}]},{"id":"a2-object-reflexive-pronouns","level":"A2","title":"Местоимения: объектные и возвратные","summary":"me, him, them; myself, herself, themselves","rule":"<p><b>Объектные местоимения</b> стоят после глагола или предлога и отвечают на вопросы «кого? кому?»: <i>me, you, him, her, it, us, them</i>.</p><table><tr><th>Подлежащее</th><th>Объект</th><th>Возвратное</th></tr><tr><td>I</td><td>me</td><td>myself</td></tr><tr><td>you</td><td>you</td><td>yourself / yourselves</td></tr><tr><td>he / she / it</td><td>him / her / it</td><td>himself / herself / itself</td></tr><tr><td>we / they</td><td>us / them</td><td>ourselves / themselves</td></tr></table><ul><li><i>Call me tomorrow.</i> — Позвони мне завтра.</li><li><i>I'm waiting for them.</i> — Я жду их.</li></ul><p><b>Возвратные местоимения</b> (-self / -selves) используем, когда действие направлено на самого говорящего: <i>She cut herself.</i> — Она порезалась. Также они усиливают смысл: <i>I did it myself.</i> — Я сделал это сам.</p><p><b>Важно:</b> в английском многие глаголы, которые по-русски заканчиваются на -ся, не требуют возвратного местоимения: <i>wash, shave, dress, relax, meet</i>. Говорим <i>He washes every morning</i>, а не «washes himself». Выражение <i>by myself</i> значит «один, без помощи».</p><p><b>Частая ошибка:</b> «I like she» вместо <i>I like her</i>; «They enjoyed theirselves» вместо <i>themselves</i>.</p>","ex":[{"q":"Can you help ___, please?","a":"me","o":["me","I","my","myself"],"t":"Ты можешь мне помочь, пожалуйста?","e":"После глагола help нужно объектное местоимение me."},{"q":"I don't know that man. Do you know ___?","a":"him","o":["him","he","his","himself"],"t":"Я не знаю этого мужчину. Ты его знаешь?","e":"Мужчина здесь объект, поэтому him."},{"q":"My parents are here. I'm waiting for ___.","a":"them","o":["them","they","their","themselves"],"t":"Мои родители здесь. Я жду их.","e":"После предлога for идёт объектное местоимение them."},{"q":"She looked at ___ in the mirror.","a":"herself","o":["herself","her","she","hers"],"t":"Она посмотрела на себя в зеркало.","e":"Действие направлено на саму девушку, поэтому herself."},{"q":"Be careful with that knife or you'll cut ___.","a":"yourself","o":["yourself","you","your","yours"],"t":"Осторожнее с этим ножом, а то порежешься.","e":"Ты порежешь самого себя, поэтому yourself."},{"q":"We painted the house ___.","a":"ourselves","o":["ourselves","us","we","ours"],"t":"Мы покрасили дом сами.","e":"Ourselves подчёркивает, что мы сделали это сами."},{"q":"Our teacher gave ___ a lot of homework.","a":"us","o":["us","we","our","ourselves"],"t":"Наш учитель задал нам много домашнего задания.","e":"Кому задал? Нам, поэтому объектное us."},{"q":"The children enjoyed ___ at the party.","a":"themselves","o":["themselves","them","they","theirselves"],"t":"Дети хорошо повеселились на вечеринке.","e":"Enjoy oneself — устойчивое выражение, themselves."},{"q":"He lives by ___ in a small flat.","a":"himself","o":["himself","him","he","his"],"t":"Он живёт один в маленькой квартире.","e":"By himself значит «один, самостоятельно»."},{"q":"I like this song. Let's listen to ___.","a":"it","o":["it","its","itself","they"],"t":"Мне нравится эта песня. Давай её послушаем.","e":"Песня здесь объект, поэтому it."},{"q":"He gets up and ___ at seven o'clock.","a":"washes","o":["washes","washes himself","washes him","wash himself"],"t":"Он встаёт и умывается в семь часов.","e":"С глаголом wash в обычном значении возвратное местоимение не нужно."},{"q":"Please sit down and make ___ comfortable.","a":"yourself","o":["yourself","you","your","yours"],"t":"Присаживайтесь и устраивайтесь поудобнее.","e":"Make yourself comfortable — устойчивое выражение."},{"q":"I can't find my keys. Have you seen ___?","a":"them","o":["them","they","their","themselves"],"t":"Я не могу найти ключи. Ты их видел?","e":"Keys — множественное число, объект: them."},{"q":"Anna and Tom, please help ___ to some cake.","a":"yourselves","o":["yourselves","yourself","you","themselves"],"t":"Анна и Том, угощайтесь тортом.","e":"Обращение к двум людям: yourselves."}]},{"id":"b1-present-perfect-vs-past-simple","level":"B1","title":"Present Perfect vs Past Simple","summary":"Связь с настоящим или законченное время в прошлом","rule":"<p><b>Past Simple</b> — действие закончилось в прошлом, время названо или понятно: <i>I saw him yesterday.</i> — Я видел его вчера.</p><p><b>Present Perfect</b> (have/has + V3) — важна связь с настоящим: результат, опыт или период, который ещё не закончился (today, this week, ever, never, just, already, yet).</p><table><tr><th>Время</th><th>Когда использовать</th></tr><tr><td>Past Simple</td><td>yesterday, last year, in 2010, ago, when</td></tr><tr><td>Present Perfect</td><td>ever, never, just, already, yet, so far, this week</td></tr></table><p><b>for / since.</b> <i>for</i> + период (for two years), <i>since</i> + точка начала (since 2019, since Monday). Оба идут с Present Perfect, если действие длится до сих пор: <i>I have lived here for five years.</i> — Я живу здесь пять лет.</p><ul><li><i>She has already left.</i> — Она уже ушла.</li><li><i>Have you ever been to Spain?</i> — Ты когда-нибудь был в Испании?</li><li><i>We went to Spain last summer.</i> — Мы ездили в Испанию прошлым летом.</li><li><i>When did you buy it?</i> — Когда ты это купил?</li></ul><p><b>Частая ошибка:</b> по-русски мы говорим «Я живу здесь с 2019 года» и ставим настоящее время. В английском нужно <i>I have lived here since 2019</i>, а не <i>I live here since 2019</i>. И нельзя использовать Present Perfect с точным прошлым: <i>I have seen him yesterday</i> — неверно.</p>","ex":[{"q":"I ___ in this city since 2019.","a":"have lived","o":["lived","have lived","live"],"t":"Я живу в этом городе с 2019 года.","e":"Действие длится до сих пор, есть since — нужен Present Perfect."},{"q":"She ___ her keys yesterday.","a":"lost","o":["has lost","lost","loses"],"t":"Вчера она потеряла ключи.","e":"Есть yesterday — законченное время, значит Past Simple."},{"q":"We have known each other ___ ten years.","a":"for","o":["since","for","ago"],"t":"Мы знаем друг друга десять лет.","e":"После периода времени (ten years) используем for."},{"q":"They have been married ___ 2015.","a":"since","o":["for","since","from"],"t":"Они женаты с 2015 года.","e":"После точки отсчёта (2015) используем since."},{"q":"Have you ever ___ sushi?","a":"eaten","o":["ate","eaten","eat"],"t":"Ты когда-нибудь ел суши?","e":"После have нужна форма V3: eaten."},{"q":"I ___ him last week.","a":"saw","o":["have seen","saw","see"],"t":"Я видел его на прошлой неделе.","e":"Last week — законченный период, нужен Past Simple."},{"q":"___ you finished your homework yet?","a":"Have","o":["Did","Have","Are"],"t":"Ты уже закончил домашнее задание?","e":"Слово yet обычно идёт с Present Perfect: Have you finished…?"},{"q":"Mary has already ___, so you can't speak to her.","a":"left","o":["leave","left","leaving"],"t":"Мэри уже ушла, так что ты не можешь с ней поговорить.","e":"После has нужна форма V3: left."},{"q":"When ___ you last visit your grandparents?","a":"did","o":["have","did","do"],"t":"Когда ты в последний раз навещал бабушку и дедушку?","e":"Вопрос с When о конкретном прошлом времени — Past Simple (did)."},{"q":"This is the best film I ___ ever seen.","a":"have","o":["had","have","did"],"t":"Это лучший фильм, который я когда-либо видел.","e":"Опыт «за всю жизнь» с ever — Present Perfect: I have seen."},{"q":"We ___ to Spain last summer.","a":"went","o":["have gone","went","have been"],"t":"Прошлым летом мы ездили в Испанию.","e":"Last summer — законченное время, Past Simple."},{"q":"It is 8 pm. She has ___ three coffees so far today.","a":"drunk","o":["drank","drunk","drinking"],"t":"Сейчас 8 вечера. Сегодня она выпила уже три чашки кофе.","e":"Сегодняшний день не закончился (so far today), поэтому Present Perfect: has drunk."},{"q":"I have never ___ to Japan.","a":"been","o":["went","been","go"],"t":"Я никогда не был в Японии.","e":"С have never нужна форма V3: been."},{"q":"Shakespeare ___ many famous plays.","a":"wrote","o":["has written","wrote","writes"],"t":"Шекспир написал много известных пьес.","e":"Шекспир давно умер, период закончен — Past Simple."}]},{"id":"b1-present-perfect-continuous","level":"B1","title":"Present Perfect Continuous","summary":"have/has been + -ing: длительность и недавний результат","rule":"<p><b>Образование:</b> <i>have / has + been + V-ing</i>. Отрицание: <i>haven't / hasn't been</i>. Вопрос: <i>Have you been working?</i></p><p><b>Когда используем:</b></p><ul><li>Действие началось в прошлом и <b>продолжается до сих пор</b>, особенно с <i>for, since, how long</i>: <i>I have been waiting for an hour.</i> — Я жду уже час.</li><li>Действие только что закончилось, но <b>виден результат</b>: <i>She is tired. She has been running.</i> — Она устала. Она бегала.</li></ul><table><tr><th>Continuous</th><th>Simple</th></tr><tr><td>Важен процесс, длительность: <i>I have been writing emails all morning.</i></td><td>Важен результат, количество: <i>I have written ten emails.</i></td></tr></table><p>Глаголы состояния (<i>know, like, have, be, want</i>) обычно не используются в Continuous: <i>I have known him for years.</i> — Я знаю его много лет.</p><ul><li><i>It has been raining since morning.</i> — Дождь идёт с утра.</li><li><i>How long have you been learning English?</i> — Как давно ты учишь английский?</li></ul><p><b>Частая ошибка:</b> русские говорят «Я учу английский три года» и ставят настоящее время. Нужно: <i>I have been learning English for three years</i>, а не <i>I am learning English for three years</i>.</p>","ex":[{"q":"I ___ for you for an hour!","a":"have been waiting","o":["am waiting","waited","have been waiting"],"t":"Я жду тебя уже целый час!","e":"Действие длится до сих пор, подчёркнута длительность (for an hour)."},{"q":"She ___ English since she was ten.","a":"has been learning","o":["is learning","has been learning","learned"],"t":"Она изучает английский с десяти лет.","e":"Since + длящееся действие — Present Perfect Continuous."},{"q":"It ___ all morning, so the streets are wet.","a":"has been raining","o":["is raining","has been raining","rained"],"t":"Дождь шёл всё утро, поэтому улицы мокрые.","e":"Недавно закончившееся действие с видимым результатом и длительностью."},{"q":"How long has it ___ snowing?","a":"been","o":["be","being","been"],"t":"Как давно идёт снег?","e":"Конструкция has been + V-ing, значит нужно been."},{"q":"Why are your hands dirty? — I ___ in the garden.","a":"have been working","o":["am working","have been working","work"],"t":"Почему у тебя грязные руки? — Я работал в саду.","e":"Недавно закончившееся действие, оставившее след."},{"q":"They ___ football for two hours, and they are exhausted.","a":"have been playing","o":["are playing","have been playing","play"],"t":"Они играют в футбол уже два часа и совершенно измотаны.","e":"Длительное действие с результатом в настоящем — Present Perfect Continuous."},{"q":"We've ___ for the bus for twenty minutes.","a":"been waiting","o":["waiting","been waiting","been waited","be waiting"],"t":"Мы ждём автобус уже двадцать минут.","e":"Форма: have + been + V-ing."},{"q":"I ___ Tom since we were children.","a":"have known","o":["have been knowing","am knowing","have known","know"],"t":"Я знаю Тома с детства.","e":"Know — глагол состояния, он не употребляется в Continuous."},{"q":"She ___ a headache since lunch.","a":"has had","o":["has been having","is having","has had","had"],"t":"У неё болит голова с обеда.","e":"Have в значении «иметь (болезнь)» — глагол состояния, нужен Present Perfect Simple."},{"q":"I ___ three emails this morning.","a":"have written","o":["have been writing","was writing","have written","am writing"],"t":"Этим утром я написал три письма.","e":"Названо количество — важен результат, поэтому Present Perfect Simple."},{"q":"___ you been crying? Your eyes are red.","a":"Have","o":["Did","Have","Are"],"t":"Ты плакал? У тебя красные глаза.","e":"Вопрос в Present Perfect Continuous начинается с Have you been…"},{"q":"She has been ___ the piano since breakfast.","a":"playing","o":["play","played","playing"],"t":"Она играет на пианино с самого завтрака.","e":"После been нужна форма на -ing."},{"q":"We ___ for a new flat for months.","a":"have been looking","o":["are looking","look","looked","have been looking"],"t":"Мы ищем новую квартиру уже несколько месяцев.","e":"Действие длится до сих пор, указан период (for months)."},{"q":"How long ___ she been waiting?","a":"has","o":["have","is","does","has"],"t":"Как долго она уже ждёт?","e":"С she нужна форма has: has been waiting."}]},{"id":"b1-first-conditional-time-clauses","level":"B1","title":"First conditional и придаточные времени","summary":"If/when/unless + Present Simple, в главной will","rule":"<p><b>First conditional</b> описывает реальное, возможное событие в будущем и его результат.</p><table><tr><th>Придаточное (условие)</th><th>Главное (результат)</th></tr><tr><td>If + Present Simple</td><td>will + глагол</td></tr></table><p><i>If it rains, we will stay at home.</i> — Если пойдёт дождь, мы останемся дома.</p><p><b>Unless</b> = if ... not: <i>Unless you hurry, you will miss the train.</i> — Если ты не поторопишься, ты опоздаешь на поезд.</p><p><b>Придаточные времени</b> (when, as soon as, before, after, until, while) тоже требуют Present Simple, хотя речь о будущем: <i>I will call you when I get home.</i> — Я позвоню тебе, когда приду домой.</p><ul><li><i>I'll wait until you come back.</i> — Я подожду, пока ты вернёшься.</li><li><i>If you have any questions, call me.</i> — Если у тебя будут вопросы, звони мне.</li><li><i>Take an umbrella in case it rains.</i> — Возьми зонт на случай дождя.</li></ul><p>Если придаточное стоит первым, ставим запятую; если вторым — запятая не нужна.</p><p><b>Частая ошибка:</b> по-русски после «если» и «когда» мы используем будущее время («Если пойдёт дождь», «Когда я приду»). В английском <b>нельзя</b> писать <i>If it will rain</i> или <i>when I will come</i>. Правильно: <i>If it rains</i>, <i>when I come</i>.</p>","ex":[{"q":"If it ___ tomorrow, we will stay at home.","a":"rains","o":["will rain","rains","rained"],"t":"Если завтра будет дождь, мы останемся дома.","e":"После if в first conditional используем Present Simple, а не will."},{"q":"I will call you when I ___ home.","a":"get","o":["will get","get","got"],"t":"Я позвоню тебе, когда доберусь домой.","e":"После when в будущем используем Present Simple."},{"q":"If you don't hurry, you ___ the train.","a":"will miss","o":["miss","will miss","would miss"],"t":"Если ты не поторопишься, ты опоздаешь на поезд.","e":"В главной части first conditional ставим will + глагол."},{"q":"We won't go out ___ the weather gets better.","a":"unless","o":["if","unless","when"],"t":"Мы не пойдём гулять, пока погода не улучшится.","e":"Unless значит «если не»: won't go out if the weather doesn't get better."},{"q":"She will be happy if he ___ her a gift.","a":"gives","o":["will give","gives","gave"],"t":"Она будет счастлива, если он подарит ей подарок.","e":"После if используем Present Simple; с he нужна форма gives."},{"q":"___ I finish work, I'll meet you at the cafe.","a":"As soon as","o":["As soon as","Unless","Until"],"t":"Как только я закончу работу, я встречусь с тобой в кафе.","e":"As soon as — «как только», после него Present Simple."},{"q":"I'll wait here until you ___ back.","a":"come","o":["will come","come","are coming"],"t":"Я подожду здесь, пока ты не вернёшься.","e":"После until в будущем используем Present Simple."},{"q":"Unless you ___ harder, you will fail the exam.","a":"study","o":["don't study","study","will study"],"t":"Если ты не будешь заниматься усерднее, ты провалишь экзамен.","e":"Unless уже содержит отрицание, поэтому глагол стоит без not."},{"q":"If he ___ late, we will start without him.","a":"is","o":["will be","is","would be"],"t":"Если он опоздает, мы начнём без него.","e":"После if — Present Simple: he is late."},{"q":"What will you do if you ___ the job?","a":"don't get","o":["won't get","don't get","didn't get"],"t":"Что ты будешь делать, если не получишь эту работу?","e":"После if ставим Present Simple, а не will."},{"q":"Before she ___ the house, she will lock the door.","a":"leaves","o":["will leave","leaves","left"],"t":"Прежде чем выйти из дома, она запрёт дверь.","e":"После before в будущем — Present Simple."},{"q":"I ___ you if I find your keys.","a":"will tell","o":["tell","will tell","would tell"],"t":"Я скажу тебе, если найду твои ключи.","e":"В главной части ставим will + глагол."},{"q":"Take an umbrella in case it ___.","a":"rains","o":["will rain","rains","rained"],"t":"Возьми зонт на случай дождя.","e":"После in case используем Present Simple."},{"q":"If you ___ any questions, please call us.","a":"have","o":["will have","had","are having","have"],"t":"Если у вас возникнут вопросы, пожалуйста, звоните нам.","e":"После if — Present Simple: have."}]},{"id":"b1-second-conditional","level":"B1","title":"Second conditional","summary":"If + Past Simple, would: нереальные ситуации","rule":"<p><b>Second conditional</b> описывает нереальную или маловероятную ситуацию в настоящем или будущем и её воображаемый результат.</p><table><tr><th>Придаточное</th><th>Главное</th></tr><tr><td>If + Past Simple</td><td>would + глагол</td></tr></table><p><i>If I had more money, I would buy a bigger flat.</i> — Если бы у меня было больше денег, я бы купил квартиру побольше.</p><p>Past Simple здесь не означает прошлое: оно показывает нереальность. После <i>I / he / she / it</i> в формальном английском используют <b>were</b>: <i>If I were you, I would talk to him.</i> — На твоём месте я бы поговорил с ним.</p><p>Вместо <i>would</i> можно использовать <i>could</i> («смог бы»): <i>If we lived near the sea, we could swim every day.</i> — Если бы мы жили у моря, мы могли бы плавать каждый день.</p><ul><li><i>What would you do if you won a million dollars?</i> — Что бы ты сделал, если бы выиграл миллион?</li><li><i>She would help you if she knew the answer.</i> — Она бы помогла тебе, если бы знала ответ.</li></ul><p><b>Сравнение:</b> <i>If I have time tomorrow, I will help you.</i> (реально) и <i>If I had time, I would help you.</i> (маловероятно).</p><p><b>Частая ошибка:</b> по-русски «бы» стоит в обеих частях («Если бы я знал, я бы сказал»). В английском <b>нельзя</b> ставить would в часть с if: <i>If I would know</i> — неверно. Правильно: <i>If I knew, I would tell you.</i></p>","ex":[{"q":"If I had more money, I ___ a bigger flat.","a":"would buy","o":["will buy","would buy","bought"],"t":"Если бы у меня было больше денег, я бы купил квартиру побольше.","e":"В главной части second conditional используем would + глагол."},{"q":"If she ___ English better, she would get the job.","a":"spoke","o":["speaks","spoke","would speak"],"t":"Если бы она лучше говорила по-английски, она получила бы эту работу.","e":"После if используем Past Simple."},{"q":"What would you do if you ___ a million dollars?","a":"won","o":["win","won","would win"],"t":"Что бы ты сделал, если бы выиграл миллион долларов?","e":"После if в second conditional — Past Simple."},{"q":"If I ___ you, I would talk to him.","a":"were","o":["am","were","would be"],"t":"На твоём месте я бы поговорил с ним.","e":"В выражении If I were you используется were."},{"q":"He wouldn't be so tired if he ___ more.","a":"slept","o":["sleeps","slept","would sleep"],"t":"Он не был бы таким уставшим, если бы больше спал.","e":"В части с if используем Past Simple, а не would."},{"q":"If it ___ so cold, we would go to the beach.","a":"weren't / wasn't","o":["isn't","weren't","won't be"],"t":"Если бы не было так холодно, мы бы пошли на пляж.","e":"Нереальное условие — Past Simple (weren't / wasn't)."},{"q":"I ___ travel the world if I didn't have to work.","a":"would","o":["will","would","did"],"t":"Я бы путешествовал по миру, если бы мне не нужно было работать.","e":"Результат в second conditional выражается через would."},{"q":"If we lived near the sea, we ___ swim every day.","a":"could","o":["can","could","will"],"t":"Если бы мы жили у моря, мы могли бы плавать каждый день.","e":"В главной части вместо would возможен could (смогли бы)."},{"q":"___ you be happy if you lived in the countryside?","a":"Would","o":["Do","Would","Will"],"t":"Ты был бы счастлив, если бы жил в деревне?","e":"Вопрос в главной части second conditional начинается с Would."},{"q":"If my brother ___ a car, he would drive us to the airport.","a":"had","o":["has","had","would have"],"t":"Если бы у моего брата была машина, он отвёз бы нас в аэропорт.","e":"После if — Past Simple: had."},{"q":"She would help you if she ___ the answer.","a":"knew","o":["knows","knew","would know"],"t":"Она помогла бы тебе, если бы знала ответ.","e":"В части с if ставим Past Simple."},{"q":"If you ___ have a pet, what would it be?","a":"could","o":["can","could","would"],"t":"Если бы ты мог завести питомца, кто бы это был?","e":"Нереальное условие: if + could (Past форма от can)."},{"q":"Mum would be pleased if you ___ more often.","a":"called","o":["call","called","would call"],"t":"Мама была бы рада, если бы ты звонил чаще.","e":"После if используем Past Simple."},{"q":"If I ___ time tomorrow, I will help you.","a":"have","o":["had","have","would have"],"t":"Если у меня завтра будет время, я помогу тебе.","e":"Реальная возможность (will в главной части) — first conditional, if + Present Simple."}]},{"id":"b1-comparison-structures","level":"B1","title":"Сравнения: -er, as ... as, the more ... the better","summary":"Сравнительная и превосходная степень и другие конструкции сравнения","rule":"<p>В английском есть несколько способов сравнить предметы и людей.</p><table><tr><th>Структура</th><th>Пример</th></tr><tr><td>короткое прилагательное + <b>-er than</b></td><td>My bag is lighter than yours.</td></tr><tr><td><b>more</b> + длинное прилагательное + than</td><td>This book is more interesting than that one.</td></tr><tr><td><b>the -est</b> / <b>the most</b></td><td>She is the tallest girl. It is the most expensive hotel.</td></tr><tr><td><b>as ... as</b> (одинаково)</td><td>He is as tall as his father.</td></tr><tr><td><b>not as ... as</b> / <b>less ... than</b></td><td>It isn't as cold as yesterday. This is less difficult than that.</td></tr><tr><td><b>the + comparative, the + comparative</b></td><td>The more you practise, the better you speak.</td></tr></table><ul><li>Правописание: <i>big → bigger, happy → happier, nice → nicer.</i></li><li>Исключения: <i>good → better → the best; bad → worse → the worst; far → farther / further.</i></li><li>Нельзя «more bigger» или «the most best»: одна степень сравнения только один раз.</li><li>После <i>than</i> используется <i>me / him</i> в разговорной речи: <i>She is taller than me.</i> В формальной речи: <i>taller than I am.</i></li><li>Усилители: <i>much / a lot / far + comparative</i> (<i>much better</i>), а <i>very</i> с comparative не используется.</li><li>С превосходной степенью обычно используется <i>the</i> и <i>in / of</i>: <i>the best player in the team.</i></li></ul>","ex":[{"q":"My brother is ___ than me.","a":"taller","o":["tall","taller","the tallest","more tall"],"t":"Мой брат выше меня.","e":"Короткое прилагательное + -er + than."},{"q":"This exercise is ___ than the last one.","a":"more difficult","o":["difficulter","more difficult","most difficult","the more difficult"],"t":"Это упражнение труднее предыдущего.","e":"Длинное прилагательное: more + прилагательное + than."},{"q":"She is the ___ student in our class.","a":"best","o":["good","better","best","most good"],"t":"Она лучшая ученица в нашем классе.","e":"Good имеет форму превосходной степени best."},{"q":"Today is ___ than yesterday. I need a warm coat.","a":"colder","o":["cold","colder","coldest","more cold"],"t":"Сегодня холоднее, чем вчера. Мне нужно тёплое пальто.","e":"Cold + -er = colder."},{"q":"He isn't as old ___ his sister.","a":"as","o":["than","as","like","that"],"t":"Он не такой старый, как его сестра.","e":"Структура as ... as."},{"q":"That was the ___ film I have ever seen.","a":"worst","o":["bad","worse","worst","most bad"],"t":"Это был худший фильм из тех, что я видел.","e":"Bad: worse, the worst."},{"q":"The ___ you practise, the better you play.","a":"more","o":["much","more","most","many"],"t":"Чем больше ты тренируешься, тем лучше играешь.","e":"Конструкция the more ..., the better ...."},{"q":"Their house is ___ than ours.","a":"bigger","o":["big","biger","bigger","more big"],"t":"Их дом больше нашего.","e":"Big удваивает согласную: bigger."},{"q":"London is one of ___ cities in the world.","a":"the most expensive","o":["the more expensive","the most expensive","most expensive","the expensivest"],"t":"Лондон — один из самых дорогих городов мира.","e":"Превосходная степень длинного прилагательного: the most + прилагательное."},{"q":"This sofa is ___ comfortable than the old one.","a":"less","o":["less","least","fewer","lesser"],"t":"Этот диван менее удобный, чем старый.","e":"Less ... than означает «менее ... чем»."},{"q":"She speaks English ___ than her brother.","a":"better","o":["good","well","better","best"],"t":"Она говорит по-английски лучше, чем её брат.","e":"Well в сравнительной степени: better."},{"q":"My car is ___ as fast as yours.","a":"just","o":["just","more","very","the"],"t":"Моя машина едет так же быстро, как твоя.","e":"Just as ... as означает «точно так же ... как»."},{"q":"The weather is ___ better today. We can go to the beach.","a":"much","o":["very","much","most","so"],"t":"Сегодня погода намного лучше. Мы можем пойти на пляж.","e":"Усилитель с comparative: much, а very не подходит."},{"q":"She is the ___ girl in the family.","a":"happiest","o":["happier","happyest","happiest","most happy"],"t":"Она самая счастливая девочка в семье.","e":"Happy → happiest (y меняется на i)."},{"q":"This road is ___ than that one. Let's take the other.","a":"more dangerous","o":["dangerouser","more dangerous","most dangerous","the dangerous"],"t":"Эта дорога опаснее той. Давай поедем по другой.","e":"Длинное прилагательное: more dangerous than."}]},{"id":"b1-defining-relative-clauses","level":"B1","title":"Defining relative clauses: who, which, that, whose","summary":"Придаточные, которые уточняют, о ком или о чём речь","rule":"<p><b>Defining relative clause</b> (определительное придаточное) отвечает на вопрос «какой именно?». Без него предложение теряет смысл: <i>The man who lives next door is a doctor.</i> Запятыми такое придаточное <b>не выделяется</b>.</p><table><tr><th>Слово</th><th>Когда</th><th>Пример</th></tr><tr><td>who / that</td><td>люди</td><td>The girl who called me is my cousin.</td></tr><tr><td>which / that</td><td>предметы, животные</td><td>The book which I read was great.</td></tr><tr><td>whose</td><td>принадлежность (чей)</td><td>I know a man whose son is an actor.</td></tr><tr><td>where</td><td>место</td><td>This is the café where we met.</td></tr></table><ul><li>Если местоимение является <b>подлежащим</b> придаточного, его нельзя опускать: <i>The woman who works here is kind.</i></li><li>Если оно является <b>дополнением</b>, его можно опустить: <i>The film (that) we saw was boring.</i></li><li>После <i>all, everything, something, nothing, the only, the first, the best</i> обычно используется <b>that</b>.</li><li>Не добавляйте лишнее местоимение: нельзя <i>The man who he lives...</i>; правильно: <i>The man who lives...</i></li></ul><p>Предлог может стоять в конце: <i>The person (who) I spoke to was polite.</i></p>","ex":[{"q":"The woman ___ lives upstairs is a nurse.","a":"who","o":["who","which","whose","where"],"t":"Женщина, которая живёт наверху, медсестра.","e":"О человеке в роли подлежащего используем who (или that)."},{"q":"I lost the umbrella ___ my mother gave me.","a":"which","o":["who","which","whose","where"],"t":"Я потерял зонт, который мне подарила мама.","e":"Зонт — предмет, поэтому which (или that)."},{"q":"He is the man ___ car was stolen.","a":"whose","o":["who","which","whose","that"],"t":"Это человек, у которого украли машину.","e":"Whose выражает принадлежность: чья машина."},{"q":"This is the town ___ I was born.","a":"where","o":["which","who","where","whose"],"t":"Это город, в котором я родился.","e":"Для места используем where (= in which)."},{"q":"Everything ___ he said was true.","a":"that","o":["which","what","that","who"],"t":"Всё, что он сказал, было правдой.","e":"После everything обычно используется that, а не which или what."},{"q":"The film ___ we watched yesterday was boring.","a":"that","o":["who","that","whose","where"],"t":"Фильм, который мы смотрели вчера, был скучным.","e":"That подходит для предметов; здесь это дополнение, его можно и опустить."},{"q":"Students ___ study hard usually pass the exam.","a":"who","o":["which","whose","who","where"],"t":"Студенты, которые усердно учатся, обычно сдают экзамен.","e":"Речь о людях, местоимение — подлежащее: who."},{"q":"She is the only person ___ understands me.","a":"that","o":["which","that","whose","what"],"t":"Она единственный человек, который меня понимает.","e":"После the only обычно используется that."},{"q":"I met a girl ___ brother plays for Real Madrid.","a":"whose","o":["who","whose","which","that"],"t":"Я познакомился с девушкой, чей брат играет за «Реал Мадрид».","e":"Принадлежность: whose + существительное."},{"q":"The phone ___ is on the table is mine.","a":"which","o":["who","whose","which","where"],"t":"Телефон, который лежит на столе, мой.","e":"Предмет в роли подлежащего: which или that."},{"q":"Is this the shop ___ you bought your jacket?","a":"where","o":["which","where","who","whose"],"t":"Это магазин, где ты купил куртку?","e":"Место — where."},{"q":"The man ___ I spoke to was very helpful.","a":"who","o":["whose","who","where","what"],"t":"Мужчина, с которым я говорил, был очень полезен.","e":"Человек, слово в роли дополнения; who (или that) допустимо, а также можно опустить."},{"q":"There is nothing ___ I can do about it.","a":"that","o":["what","who","that","whose"],"t":"Тут ничего нельзя сделать.","e":"После nothing используется that (или ничего)."},{"q":"I like people ___ are honest.","a":"who","o":["which","who","whose","where"],"t":"Мне нравятся люди, которые честны.","e":"Люди и подлежащее: who."},{"q":"That is the restaurant ___ we had dinner last week.","a":"where","o":["who","which","where","whose"],"t":"Это ресторан, где мы ужинали на прошлой неделе.","e":"Where заменяет in which и указывает на место."}]},{"id":"b1-gerunds-infinitives","level":"B1","title":"Герундий и инфинитив: -ing или to?","summary":"Какую форму глагола ставить после другого глагола","rule":"<p>После многих глаголов второй глагол принимает форму <b>-ing</b> (герундий) или <b>to + инфинитив</b>. Нужную форму определяет первый глагол, поэтому их полезно запоминать группами.</p><table><tr><th>Форма</th><th>После каких слов</th><th>Пример</th></tr><tr><td>-ing</td><td>enjoy, avoid, finish, mind, suggest, keep, practise, give up, can't stand</td><td>She enjoys swimming.</td></tr><tr><td>to + V</td><td>want, decide, hope, plan, agree, refuse, promise, manage, learn, would like</td><td>I decided to leave.</td></tr><tr><td>V без to</td><td>can, must, should, let, make (+ объект)</td><td>She made me laugh.</td></tr></table><ul><li><b>После предлогов</b> всегда -ing: <i>She is good at cooking. Thanks for helping.</i></li><li><b>Цель</b> («чтобы») выражается to + V: <i>I went to the shop to buy milk.</i></li><li><b>Прилагательное + to + V:</b> <i>It's easy to learn. I'm happy to help.</i></li><li><b>Глагол как подлежащее</b> обычно в форме -ing: <i>Swimming is good for you.</i></li><li>Глаголы <i>like, love, hate, start, begin</i> допускают обе формы почти без разницы: <i>I like swimming / to swim.</i></li><li><b>Stop:</b> <i>stop smoking</i> (прекратить), <i>stop to smoke</i> (остановиться, чтобы покурить).</li></ul>","ex":[{"q":"I enjoy ___ to music in the evening.","a":"listening","o":["listen","to listen","listening","listened"],"t":"Я люблю слушать музыку по вечерам.","e":"После enjoy используется -ing."},{"q":"She decided ___ a new job.","a":"to look for","o":["looking for","to look for","look for","looked for"],"t":"Она решила искать новую работу.","e":"После decide используется to + инфинитив."},{"q":"He avoided ___ about the problem.","a":"talking","o":["to talk","talk","talking","talked"],"t":"Он избегал разговоров о проблеме.","e":"После avoid используется -ing."},{"q":"We hope ___ you soon.","a":"to see","o":["seeing","to see","see","saw"],"t":"Мы надеемся скоро увидеть вас.","e":"После hope используется to + инфинитив."},{"q":"Are you good at ___ pictures?","a":"drawing","o":["draw","to draw","drawing","drew"],"t":"Ты хорошо рисуешь?","e":"После предлога at используется -ing."},{"q":"My mum made me ___ my room.","a":"clean","o":["to clean","cleaning","cleaned","clean"],"t":"Мама заставила меня убрать комнату.","e":"После make + объект идёт инфинитив без to."},{"q":"I went to the bank ___ some money.","a":"to get","o":["getting","to get","get","for get"],"t":"Я сходил в банк, чтобы снять деньги.","e":"Цель действия выражается to + инфинитив."},{"q":"Would you mind ___ the window?","a":"closing","o":["to close","close","closing","closed"],"t":"Вы не против закрыть окно?","e":"После mind используется -ing."},{"q":"They refused ___ the money back.","a":"to give","o":["giving","to give","give","gave"],"t":"Они отказались вернуть деньги.","e":"После refuse используется to + инфинитив."},{"q":"___ is a great way to stay healthy.","a":"Cycling","o":["Cycle","To cycling","Cycling","Cycled"],"t":"Езда на велосипеде — отличный способ оставаться здоровым.","e":"Глагол в роли подлежащего обычно принимает форму -ing."},{"q":"She finished ___ the report at six.","a":"writing","o":["to write","writing","write","wrote"],"t":"Она закончила писать отчёт в шесть.","e":"После finish используется -ing."},{"q":"I can't ___ in this noise.","a":"concentrate","o":["concentrating","to concentrate","concentrate","concentrated"],"t":"Я не могу сосредоточиться в таком шуме.","e":"После can't идёт инфинитив без to."},{"q":"It's difficult ___ a good job in this town.","a":"to find","o":["finding","to find","find","found"],"t":"В этом городе трудно найти хорошую работу.","e":"После прилагательного используется to + инфинитив."},{"q":"He stopped ___ when he saw a friend. (He paused in order to talk.)","a":"to talk","o":["to talk","talking","talk","talked"],"t":"Он остановился поговорить, когда увидел друга.","e":"Stop to do означает остановиться, чтобы сделать что-то."},{"q":"Thank you for ___ me with my homework.","a":"helping","o":["help","to help","helping","helped"],"t":"Спасибо, что помог мне с домашним заданием.","e":"После предлога for используется -ing."}]},{"id":"b1-modals-deduction","level":"B1","title":"Модальные глаголы предположения: must, might, can't","summary":"Насколько мы уверены: должно быть, возможно, не может быть","rule":"<p>Модальные глаголы помогают сказать, <b>насколько мы уверены</b> в своём предположении, опираясь на факты.</p><table><tr><th>Уверенность</th><th>Глагол</th><th>Пример</th></tr><tr><td>почти 100% «да»</td><td>must</td><td>He has been working all day. He must be tired.</td></tr><tr><td>возможно (50%)</td><td>might / may / could</td><td>She might be at home. It could rain.</td></tr><tr><td>почти 100% «нет»</td><td>can't</td><td>That can't be true!</td></tr></table><ul><li><b>Настоящее:</b> modal + инфинитив без to: <i>must be, might know.</i> Для действия в процессе: <i>must be working, might be sleeping.</i></li><li><b>Прошлое:</b> modal + <b>have + V3</b>: <i>He must have forgotten. She can't have seen us. They might have left.</i></li><li>В значении «не может быть» используйте <b>can't</b> (или <i>couldn't</i>), а не <i>mustn't</i>. <i>Mustn't</i> означает запрет: <i>You mustn't smoke here.</i></li><li>В вопросах о предположении <i>must</i> не используется: <i>Can he be at home?</i> или <i>Is he likely to be at home?</i></li><li><i>Might not</i> и <i>may not</i> означают «возможно, нет»: <i>She might not come.</i></li></ul>","ex":[{"q":"He has been running for an hour. He ___ be very tired.","a":"must","o":["must","can't","might not","mustn't"],"t":"Он бежит уже час. Он, должно быть, очень устал.","e":"Из фактов следует почти уверенный вывод: must."},{"q":"She is a vegetarian. She ___ eat meat.","a":"can't","o":["must","can't","might","may"],"t":"Она вегетарианка. Она не может есть мясо.","e":"Почти уверены, что «нет»: can't."},{"q":"I'm not sure where Tom is. He ___ be at work.","a":"might","o":["must","can't","might","mustn't"],"t":"Не знаю, где Том. Возможно, он на работе.","e":"Неуверенное предположение: might (may, could)."},{"q":"The lights are on. Somebody ___ be at home.","a":"must","o":["must","can't","mustn't","shouldn't"],"t":"Свет горит. Кто-то, должно быть, дома.","e":"По очевидному признаку делаем уверенный вывод: must."},{"q":"That ___ be Anna. She is in Paris this week.","a":"can't","o":["must","might","can't","needn't"],"t":"Это не может быть Анна. Она на этой неделе в Париже.","e":"Факт исключает предположение: can't be."},{"q":"He didn't answer the phone. He ___ be sleeping.","a":"might","o":["can't","might","mustn't","needn't"],"t":"Он не ответил на звонок. Возможно, он спит.","e":"Нет полной уверенности: might be sleeping."},{"q":"She isn't at her desk. She ___ have gone home.","a":"must","o":["must","can","should","has to"],"t":"Её нет за столом. Должно быть, она ушла домой.","e":"Уверенный вывод о прошлом: must have + V3."},{"q":"I can't find my keys. I ___ have left them in the car.","a":"might","o":["can't","might","mustn't","must to"],"t":"Не могу найти ключи. Возможно, я оставил их в машине.","e":"Возможность в прошлом: might have + V3."},{"q":"You ___ be hungry already! You've just had lunch.","a":"can't","o":["must","can't","might","may"],"t":"Ты не можешь быть уже голодным! Ты только что пообедал.","e":"Вывод «не может быть»: can't be."},{"q":"They ___ have seen us. They didn't wave.","a":"can't","o":["must","can't","might","should"],"t":"Они не могли нас видеть. Они не помахали.","e":"Уверенное «нет» о прошлом: can't have + V3."},{"q":"The phone is ringing. It ___ be Mum.","a":"could","o":["could","mustn't","can't have","needn't"],"t":"Звонит телефон. Это может быть мама.","e":"Could выражает возможность: could be."},{"q":"You ___ park here. It's forbidden.","a":"mustn't","o":["can't be","mustn't","might not","couldn't be"],"t":"Здесь нельзя парковаться. Это запрещено.","e":"Mustn't означает запрет, а не предположение."},{"q":"Look at those clouds. It ___ rain later.","a":"might","o":["might","must","mustn't","can't"],"t":"Посмотри на облака. Позже может пойти дождь.","e":"Возможность (не уверенность): might."},{"q":"He ___ be rich. He lives in a tiny flat and drives an old car.","a":"can't","o":["must","can't","might","has to"],"t":"Он не может быть богатым. Он живёт в крошечной квартире и ездит на старой машине.","e":"Факты противоречат предположению: can't be."},{"q":"Sam isn't here. I don't know why. He ___ be ill.","a":"might","o":["must","can't","might","mustn't"],"t":"Сэма нет. Не знаю почему. Возможно, он болен.","e":"Причина неизвестна, уверенности нет: might."}]},{"id":"b1-passive-present-past","level":"B1","title":"Passive Voice: Present & Past","summary":"is made, was built: когда важно действие, а не деятель","rule":"<p><b>Пассивный (страдательный) залог</b> используется, когда нам важен результат или объект действия, а исполнитель неизвестен, неважен или очевиден. Формула: <b>to be + третья форма глагола (V3)</b>.</p><table><tr><th>Время</th><th>Формула</th><th>Пример</th></tr><tr><td>Present Simple</td><td>am / is / are + V3</td><td><i>English is spoken here.</i></td></tr><tr><td>Past Simple</td><td>was / were + V3</td><td><i>The bridge was built in 1990.</i></td></tr></table><p><b>Как превратить предложение:</b> <i>Someone stole my bike.</i> → <i>My bike was stolen.</i> Объект становится подлежащим, глагол to be берёт время исходного глагола, основной глагол идёт в V3.</p><ul><li><b>Отрицание:</b> <i>The room isn't cleaned every day.</i></li><li><b>Вопрос:</b> <i>Were the letters sent yesterday?</i></li><li>Исполнитель, если он важен, вводится предлогом <b>by</b>: <i>The book was written by Orwell.</i></li></ul><p>По-русски пассив часто передаётся глаголами на -ся или безличными формами: «Здесь говорят по-английски» = <i>English is spoken here.</i></p><p><b>Частая ошибка:</b> забывают to be («The cars made in Japan») или ставят V2 вместо V3 («was wrote» вместо <i>was written</i>). Глаголы без объекта (<i>happen, arrive, die</i>) в пассиве не употребляются.</p>","ex":[{"q":"English ___ all over the world.","a":"is spoken","o":["is spoken","speaks","is speak","was spoken"],"t":"На английском говорят по всему миру.","e":"Present Simple Passive: is + V3."},{"q":"These cars ___ in Germany.","a":"are made","o":["are made","is made","made","are make"],"t":"Эти машины производят в Германии.","e":"Подлежащее cars во множественном числе: are + made."},{"q":"The Eiffel Tower ___ in 1889.","a":"was built","o":["was built","is built","built","were built"],"t":"Эйфелева башня была построена в 1889 году.","e":"Прошедшее время, единственное число: was + V3."},{"q":"My phone ___ yesterday.","a":"was stolen","o":["was stolen","stolen","was stole","were stolen"],"t":"Мой телефон украли вчера.","e":"Нужна форма V3 от steal — stolen."},{"q":"The windows ___ every week.","a":"are cleaned","o":["are cleaned","is cleaned","cleaned","were cleaned"],"t":"Окна моют каждую неделю.","e":"Every week указывает на Present Simple, windows — множественное число."},{"q":"The letters ___ to the wrong address last week.","a":"were sent","o":["were sent","was sent","are sent","sent"],"t":"На прошлой неделе письма отправили не по тому адресу.","e":"Last week — Past Simple; letters — were + V3."},{"q":"This book ___ by a famous author.","a":"was written","o":["was written","wrote","was wrote","is wrote"],"t":"Эта книга была написана известным автором.","e":"V3 от write — written."},{"q":"Where ___ this film made?","a":"was","o":["was","did","is made","were"],"t":"Где был снят этот фильм?","e":"Вопрос в пассиве: was + подлежащее + V3."},{"q":"The room ___ cleaned yesterday.","a":"wasn't","o":["wasn't","isn't","weren't","didn't"],"t":"Комнату вчера не убирали.","e":"Yesterday — Past Simple, комната одна: wasn't + V3."},{"q":"Football ___ played in many countries.","a":"is","o":["is","does","has","are"],"t":"В футбол играют во многих странах.","e":"Passive: is + V3; football — единственное число."},{"q":"The thieves ___ by the police last night.","a":"were caught","o":["were caught","was caught","caught","are caught"],"t":"Воров поймала полиция прошлой ночью.","e":"Thieves — множественное число, прошедшее время: were + V3."},{"q":"Rice ___ grown in China.","a":"is grown","o":["is grown","grows","is grew","are grown"],"t":"Рис выращивают в Китае.","e":"Общий факт: is + V3 (rice — неисчисляемое)."},{"q":"I ___ born in 1998.","a":"was","o":["was","were","am","did"],"t":"Я родился в 1998 году.","e":"Be born всегда в пассиве; для I в прошлом — was."},{"q":"The museum ___ visited by thousands of people every year.","a":"is","o":["is","are","was","has"],"t":"Музей посещают тысячи людей каждый год.","e":"Every year — Present Simple; museum — единственное число: is."}]},{"id":"b1-quantifiers","level":"B1","title":"Quantifiers: much, many, few, little, enough, too","summary":"Слова количества с исчисляемыми и неисчисляемыми существительными","rule":"<p>Слова количества (quantifiers) зависят от типа существительного: <b>исчисляемое</b> (<i>apple, friend</i>) или <b>неисчисляемое</b> (<i>water, money, time, information</i>).</p><table><tr><th>С исчисляемыми</th><th>С неисчисляемыми</th><th>С обоими</th></tr><tr><td>many friends</td><td>much time</td><td>a lot of / lots of</td></tr><tr><td>a few apples (несколько)</td><td>a little water (немного)</td><td>some, any, enough, no</td></tr><tr><td>few apples (мало, почти нет)</td><td>little water (мало, почти нет)</td><td>plenty of</td></tr></table><ul><li><b>Many</b> и <b>much</b> чаще используются в вопросах и отрицаниях: <i>How much money do you have? We don't have many chairs.</i> В утверждениях лучше <i>a lot of</i>.</li><li><b>A few / a little</b> звучат положительно («немного, но есть»), а <b>few / little</b> — отрицательно («очень мало»): <i>I have a few friends here. I have few friends.</i></li><li><b>Some</b> — в утверждениях, <b>any</b> — в вопросах и отрицаниях: <i>I have some milk. Do you have any milk?</i> В просьбах и предложениях тоже some: <i>Would you like some tea?</i></li><li><b>Enough</b> стоит перед существительным и после прилагательного: <i>enough money, old enough.</i> <b>Too</b> значит «слишком»: <i>too hot, too many people</i>.</li><li><b>Every</b> и <b>each</b> с единственным числом: <i>Every student has a book.</i></li></ul>","ex":[{"q":"How ___ money do you have?","a":"much","o":["many","much","few","a few"],"t":"Сколько у тебя денег?","e":"Money неисчисляемое, поэтому much."},{"q":"How ___ people came to the party?","a":"many","o":["much","many","little","a little"],"t":"Сколько людей пришло на вечеринку?","e":"People исчисляемое: many."},{"q":"I don't have ___ free time this week.","a":"much","o":["many","much","a few","few"],"t":"На этой неделе у меня мало свободного времени.","e":"Time неисчисляемое, отрицание: much."},{"q":"Can I have ___ water, please?","a":"some","o":["any","some","many","few"],"t":"Можно мне воды, пожалуйста?","e":"В просьбе используется some."},{"q":"Do you have ___ brothers or sisters?","a":"any","o":["some","any","a little","much"],"t":"У тебя есть братья или сёстры?","e":"В вопросе обычно any."},{"q":"She has ___ friends in this city, so she often feels lonely.","a":"few","o":["few","a few","a little","much"],"t":"У неё мало друзей в этом городе, поэтому она часто чувствует себя одинокой.","e":"Few означает «очень мало», с оттенком недостатка."},{"q":"I have ___ ideas. Let me tell you.","a":"a few","o":["few","a few","a little","much"],"t":"У меня есть несколько идей. Давай расскажу.","e":"A few означает «несколько» (положительный смысл)."},{"q":"There is ___ milk in the fridge, so we can make pancakes.","a":"a little","o":["a few","a little","few","many"],"t":"В холодильнике есть немного молока, так что можно сделать блины.","e":"Milk неисчисляемое; a little означает «немного, но есть»."},{"q":"He earns ___ money, so he can't buy a car.","a":"little","o":["few","little","a little","many"],"t":"Он зарабатывает очень мало денег, поэтому не может купить машину.","e":"Little означает «очень мало» с неисчисляемым существительным."},{"q":"We have ___ chairs for everyone.","a":"enough","o":["enough","too","much","a little"],"t":"У нас достаточно стульев для всех.","e":"Enough означает «достаточно» и стоит перед существительным."},{"q":"This coffee is ___ hot to drink.","a":"too","o":["enough","too","very much","so many"],"t":"Этот кофе слишком горячий, чтобы его пить.","e":"Too означает «слишком» и ставится перед прилагательным."},{"q":"He isn't tall ___ to play basketball.","a":"enough","o":["enough","too","much","many"],"t":"Он недостаточно высокий, чтобы играть в баскетбол.","e":"С прилагательным enough стоит после него."},{"q":"There were ___ people at the concert. It was crowded.","a":"too many","o":["too much","too many","too few","enough"],"t":"На концерте было слишком много людей. Было тесно.","e":"People исчисляемое: too many."},{"q":"___ student in the class has a laptop.","a":"Every","o":["Every","All","Many","Few"],"t":"У каждого ученика в классе есть ноутбук.","e":"Every используется с существительным в единственном числе и глаголом has."},{"q":"I'd like to buy ___ bread, but I don't need much.","a":"a little","o":["a few","a little","many","few"],"t":"Я хочу купить немного хлеба, но много не нужно.","e":"Bread неисчисляемое; a little означает «немного»."}]},{"id":"b1-reported-statements","level":"B1","title":"Reported statements: косвенная речь","summary":"Как пересказать чужие слова: say, tell и сдвиг времён","rule":"<p>В <b>косвенной речи</b> мы пересказываем чужие слова. Если вводный глагол стоит в прошедшем (<i>said, told</i>), времена обычно «сдвигаются назад».</p><table><tr><th>Прямая речь</th><th>Косвенная речь</th></tr><tr><td>Present Simple: \"I work.\"</td><td>Past Simple: He said he worked.</td></tr><tr><td>Present Continuous: \"I am working.\"</td><td>Past Continuous: He said he was working.</td></tr><tr><td>Past Simple: \"I worked.\"</td><td>Past Perfect: He said he had worked.</td></tr><tr><td>Present Perfect: \"I have worked.\"</td><td>Past Perfect: He said he had worked.</td></tr><tr><td>will: \"I will work.\"</td><td>would: He said he would work.</td></tr><tr><td>can: \"I can work.\"</td><td>could: He said he could work.</td></tr></table><ul><li>Меняются местоимения по смыслу: <i>\"I like my job,\" she said. → She said she liked her job.</i></li><li>Меняются слова времени и места: <i>now → then, today → that day, yesterday → the day before, tomorrow → the next day, here → there.</i></li><li><b>say</b> без дополнения: <i>She said (that) she was tired.</i> <b>tell</b> всегда с дополнением: <i>She told me (that) she was tired.</i> Нельзя: <i>She said me.</i></li><li>Если сообщаемое остаётся верным сейчас, сдвиг необязателен: <i>He said the Earth is round.</i></li></ul>","ex":[{"q":"\"I am tired,\" she said. → She said she ___ tired.","a":"was","o":["is","was","has been","were"],"t":"«Я устала», — сказала она. → Она сказала, что устала.","e":"Present Simple (am) сдвигается в Past Simple: was."},{"q":"\"I work in a bank,\" he said. → He said he ___ in a bank.","a":"worked","o":["works","worked","had worked","was work"],"t":"«Я работаю в банке», — сказал он.","e":"Present Simple становится Past Simple: worked."},{"q":"\"We are leaving,\" they said. → They said they ___ leaving.","a":"were","o":["are","was","were","have been"],"t":"«Мы уезжаем», — сказали они.","e":"Present Continuous переходит в Past Continuous; с they — were."},{"q":"\"I visited Rome,\" she said. → She said she ___ Rome.","a":"had visited","o":["visited","has visited","had visited","would visit"],"t":"«Я была в Риме», — сказала она.","e":"Past Simple сдвигается в Past Perfect: had visited."},{"q":"\"I have finished,\" he said. → He said he ___ finished.","a":"had","o":["has","had","would have","was"],"t":"«Я закончил», — сказал он.","e":"Present Perfect переходит в Past Perfect: had finished."},{"q":"\"I will call you,\" she said. → She said she ___ call me.","a":"would","o":["will","would","can","did"],"t":"«Я позвоню тебе», — сказала она.","e":"Will в косвенной речи превращается в would."},{"q":"\"I can swim,\" he said. → He said he ___ swim.","a":"could","o":["can","could","would","might"],"t":"«Я умею плавать», — сказал он.","e":"Can становится could."},{"q":"She told ___ that she was busy.","a":"me","o":["me","to me","I","for me"],"t":"Она сказала мне, что занята.","e":"После tell нужно дополнение без предлога: told me."},{"q":"He ___ that he didn't know the answer.","a":"said","o":["told","said","spoke","talked"],"t":"Он сказал, что не знает ответа.","e":"Без дополнения используется say: said."},{"q":"\"I'll see you tomorrow,\" she said. → She said she would see me ___.","a":"the next day","o":["tomorrow","the next day","yesterday","today"],"t":"«Увидимся завтра», — сказала она.","e":"Tomorrow меняется на the next day (или the following day)."},{"q":"\"I like this book,\" he said. → He said he liked ___ book.","a":"that","o":["this","that","these","those"],"t":"«Мне нравится эта книга», — сказал он.","e":"This обычно заменяется на that."},{"q":"\"I saw him yesterday,\" she said. → She said she had seen him ___.","a":"the day before","o":["yesterday","the day before","the next day","last day"],"t":"«Я видела его вчера», — сказала она.","e":"Yesterday меняется на the day before."},{"q":"Tom told me he ___ to Paris the following week.","a":"was going","o":["is going","was going","goes","had gone"],"t":"Том сказал мне, что на следующей неделе едет в Париж.","e":"Is going сдвигается в was going."},{"q":"\"I'm living here now,\" she said. → She said she was living there ___.","a":"then","o":["now","then","here","today"],"t":"«Сейчас я живу здесь», — сказала она.","e":"Now меняется на then, here на there."},{"q":"They said they ___ the film before.","a":"had seen","o":["saw","have seen","had seen","would see"],"t":"Они сказали, что уже видели этот фильм.","e":"Present Perfect/Past Simple в прямой речи дают Past Perfect: had seen."}]},{"id":"b1-used-to-would","level":"B1","title":"Used to, would и be used to","summary":"Привычки и состояния в прошлом, а также привыкание","rule":"<p><b>Used to + глагол</b> описывает привычки и состояния в прошлом, которых <b>больше нет</b>: <i>I used to smoke.</i> (раньше курил, теперь нет). <b>Would + глагол</b> тоже говорит о повторяющихся действиях в прошлом, но только о <b>действиях</b>, не о состояниях.</p><table><tr><th>Конструкция</th><th>Значение</th><th>Пример</th></tr><tr><td>used to + V</td><td>прошлые привычки и состояния</td><td>We used to live in Kazan. I used to be shy.</td></tr><tr><td>would + V</td><td>повторяющиеся действия в прошлом</td><td>Every summer we would visit our grandma.</td></tr><tr><td>be / get used to + V-ing</td><td>быть привычным / привыкать</td><td>I am used to getting up early.</td></tr></table><ul><li><b>Отрицание и вопрос:</b> <i>I didn't use to like fish. Did you use to play chess?</i> Здесь <i>use</i> без -d.</li><li>Со <b>состояниями</b> (<i>be, have, know, like, live</i>) нельзя would: <i>She used to have long hair.</i> (не <i>would have</i>).</li><li>Used to нельзя применять для одноразовых событий и точного числа раз: <i>I went to Spain three times.</i></li><li>Для настоящего привычного действия <i>used to</i> не используется: <i>I usually get up at 7.</i></li><li>После <i>be used to</i> идёт <b>-ing</b> или существительное: <i>He is used to the noise.</i></li></ul>","ex":[{"q":"When I was a child, I ___ play outside every day.","a":"used to","o":["use to","used to","am used to","would to"],"t":"Когда я был ребёнком, я каждый день играл на улице.","e":"Прошлая привычка: used to + глагол."},{"q":"She ___ have long hair, but now it is short.","a":"used to","o":["would","used to","is used to","was used to"],"t":"Раньше у неё были длинные волосы, а теперь короткие.","e":"Have здесь состояние, would не подходит; нужно used to."},{"q":"Did you ___ live in London?","a":"use to","o":["used to","use to","would","be used to"],"t":"Ты раньше жил в Лондоне?","e":"В вопросе с did форма use to без -d."},{"q":"I didn't ___ like coffee when I was young.","a":"use to","o":["used to","use to","would","using to"],"t":"В молодости я не любил кофе.","e":"В отрицании с didn't: use to."},{"q":"Every Sunday my dad ___ make pancakes for us.","a":"would","o":["would","is used to","was used to","used"],"t":"Каждое воскресенье папа готовил нам блины.","e":"Повторяющееся действие в прошлом: would или used to."},{"q":"I'm ___ getting up early now, so it isn't hard.","a":"used to","o":["use to","used to","would","used"],"t":"Теперь я привык вставать рано, поэтому это не трудно.","e":"Be used to + -ing означает «привык»."},{"q":"It took me a long time to get ___ living in a big city.","a":"used to","o":["use to","used to","would","used"],"t":"Мне потребовалось много времени, чтобы привыкнуть жить в большом городе.","e":"Get used to + -ing означает «привыкать»."},{"q":"He ___ be very shy, but he's confident now.","a":"used to","o":["would","used to","is used to","was use to"],"t":"Раньше он был очень застенчив, а теперь уверен в себе.","e":"С глаголом состояния be нельзя would; нужно used to."},{"q":"We ___ in a small village when I was a kid.","a":"used to live","o":["would live","used to live","are used to live","use to live"],"t":"Мы жили в маленькой деревне, когда я был ребёнком.","e":"Live здесь состояние, поэтому used to live."},{"q":"She isn't used to ___ in the cold.","a":"working","o":["work","to work","working","worked"],"t":"Она не привыкла работать на холоде.","e":"После be used to идёт -ing."},{"q":"There ___ be a cinema here, but it closed.","a":"used to","o":["would","used to","is used to","was used"],"t":"Здесь раньше был кинотеатр, но его закрыли.","e":"Состояние в прошлом (there used to be); would не подходит."},{"q":"My grandfather ___ tell us stories every evening.","a":"would","o":["would","is used to","used","is use to"],"t":"Дедушка каждый вечер рассказывал нам истории.","e":"Повторяющееся действие в прошлом: would."},{"q":"I'm not used ___ spicy food.","a":"to","o":["to","for","with","of"],"t":"Я не привык к острой еде.","e":"Be used to + существительное или -ing."},{"q":"Where did you ___ go on holiday as a child?","a":"use to","o":["used to","use to","would to","be used to"],"t":"Куда ты ездил на каникулы в детстве?","e":"После did используется use to."},{"q":"I ___ to the gym three times last week.","a":"went","o":["used to go","would go","went","am used to going"],"t":"На прошлой неделе я ходил в спортзал три раза.","e":"Конкретный период и точное число раз: нужен Past Simple, а не used to или would."}]},{"id":"b2-conditionals-3-mixed","level":"B2","title":"Third conditional и mixed conditionals","summary":"Нереальное прошлое и его влияние на настоящее","rule":"<p><b>Third conditional</b> описывает нереальную ситуацию в прошлом: то, чего не случилось, и его воображаемый результат.</p><table><tr><th>if-часть</th><th>главная часть</th></tr><tr><td>if + Past Perfect (had + V3)</td><td>would / could / might + have + V3</td></tr></table><p><i>If she had studied, she would have passed.</i> — Если бы она училась, она бы сдала.</p><p><b>Mixed conditionals</b> смешивают времена:</p><ul><li>прошлое условие, настоящий результат: <i>If I had taken the job, I would be rich now.</i> — Если бы я взял эту работу, я был бы сейчас богат.</li><li>настоящее условие, прошлый результат: <i>If he were more careful, he wouldn't have broken it.</i> — Будь он аккуратнее, он бы это не сломал.</li></ul><p>Можно использовать инверсию: <i>Had I known, I would have called.</i> — Знай я, я бы позвонил. Предлог <i>without</i> тоже заменяет if-часть: <i>Without you, I wouldn't have finished.</i> — Без тебя я бы не закончил.</p><p><i>If we had left earlier, we wouldn't have missed the train.</i> — Если бы мы выехали раньше, мы бы не опоздали на поезд.</p><p><b>Частая ошибка:</b> говорить <i>If I would have known</i>. После if нельзя ставить would: правильно <i>If I had known</i>. Русское «бы» есть в обеих частях, а в английском только в главной.</p>","ex":[{"q":"If I ___ the alarm, I wouldn't have been late.","a":"had heard","o":["heard","would have heard","had heard","have heard"],"t":"Если бы я услышал будильник, я бы не опоздал.","e":"В if-части third conditional нужен Past Perfect: had heard."},{"q":"She would have passed the exam if she ___ harder.","a":"had studied","o":["studied","would study","would have studied","had studied"],"t":"Она бы сдала экзамен, если бы училась усерднее.","e":"После if ставится Past Perfect, would в if-части не используется."},{"q":"If we had left earlier, we ___ the train.","a":"wouldn't have missed","o":["wouldn't miss","didn't miss","hadn't missed","wouldn't have missed"],"t":"Если бы мы выехали раньше, мы бы не опоздали на поезд.","e":"В главной части third conditional: would + have + V3."},{"q":"___ you told me about the problem, I would have helped.","a":"Had","o":["Have","Would","Did","Had"],"t":"Скажи вы мне о проблеме, я бы помог.","e":"Инверсия вместо if: Had you told = If you had told."},{"q":"If he hadn't lost his passport, he ___ in Rome now.","a":"would be","o":["would have been","will be","had been","would be"],"t":"Если бы он не потерял паспорт, он был бы сейчас в Риме.","e":"Mixed conditional: прошлое условие, результат в настоящем (now), поэтому would + V1."},{"q":"If I ___ medicine, I would be a doctor now.","a":"had studied","o":["studied","would study","would have studied","had studied"],"t":"Если бы я изучал медицину, я был бы сейчас врачом.","e":"Условие относится к прошлому, поэтому Past Perfect; результат в настоящем."},{"q":"I wouldn't be so tired today if I ___ to bed so late last night.","a":"hadn't gone","o":["didn't go","wouldn't go","haven't gone","hadn't gone"],"t":"Я бы не был так уставшим сегодня, если бы не лёг вчера так поздно.","e":"Last night - прошлое, значит в if-части Past Perfect."},{"q":"If she weren't so shy, she ___ the job offer last week.","a":"would have accepted","o":["would accept","had accepted","accepted","would have accepted"],"t":"Если бы она не была такой застенчивой, она бы приняла предложение о работе на прошлой неделе.","e":"Условие о постоянном качестве сейчас (weren't), результат в прошлом (last week): would have + V3."},{"q":"If you had taken a taxi, you ___ on time.","a":"would have arrived","o":["would arrive","had arrived","arrived","would have arrived"],"t":"Если бы вы взяли такси, вы бы приехали вовремя.","e":"Third conditional: would have + V3 в главной части."},{"q":"Without your help, I ___ the project.","a":"wouldn't have finished","o":["wouldn't finish","hadn't finished","didn't finish","wouldn't have finished"],"t":"Без твоей помощи я бы не закончил проект.","e":"Without заменяет if-часть, а в главной части нужно would have + V3."},{"q":"If they ___ the contract yesterday, they wouldn't be in trouble now.","a":"had read","o":["read","would have read","have read","had read"],"t":"Если бы они прочитали договор вчера, у них сейчас не было бы проблем.","e":"Прошлое условие требует Past Perfect, would после if не ставится."},{"q":"He ___ so stressed now if he had started the project earlier.","a":"wouldn't be","o":["wouldn't have been","won't be","hadn't been","wouldn't be"],"t":"Он не был бы сейчас так напряжён, если бы начал проект раньше.","e":"Слово now указывает на настоящий результат: would + V1."},{"q":"If my parents hadn't moved to Canada, I ___ English so well now.","a":"wouldn't speak","o":["wouldn't have spoken","didn't speak","wouldn't spoke","wouldn't speak"],"t":"Если бы мои родители не переехали в Канаду, я бы сейчас не говорил так хорошо по-английски.","e":"Результат относится к настоящему (now): would not + V1."},{"q":"I'd have called you if I ___ your number.","a":"hadn't lost","o":["didn't lose","wouldn't lose","haven't lost","hadn't lost"],"t":"Я бы позвонил тебе, если бы не потерял твой номер.","e":"I'd have called - third conditional, в if-части Past Perfect."},{"q":"If I ___ known you were coming, I'd have baked a cake.","a":"had","o":["have","would have","would","had"],"t":"Если бы я знал, что ты придёшь, я бы испёк торт.","e":"Past Perfect образуется с had: had known."}]},{"id":"b2-wish-if-only-would-rather","level":"B2","title":"Wish, if only, would rather, it's time","summary":"Сожаления, желания и «пора бы уже» в английском","rule":"<p>Эти конструкции описывают нереальную ситуацию. Время глагола «сдвигается» назад.</p><table><tr><th>Значение</th><th>Форма</th></tr><tr><td>сожаление о настоящем</td><td>wish / if only + Past Simple</td></tr><tr><td>сожаление о прошлом</td><td>wish / if only + Past Perfect</td></tr><tr><td>раздражение, желание перемен</td><td>wish / if only + would + V1</td></tr><tr><td>предпочтение (другой человек)</td><td>would rather + Past Simple</td></tr><tr><td>предпочтение (я сам)</td><td>would rather + V1 (без to)</td></tr><tr><td>«давно пора»</td><td>it's (high) time + Past Simple</td></tr></table><ul><li><i>I wish I had more free time.</i> — Жаль, что у меня мало свободного времени.</li><li><i>If only I had listened to you!</i> — Если бы я только тебя послушал!</li><li><i>I wish you would stop shouting.</i> — Перестань, пожалуйста, кричать.</li><li><i>I'd rather you didn't smoke here.</i> — Я бы предпочёл, чтобы вы здесь не курили.</li><li><i>It's time we went home.</i> — Нам пора идти домой.</li><li><i>I wish I were taller.</i> — Хотел бы я быть выше. (were для всех лиц)</li></ul><p><b>Частая ошибка:</b> после wish ставят настоящее время: <i>I wish I have</i>. Нужно <i>I wish I had</i>. Также путают <i>It's time to go</i> (пора идти) и <i>It's time you went</i> (тебе давно пора идти).</p>","ex":[{"q":"I wish I ___ more free time.","a":"had","o":["have","would have","had had","had"],"t":"Жаль, что у меня нет больше свободного времени.","e":"Сожаление о настоящем: wish + Past Simple."},{"q":"She wishes she ___ the invitation last week.","a":"hadn't refused","o":["didn't refuse","wouldn't refuse","doesn't refuse","hadn't refused"],"t":"Она жалеет, что отказалась от приглашения на прошлой неделе.","e":"Сожаление о прошлом: wish + Past Perfect."},{"q":"I wish you ___ stop interrupting me!","a":"would","o":["will","did","had","would"],"t":"Хотел бы я, чтобы ты перестал меня перебивать!","e":"Для раздражения чужим поведением используем wish + would."},{"q":"If only I ___ taller!","a":"were / was","o":["were","am","would be","had been"],"t":"Если бы я только был выше!","e":"После if only для настоящего ставим Past Simple; с I допустимы were и was."},{"q":"I'd rather you ___ smoke here.","a":"didn't","o":["don't","wouldn't","won't","didn't"],"t":"Я бы предпочёл, чтобы вы здесь не курили.","e":"Would rather + другое лицо требует Past Simple."},{"q":"I'd rather ___ at home tonight than go out.","a":"stay","o":["to stay","staying","stayed","stay"],"t":"Я лучше останусь дома сегодня вечером, чем пойду гулять.","e":"После would rather (если подлежащее то же) идёт V1 без to."},{"q":"It's high time we ___ the problem.","a":"solved","o":["solve","will solve","to solve","solved"],"t":"Давно пора решить эту проблему.","e":"После it's (high) time ставится Past Simple."},{"q":"If only we ___ the tickets earlier, we'd be at the concert now.","a":"had booked","o":["booked","would book","have booked","had booked"],"t":"Если бы мы только раньше заказали билеты, мы были бы сейчас на концерте.","e":"Сожаление о прошлом: if only + Past Perfect."},{"q":"He wishes he ___ so rude to her yesterday.","a":"hadn't been","o":["weren't","wouldn't be","wasn't","hadn't been"],"t":"Он жалеет, что вчера был с ней так груб.","e":"Yesterday - прошлое, значит нужен Past Perfect.
