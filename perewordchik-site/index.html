t to me was a doctor.","a":"sitting","o":["sitting","sat","sitted","to sit"],"t":"Женщина, сидевшая рядом со мной, была врачом.","e":"Активное определительное причастие: who was sitting = sitting."},{"q":"The letters ___ yesterday still haven't arrived.","a":"sent","o":["sent","sending","having sent","sends"],"t":"Письма, отправленные вчера, всё ещё не пришли.","e":"Письма были отправлены, пассивное значение: V3."},{"q":"___ what to do, she asked her friend.","a":"Not knowing","o":["Not knowing","Knowing not","Not known","Not to know"],"t":"Не зная, что делать, она спросила подругу.","e":"Отрицание ставится перед причастием: Not knowing."},{"q":"___ from the top, the town looks tiny.","a":"Seen","o":["Seen","Seeing","Having seen","To see"],"t":"Если смотреть сверху, город кажется крошечным.","e":"Город видят, значение пассивное: Seen."},{"q":"He ran out of the room, ___ the door behind him.","a":"slamming","o":["slamming","slammed","to slam","slam"],"t":"Он выбежал из комнаты, хлопнув дверью.","e":"Сопутствующее действие выражается активным V-ing."},{"q":"With the children ___ to bed, we finally relaxed.","a":"put","o":["put","putting","to put","puts"],"t":"Когда дети были уложены спать, мы наконец расслабились.","e":"Дети не сами ложатся, поэтому пассивное причастие put."},{"q":"___ the exam, he celebrated with friends.","a":"Having passed","o":["Having passed","Passed","Being passed","To pass"],"t":"Сдав экзамен, он отпраздновал с друзьями.","e":"Сдача экзамена предшествовала празднованию: Having + V3."},{"q":"___ warned about the storm, we stayed at home.","a":"Having been","o":["Having been","Having","Been","Be"],"t":"Будучи предупреждёнными о буре, мы остались дома.","e":"Пассив в прошлом: Having been + V3."},{"q":"Although ___ tired, he kept working.","a":"feeling","o":["feeling","felt","to feel","feels"],"t":"Хотя он чувствовал усталость, он продолжал работать.","e":"После союза although можно использовать V-ing: Although feeling."},{"q":"___ in the 12th century, the castle is now a museum.","a":"Built","o":["Built","Building","Having build","To build"],"t":"Построенный в XII веке, замок теперь музей.","e":"Замок был построен, значит пассивное причастие Built."},{"q":"Anyone ___ to join should sign up.","a":"wishing","o":["wishing","wished","to wish","wishes"],"t":"Всем желающим присоединиться нужно записаться.","e":"Активное определительное причастие: who wishes = wishing."}]},{"id":"c1-subjunctive","level":"C1","title":"Сослагательное наклонение (subjunctive)","summary":"insist that he attend, If I were, I wish, as if, it's time","rule":"<p>В английском есть несколько случаев, когда используется <b>сослагательное наклонение</b>. Его формы почти не отличаются от обычных, поэтому важно знать ситуации.</p><p><b>1. Mandative subjunctive.</b> После глаголов и прилагательных со значением требования, совета, важности глагол стоит в <b>базовой форме без -s и без to</b> для всех лиц: <i>insist, demand, suggest, recommend, propose, essential, vital, important</i>.</p><ul><li><i>She insisted that he attend the meeting.</i></li><li><i>It is essential that she be on time.</i></li><li><i>It was suggested that the meeting be postponed.</i></li></ul><p><b>2. Were-subjunctive.</b> В нереальных условиях и сравнениях с <i>be</i> используется <b>were</b> для всех лиц: <i>If I were you...; as if she were the boss</i>.</p><p><b>3. Нереальное желание и сравнение:</b></p><table><tr><th>Конструкция</th><th>Форма</th><th>Пример</th></tr><tr><td>wish / if only (настоящее)</td><td>Past Simple</td><td><i>I wish I had more time.</i></td></tr><tr><td>wish / if only (прошлое)</td><td>Past Perfect</td><td><i>If only I had told her.</i></td></tr><tr><td>wish + would</td><td>раздражение</td><td><i>I wish you would stop.</i></td></tr><tr><td>as if / as though</td><td>Past Simple</td><td><i>He talks as if he knew.</i></td></tr><tr><td>it's (high) time; would rather + лицо</td><td>Past Simple</td><td><i>It's time you started. I'd rather you didn't.</i></td></tr></table><p>Устойчивые выражения: <i>Be that as it may; Come what may; Long live...</i> <b>Частая ошибка:</b> «He insisted that she attends» вместо <i>attend</i>.</p>","ex":[{"q":"The manager insisted that every employee ___ the training.","a":"attend","o":["attend","attends","attended","would attend"],"t":"Руководитель настоял, чтобы каждый сотрудник прошёл обучение.","e":"После insist that используется базовая форма глагола без -s."},{"q":"It is essential that she ___ on time.","a":"be","o":["be","is","was","will be"],"t":"Крайне важно, чтобы она пришла вовремя.","e":"После прилагательного essential в mandative subjunctive используется be."},{"q":"If I ___ you, I would accept the offer.","a":"were","o":["were","was","am","had been"],"t":"На твоём месте я бы принял предложение.","e":"В нереальном условии принято were для всех лиц."},{"q":"I wish I ___ more time to study.","a":"had","o":["had","have","would have","has"],"t":"Жаль, что у меня нет больше времени на учёбу.","e":"Желание о настоящем выражается Past Simple: I wish I had."},{"q":"He talks as if he ___ everything about it.","a":"knew","o":["knew","knows","know","would know"],"t":"Он говорит так, будто знает об этом всё.","e":"As if + Past Simple показывает нереальность сравнения."},{"q":"It's high time you ___ looking for a job.","a":"started","o":["started","start","will start","would start"],"t":"Давно пора начать искать работу.","e":"После It's (high) time используется Past Simple."},{"q":"I'd rather you ___ smoke in here.","a":"didn't","o":["didn't","don't","not","won't"],"t":"Я бы предпочёл, чтобы вы здесь не курили.","e":"Would rather + лицо требует Past Simple: didn't."},{"q":"If only I ___ her the truth yesterday!","a":"had told","o":["had told","told","would tell","have told"],"t":"Если бы только я вчера сказал ей правду!","e":"Сожаление о прошлом выражается Past Perfect: had told."},{"q":"The doctor recommended that he ___ more rest.","a":"get","o":["get","gets","got","getting"],"t":"Врач рекомендовал ему больше отдыхать.","e":"После recommend that — базовая форма: get."},{"q":"I wish you ___ stop interrupting me.","a":"would","o":["would","will","did","can"],"t":"Хотел бы я, чтобы ты перестал меня перебивать.","e":"Wish + would выражает недовольство чужим поведением."},{"q":"Be that as it ___, we must go on.","a":"may","o":["may","will","is","can"],"t":"Как бы то ни было, мы должны продолжать.","e":"Устойчивое выражение Be that as it may."},{"q":"It was suggested that the meeting ___ postponed.","a":"be","o":["be","was","is","were"],"t":"Было предложено перенести собрание.","e":"После suggested that используется be в сослагательном наклонении."},{"q":"She acts as though she ___ the boss, but she is only an intern.","a":"were","o":["were","is","will be","has been"],"t":"Она ведёт себя так, будто она начальница, а на деле всего лишь стажёр.","e":"Нереальное сравнение с be требует were."},{"q":"If it ___ not been for his help, I would have failed.","a":"had","o":["had","were","would","has"],"t":"Если бы не его помощь, я бы провалился.","e":"Третий тип условия: If it had not been for..."},{"q":"I demand that he ___ at once.","a":"leave","o":["leave","leaves","left","will leave"],"t":"Я требую, чтобы он немедленно ушёл.","e":"После demand that — базовая форма без -s."}]}];
/* Grammar: rules + exercises. Data in GR (array of topics). Progress in S.gx["topic:i"]={ok,bad,last}. */
let gs={lvl:"all",topic:null,run:null};
const GL=["A1","A2","B1","B2","C1"];
const gKey=(t,i)=>t+":"+i;
const gTopic=id=>GR.find(t=>t.id===id);
function gStat(t){let d=0,ok=0,bad=0,weak=0;t.ex.forEach((x,i)=>{const r=(S.gx||{})[gKey(t.id,i)];if(r){d++;ok+=r.ok;bad+=r.bad;if(r.last===0)weak++}});return{d,n:t.ex.length,ok,bad,weak}}
function gClean(h){const ok=/^(p|ul|ol|li|b|i|table|tr|th|td|br)$/i;return String(h).replace(/<\/?([a-z0-9]+)[^>]*>/gi,(m,t)=>ok.test(t)?(m[1]==="/"?"</"+t.toLowerCase()+">":"<"+t.toLowerCase()+">"):"")}
function gWeakList(){const o=[];GR.forEach(t=>t.ex.forEach((x,i)=>{const r=(S.gx||{})[gKey(t.id,i)];if(r&&r.last===0)o.push([t.id,i])}));return o}
function vGrammar(){if(gs.run)return gRun();if(gs.topic)return gTopicView(gTopic(gs.topic));
 const weak=gWeakList(),tot=GR.reduce((a,t)=>a+t.ex.length,0),done=GR.reduce((a,t)=>a+gStat(t).d,0);
 const list=GR.filter(t=>gs.lvl==="all"||t.level===gs.lvl);
 return `<section style="display:grid;gap:16px"><div><h2>Грамматика</h2><p class="muted">Короткие правила и упражнения с пропусками. Выберите тему, прочитайте правило и потренируйтесь.</p></div>
 <div class="card" style="display:grid;gap:10px"><div class="row" style="justify-content:space-between"><span class="small muted">Пройдено упражнений: ${done} из ${tot}</span>${weak.length?`<button class="btn primary" data-act="gweak">Повторить ошибки (${weak.length})</button>`:""}</div><div class="prog"><i class="m" style="width:${done/tot*100}%"></i></div></div>
 <div class="chips">${["all",...GL].map(l=>`<button class="chip" data-act="glvl" data-l="${l}" aria-pressed="${gs.lvl===l}">${l==="all"?"Все":l}</button>`).join("")}</div>
 <div class="grid">${list.map(t=>{const s=gStat(t),p=s.ok+s.bad?Math.round(s.ok/(s.ok+s.bad)*100):0;return `<button class="card" style="text-align:left;display:grid;gap:8px" data-act="gopen" data-id="${t.id}"><span class="tag">${t.level}</span><b>${esc(t.title)}</b><span class="small muted">${esc(t.summary)}</span><div class="prog"><i class="m" style="width:${s.d/s.n*100}%"></i></div><span class="small muted">${s.d}/${s.n} упражнений${s.ok+s.bad?" · точность "+p+"%":""}</span></button>`}).join("")}</div></section>`}
function gTopicView(t){const s=gStat(t);
 return `<section style="display:grid;gap:16px"><div class="row"><button class="btn" data-act="gback">← Темы</button></div>
 <div><span class="tag">${t.level}</span><h2>${esc(t.title)}</h2></div>
 <div class="card grule">${gClean(t.rule)}</div>
 <div class="card" style="display:grid;gap:10px"><b>Тренировка</b><span class="small muted">${t.ex.length} упражнений · пройдено ${s.d}${s.weak?` · ошибок для повторения: ${s.weak}`:""}</span>
 <div class="row" style="flex-wrap:wrap"><button class="btn primary" data-act="gstart" data-m="choice">Выбрать ответ</button><button class="btn primary" data-act="gstart" data-m="write">Вписать ответ</button>${s.weak?`<button class="btn" data-act="gstart" data-m="weak">Только ошибки</button>`:""}</div></div></section>`}
function gStart(tid,mode,items){const t=tid?gTopic(tid):null;let q=items;
 if(!q){q=t.ex.map((x,i)=>[t.id,i]);if(mode==="weak")q=q.filter(([a,i])=>((S.gx||{})[gKey(a,i)]||{}).last===0)}
 q=shuffle(q);if(!q.length)return;gs.run={tid,mode:mode==="weak"?"choice":mode,q,i:0,ok:0,bad:[],ans:null,val:""};render();scrollTo(0,0)}
function gCur(){const r=gs.run,[tid,i]=r.q[r.i],t=gTopic(tid);return{t,i,x:t.ex[i]}}
function gRun(){const r=gs.run;
 if(r.i>=r.q.length){const n=r.q.length;return `<section class="card" style="display:grid;gap:14px;text-align:center"><h2>Готово!</h2><p style="font-size:1.3rem"><b>${r.ok}</b> из ${n} верно</p><div class="row" style="justify-content:center;flex-wrap:wrap">${r.bad.length?`<button class="btn primary" data-act="gretry">Повторить ошибки (${r.bad.length})</button>`:""}<button class="btn" data-act="gexit">К теме</button></div></section>`}
 const{t,x}=gCur(),a=r.ans,parts=x.q.split("___"),alts=x.a.split(" / ");
 const blank=a?`<b class="${a.ok?"good":"bad"}" style="color:var(--${a.ok?"ok":"bad"})">${esc(a.ok?(a.val||x.a):x.a.split(" / ")[0])}</b>`:`<span style="display:inline-block;min-width:3.5em;border-bottom:2px solid var(--accent)">&nbsp;</span>`;
 const body=r.mode==="choice"?`<div class="opts">${x.o.map((o,k)=>{const cls=!a?"":alts.some(z=>z.toLowerCase()===o.toLowerCase())?" good":(a.val===o?" wrong":"");return `<button class="opt${cls}" data-act="gpick" data-v="${esc(o)}" ${a?"disabled":""}><span class="muted small">${k+1}</span>  ${esc(o)}</button>`}).join("")}</div>`
  :`<div style="display:grid;gap:10px"><input id="gans" class="inp${a?a.ok?" good":" bad":""}" autocomplete="off" autocapitalize="off" spellcheck="false" value="${esc(a?a.val:r.val)}" ${a?"disabled":""} placeholder="впишите пропущенное">${a?"":`<div class="row" style="justify-content:center"><button class="btn primary" data-act="gcheck">Проверить</button></div>`}</div>`;
 return `<section style="display:grid;gap:16px;max-width:640px;margin:0 auto"><div class="row" style="justify-content:space-between"><button class="btn kbtn" data-act="gexit">✕ Выйти</button><span class="small muted">${t.level} · ${esc(t.title)} · ${r.i+1}/${r.q.length}</span></div>
 <div class="prog"><i class="m" style="width:${r.i/r.q.length*100}%"></i></div>
 <div class="card" style="font-size:1.35rem;line-height:1.6;text-align:center">${esc(parts[0])}${blank}${esc(parts[1]||"")}</div>${body}
 ${a?`<div class="card" style="display:grid;gap:6px"><div class="fb ${a.ok?"good":"bad"}">${a.ok?"Верно!":"Правильный ответ: "+esc(x.a.replace(/ \/ /g," или "))}</div><div>${esc(x.e)}</div><div class="muted small">${esc(x.q.replace("___",x.a.split(" / ")[0]))} — ${esc(x.t)}</div><div class="row"><button class="btn primary" data-act="gnext">Дальше (Enter)</button></div></div>`:""}</section>`}
function gAnswer(val){const r=gs.run;if(r.ans)return;const{t,i,x}=gCur(),ok=x.a.split(" / ").some(z=>canon(z)===canon(val));
 r.ans={ok,val};if(ok)r.ok++;else r.bad.push(r.q[r.i]);
 S.gx=S.gx||{};const k=gKey(t.id,i),o=S.gx[k]||{ok:0,bad:0,last:1};if(ok)o.ok++;else o.bad++;o.last=ok?1:0;S.gx[k]=o;logAct(ok);save();render();
 const f=$("#gans");if(f&&!r.ans)f.focus()}
function gAct(a,b){switch(a){
 case"glvl":gs.lvl=b.dataset.l;render();return 1;
 case"gopen":gs.topic=b.dataset.id;render();scrollTo(0,0);return 1;
 case"gback":gs.topic=null;render();return 1;
 case"gstart":gStart(gs.topic,b.dataset.m);return 1;
 case"gweak":gStart(null,"choice",gWeakList());return 1;
 case"gpick":gAnswer(b.dataset.v);return 1;
 case"gcheck":{const f=$("#gans");gs.run.val=f.value;if(f.value.trim())gAnswer(f.value);return 1}
 case"gnext":gs.run.i++;gs.run.ans=null;gs.run.val="";render();{const f=$("#gans");if(f)f.focus()}return 1;
 case"gretry":{const r=gs.run;gStart(r.tid,r.mode,r.bad.slice());return 1}
 case"gexit":gs.run=null;render();return 1}return 0}
document.addEventListener("keydown",e=>{if(view!=="grammar"||!gs.run||sess)return;const r=gs.run;
 if(e.key==="Escape"){gs.run=null;render();return}
 if(r.i>=r.q.length)return;
 if(r.mode==="choice"&&!r.ans&&/^[1-4]$/.test(e.key)){const o=gCur().x.o[+e.key-1];if(o){gAnswer(o)}return}
 if(e.key==="Enter"&&e.target.tagName!=="BUTTON"){e.preventDefault();if(r.ans){gAct("gnext")}else if(r.mode==="write"){const f=$("#gans");if(f&&f.value.trim())gAnswer(f.value)}}});
document.addEventListener("input",e=>{if(e.target.id==="gans"&&gs.run)gs.run.val=e.target.value});
let armReset=false;
function quit(){sess=null;$("#study").hidden=true;document.body.style.overflow="";render()}
function pairClick(id,side){const c=sess.cur;if(!c||c.done[id])return;
 if(!c.sel||c.sel.side===side){c.sel={id,side};drawStudy();return}
 if(c.sel.id===id){c.done[id]=true;const ok=!c.miss[id];if(ok)sess.ok++;else sess.bad.push(id);grade(id,ok,false);c.sel=null;drawStudy();
  if(c.items.every(w=>c.done[w.id])){sess.i+=5;setTimeout(()=>{if(sess){nextQ();drawStudy()}},450)}}
 else{c.miss[c.sel.id]=true;c.miss[id]=true;c.flash=id+side;c.sel=null;drawStudy();setTimeout(()=>{if(sess&&sess.cur===c){c.flash=null;drawStudy()}},500)}}
function addSet(){const name=$("#cn").value.trim(),w=[];
 $("#cw").value.split("\n").forEach(l=>{const p=l.split(/\s[-—–]\s|\t|;/).map(x=>x.trim());if(p[0]&&p[1])w.push([p[0],p[1],p[2]||""])});
 if(!name||!w.length){$("#cmsg").textContent="Укажите название и хотя бы одно слово в формате «слово - перевод».";return}
 S.custom.push({id:"c"+Date.now(),n:name,w});save();filter="custom";render()}
document.addEventListener("click",e=>{
 const nb=e.target.closest("#nav button");if(nb){view=nb.dataset.v;openSet=null;gs.topic=null;gs.run=null;location.hash=view;render();scrollTo(0,0);return}
 const b=e.target.closest("[data-act]");if(!b)return;const a=b.dataset.act,c=sess&&sess.cur;
 switch(a){
 case"open":openSet=b.dataset.id;view="sets";render();scrollTo(0,0);break;
 case"back":openSet=null;render();break;
 case"filter":filter=b.dataset.f;render();break;
 case"start":start(b.dataset.m,idsOf(getSet(openSet)));break;
 case"review":start("review",dueIds());break;
 case"say":speak(b.dataset.t);break;
 case"addset":addSet();break;
 case"delset":{const id=b.dataset.id;S.custom=S.custom.filter(x=>x.id!==id);Object.keys(S.words).forEach(k=>{if(k.startsWith(id+":"))delete S.words[k]});openSet=null;save();render();break}
 case"reset":if(!armReset){armReset=true;b.textContent="Нажмите ещё раз";setTimeout(()=>{armReset=false;if(b.isConnected)b.textContent="Сбросить прогресс"},4000)}else{armReset=false;S.words={};S.log={};S.known={};S.gx={};S.epoch=(S.epoch||0)+1;save();render()}break;
 case"flip":if(c){c.flip=true;drawStudy()}break;
 case"rate":rateCard(b.dataset.q);break;
 case"fav":{const id=b.dataset.id;if(S.fav[id])delete S.fav[id];else S.fav[id]=true;save();if(sess)drawStudy();else render();break}
 case"known":{const id=b.dataset.id;setKnown(id,!isKnown(id));render();break}
 case"mark":markKnown(b.dataset.v==="1");break;
 case"skipknown":skipKnown();break;
 case"bulk":{const k=b.dataset.k;if(armBulk!==k){armBulk=k;const t=b.textContent;b.textContent="Нажмите ещё раз";setTimeout(()=>{if(armBulk===k){armBulk="";if(b.isConnected)b.textContent=t}},4000);break}armBulk="";const ids=idsOf(getSet(openSet));if(k==="new")ids.forEach(i=>{if(!S.words[i]&&!isKnown(i))setKnown(i,true)});else ids.forEach(i=>{if(isKnown(i))setKnown(i,false)});render();break}
 case"more":{const l=S.log[dkey()]||(S.log[dkey()]={n:0,ok:0});l.extra=(l.extra||0)+10;flash="";save();render();break}
 case"pick":c.pick=+b.dataset.i;answer(c.opts[c.pick].ok?"ok":"bad");break;
 case"check":checkAns();break;
 case"hint":c.val=$("#ans").value;c.hint=c.type==="cloze"?"Начальная форма: "+c.w.en:c.w.en.replace(/[^ ]/g,(ch,i)=>i?"•":ch);drawStudy();break;
 case"next":advance();break;
 case"retry":start(sess.mode==="review"?"choice":sess.mode,sess.bad);break;
 case"quit":quit();break;
 case"pp":pairClick(b.dataset.id,b.dataset.s);break;
 default:if(!articleAct(a,b)&&!gAct(a,b))extraAct(a)}});
document.addEventListener("change",e=>{if(e.target.dataset.act==="goal"){S.goal=+e.target.value;save();render()}if(e.target.dataset.act==="newlimit"){S.newLimit=+e.target.value;save();render()}});
document.addEventListener("keydown",e=>{if(!sess||$("#study").hidden)return;const c=sess.cur;if(!c||e.target.tagName==="BUTTON")return;
 if(e.key==="Escape"){quit();return}
 if(c.type==="choice"&&!c.answered&&/^[1-4]$/.test(e.key)&&c.opts[+e.key-1]){c.pick=+e.key-1;answer(c.opts[c.pick].ok?"ok":"bad");return}
 if(c.type==="known"&&/^[12]$/.test(e.key)){markKnown(e.key==="1");return}
 if(c.type==="cards"&&c.flip&&/^[1-4]$/.test(e.key)){rateCard(["again","hard","good","easy"][+e.key-1]);return}
 if(e.key==="Enter"){e.preventDefault();if(c.answered)advance();else if(c.type==="write"||c.type==="listen"||c.type==="cloze"){checkAns()}else if((c.type==="cards"||c.type==="known")&&!c.flip){c.flip=true;drawStudy()}}});
$("#theme").onclick=()=>{const d=document.documentElement,cur=d.dataset.theme||(matchMedia("(prefers-color-scheme:dark)").matches?"dark":"light"),n=cur==="dark"?"light":"dark";d.dataset.theme=n;try{localStorage.setItem("wc-theme",n)}catch(e){}};
try{const t=localStorage.getItem("wc-theme");if(t)document.documentElement.dataset.theme=t}catch(e){}
const h=location.hash.slice(1);if(["home","sets","stats","article","grammar"].includes(h))view=h;
window.addEventListener("hashchange",()=>{const h=location.hash.slice(1);if(["home","sets","stats","article","grammar"].includes(h)&&!sess){view=h;openSet=null;render()}});
render();
(async()=>{try{const c=window.claude;if(!c||!c.use)return;const[db,user]=await Promise.all([c.use("db"),c.use("user")]);if(!db||!user)return;const id=await user.id();if(!id)return;
 const ref=db.doc("data/users/"+id+"/profile"),snap=await ref.get();dbRef=ref;
 if(snap.exists){const r=JSON.parse(snap.data().json);if(r.t>S.t){S=Object.assign({words:{},custom:[],log:{},goal:20,newLimit:15,fav:{},known:{},gx:{},t:0},r);try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}if(!sess)render()}}
 else if(S.t)save()}catch(e){}})();
</script>
