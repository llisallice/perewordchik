<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Wordcurve</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600&family=Unbounded:wght@500;700&display=swap">
<style>
/* Layout: sticky top nav, one centered column (max 880px); cards for sets, full-width study panel. */
:root{--bg:#F4F6FA;--surface:#FFFFFF;--ink:#111B33;--mute:#5B6785;--line:#DDE3EE;--accent:#2D5BFF;--accent-ink:#FFFFFF;--soft:#E8EEFF;--ok:#14935F;--okbg:#DDF5EA;--bad:#D6403A;--badbg:#FBE4E2;
--display:'Unbounded','Onest',system-ui,sans-serif;--body:'Onest',system-ui,-apple-system,'Segoe UI',sans-serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0D1322;--surface:#151D31;--ink:#E8ECF7;--mute:#94A0BD;--line:#26304A;--accent:#6C8CFF;--accent-ink:#0D1322;--soft:#1C2748;--ok:#3DD598;--okbg:#12362B;--bad:#FF7A74;--badbg:#3A1D1F;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0D1322;--surface:#151D31;--ink:#E8ECF7;--mute:#94A0BD;--line:#26304A;--accent:#6C8CFF;--accent-ink:#0D1322;--soft:#1C2748;--ok:#3DD598;--okbg:#12362B;--bad:#FF7A74;--badbg:#3A1D1F;color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:16px/1.5 var(--body);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 48px}
.wrap{max-width:880px;margin:0 auto}
h1,h2,h3{font-family:var(--display);font-weight:500;margin:0;text-wrap:balance;letter-spacing:-.01em}
h2{font-size:1.25rem}h3{font-size:1rem}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--bg);border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;gap:16px;padding-block:12px;flex-wrap:wrap}
.logo{font-family:var(--display);font-weight:700;font-size:1.05rem;display:flex;align-items:center;gap:8px;margin-right:auto}
nav{display:flex;gap:4px;flex-wrap:wrap}
nav button{border:0;background:none;padding:8px 12px;border-radius:8px;color:var(--mute);font-weight:500}
nav button[aria-current="true"]{background:var(--soft);color:var(--accent)}
.icon-btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;width:36px;height:36px;display:grid;place-items:center}
main{padding-top:24px;display:grid;gap:24px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:20px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.muted{color:var(--mute)}.small{font-size:.875rem}
.btn{border:1px solid var(--line);background:var(--surface);padding:10px 16px;border-radius:10px;font-weight:500}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.primary:hover{filter:brightness(1.08)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);padding:6px 12px;border-radius:99px;font-size:.875rem}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.tag{font-size:.75rem;letter-spacing:.06em;text-transform:uppercase;color:var(--mute);font-weight:600}
.prog{height:6px;border-radius:9px;background:var(--line);overflow:hidden;display:flex}
.prog i{display:block;height:100%}
.prog .l{background:var(--accent)}.prog .m{background:var(--ok)}
.setcard{display:grid;gap:10px;text-align:left;cursor:pointer}
.setcard:hover{border-color:var(--accent)}
.big{font-family:var(--display);font-size:2.4rem;line-height:1;font-weight:700}
.hero{display:grid;grid-template-columns:1.3fr 1fr;gap:16px}
@media(max-width:640px){.hero{grid-template-columns:1fr}}
.stat{display:grid;gap:4px}
table{width:100%;border-collapse:collapse}
td,th{text-align:left;padding:10px 8px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:.75rem;letter-spacing:.06em;text-transform:uppercase;color:var(--mute)}
.scroll{overflow-x:auto}
.pill{font-size:.75rem;padding:2px 8px;border-radius:99px;background:var(--soft);color:var(--accent);white-space:nowrap}
.pill.ok{background:var(--okbg);color:var(--ok)}
/* study */
#study{position:fixed;inset:0;z-index:20;background:var(--bg);overflow:auto;padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.sp{max-width:640px;margin:0 auto;display:grid;gap:20px}
.stage{min-height:260px;display:grid;gap:16px;align-content:center;text-align:center}
.word{font-family:var(--display);font-size:clamp(1.6rem,6vw,2.4rem);font-weight:500;overflow-wrap:anywhere}
.ex{font-style:italic;color:var(--mute)}
.opts{display:grid;gap:10px}
.opt{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:14px 16px;text-align:left;font-weight:500}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt.good{background:var(--okbg);border-color:var(--ok);color:var(--ok)}
.opt.wrong{background:var(--badbg);border-color:var(--bad);color:var(--bad)}
.inp{width:100%;padding:14px 16px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-size:1.2rem;text-align:center}
.inp.good{border-color:var(--ok);background:var(--okbg)}.inp.bad{border-color:var(--bad);background:var(--badbg)}
.flip{min-height:220px;cursor:pointer;display:grid;place-items:center;gap:8px;align-content:center}
.pairs{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.fb{min-height:24px;font-weight:600}.fb.good{color:var(--ok)}.fb.bad{color:var(--bad)}
.field{display:grid;gap:6px}
.field input,.field textarea,.field select{padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--surface)}
.curve{width:100%;height:auto}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
<style>body{margin:0}:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}[hidden]{display:none!important}</style>
</head>

const $=s=>document.querySelector(s),KEY="wordcurve-v1";
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const DAY=864e5,INT=[0,20*60e3,DAY,2*DAY,6*DAY,14*DAY,31*DAY];
let S={words:{},custom:[],log:{},goal:20,t:0},view="home",openSet=null,filter="all",dbRef=null,sess=null;
try{const r=localStorage.getItem(KEY);if(r)S=Object.assign(S,JSON.parse(r))}catch(e){}
const allSets=()=>SETS.concat(S.custom.map(c=>({id:c.id,g:"custom",n:c.n,d:"Мой набор",w:c.w})));
const wid=(s,i)=>s.id+":"+i;
const wordOf=id=>{const[sid,i]=id.split(":");const s=allSets().find(x=>x.id===sid);return s&&s.w[i]?{id,en:s.w[i][0],ru:s.w[i][1],ex:s.w[i][2]||""}:null};
const dkey=(t=Date.now())=>{const d=new Date(t);return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")};
let saveT=null;
function save(){S.t=Date.now();try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}
 clearTimeout(saveT);saveT=setTimeout(()=>{if(dbRef)dbRef.set({json:JSON.stringify(S),t:S.t}).catch(()=>{})},1500)}
function logAct(ok){const k=dkey(),l=S.log[k]||(S.log[k]={n:0,ok:0});l.n++;if(ok)l.ok++}
function grade(id,ok,review){const w=S.words[id],now=Date.now();logAct(ok);
 if(ok){if(!w)S.words[id]={s:1,due:now+INT[1],ok:1,bad:0};else{w.ok++;if(review&&w.due<=now){w.s++;w.due=now+(w.s>6?90*DAY:INT[w.s])}}}
 else if(w){w.bad++;if(w.due<=now){w.s=1;w.due=now+INT[1]}}
 save()}
const dueIds=()=>{const n=Date.now();return Object.keys(S.words).filter(i=>S.words[i].due<=n&&wordOf(i))};
const streak=()=>{let n=0,t=Date.now();if(!S.log[dkey(t)])t-=DAY;while(S.log[dkey(t)]){n++;t-=DAY}return n};
const stageOf=id=>{const w=S.words[id];return !w?"new":w.s>=7?"done":"learn"};
function setStats(s){let l=0,m=0;s.w.forEach((_,i)=>{const st=stageOf(wid(s,i));if(st==="learn")l++;if(st==="done")m++});return{l,m,n:s.w.length}}

function vHome(){const due=dueIds(),t=S.log[dkey()]||{n:0,ok:0},pct=Math.min(100,Math.round(t.n/S.goal*100));
 const learning=Object.keys(S.words).filter(i=>S.words[i].s<7).length;
 const next=Object.values(S.words).filter(w=>w.due>Date.now()).sort((a,b)=>a.due-b.due)[0];
 const cont=allSets().map(s=>({s,st:setStats(s)})).filter(x=>x.st.l+x.st.m<x.st.n).sort((a,b)=>(b.st.l+b.st.m)-(a.st.l+a.st.m)).slice(0,3);
 return `<section class="hero"><div class="card" style="display:grid;gap:14px"><span class="tag">Повторение на сегодня</span>
 <div class="big">${due.length}</div><div class="muted">${due.length?plural(due.length,["слово ждёт","слова ждут","слов ждут"])+" повторения по кривой забывания":"Всё повторено."+(next?" Следующее слово — "+fmtWhen(next.due)+".":" Выучите первые слова в наборах.")}</div>
 <div><button class="btn primary" data-act="review" ${due.length?"":"disabled"}>Начать повторение</button></div></div>
 <div class="card" style="display:grid;gap:14px"><span class="tag">Цель дня</span>
 <div class="row" style="justify-content:space-between"><b>${t.n} из ${S.goal} ответов</b><span class="muted small">серия: ${streak()} ${plural(streak(),["день","дня","дней"])}</span></div>
 <div class="prog"><i class="m" style="width:${pct}%"></i></div>
 <label class="row small muted">Цель в день <select id="goal" data-act="goal" class="btn">${[10,20,30,50].map(n=>`<option ${n===S.goal?"selected":""}>${n}</option>`).join("")}</select></label></div></section>
 <section style="display:grid;gap:12px"><h2>Продолжить</h2><div class="grid">${cont.map(x=>setCard(x.s)).join("")||'<p class="muted">Все наборы изучены.</p>'}</div></section>
 <section class="card small muted">Метод Эббингауза: после первого верного ответа слово возвращается через 20 минут, затем через 1, 2, 6, 14 и 31 день. Ошибка в повторении возвращает слово на первый шаг. В статистике видно, как растёт «память» с каждым повтором (${learning} ${plural(learning,["слово","слова","слов"])} в изучении).</section>`}
function setCard(s){const st=setStats(s),p1=st.m/st.n*100,p2=st.l/st.n*100;
 return `<button class="card setcard" data-act="open" data-id="${s.id}"><span class="tag">${s.g==="level"?"Уровень":s.g==="topic"?"Тема":"Мой набор"}</span><h3>${esc(s.n)}</h3><span class="muted small">${esc(s.d)} · ${st.n} ${plural(st.n,["слово","слова","слов"])}</span><div class="prog"><i class="m" style="width:${p1}%"></i><i class="l" style="width:${p2}%"></i></div><span class="small muted">Выучено ${st.m}, в изучении ${st.l}</span></button>`}
function vSets(){const list=allSets().filter(s=>filter==="all"||s.g===filter);
 return `<section style="display:grid;gap:14px"><h2>Наборы слов</h2><div class="chips">${[["all","Все"],["level","По уровням"],["topic","По темам"],["custom","Мои"]].map(c=>`<button class="chip" data-act="filter" data-f="${c[0]}" aria-pressed="${filter===c[0]}">${c[1]}</button>`).join("")}</div>

 <section class="card" style="display:grid;gap:12px"><h3>Свой набор</h3><p class="muted small" style="margin:0">Каждое слово с новой строки: слово - перевод - пример (пример необязателен).</p>

function vSet(){const s=allSets().find(x=>x.id===openSet);if(!s){openSet=null;return vSets()}
 const modes=[["cards","Карточки","Слово, перевод и пример"],["choice","Выбор перевода","4 варианта, оба направления"],["write","Написание","Перевод → слово по буквам"],...(canSpeak()?[["listen","На слух","Услышать и записать"]]:[]),["pairs","Пары","Соединить слово и перевод"]];
 return `<section style="display:grid;gap:16px"><div class="row"><button class="btn" data-act="back">← Наборы</button></div>
 <div><span class="tag">${s.g==="level"?"Уровень":s.g==="topic"?"Тема":"Мой набор"}</span><h2 style="margin-top:6px">${esc(s.n)}</h2><p class="muted" style="margin:6px 0 0">${esc(s.d)}</p></div>
 <div class="grid">${modes.map(m=>`<button class="card setcard" data-act="start" data-m="${m[0]}"><h3>${m[1]}</h3><span class="muted small">${m[2]}</span></button>`).join("")}</div>
 <div class="card scroll"><table><thead><tr><th>Слово</th><th>Перевод и пример</th><th>Статус</th></tr></thead><tbody>${s.w.map((w,i)=>{const id=wid(s,i),x=S.words[id];
 const pill=!x?'<span class="pill" style="background:var(--line);color:var(--mute)">новое</span>':x.s>=7?'<span class="pill ok">выучено</span>':`<span class="pill">шаг ${x.s}/6 · ${fmtWhen(x.due)}</span>`;
 return `<tr><td><b>${esc(w[0])}</b> ${spk(w[0])}</td><td>${esc(w[1])}<div class="ex small">${esc(w[2]||"")}</div></td><td>${pill}</td></tr>`}).join("")}</tbody></table></div>
 ${s.g==="custom"?`<div><button class="btn" data-act="delset" data-id="${s.id}">Удалить набор</button></div>`:""}</section>`}
function curve(){const R=[0,1,2,6,14,31],W=640,H=200,P=28,X=t=>P+t/40*(W-P-8),Y=r=>H-22-r*(H-40);let a="",b="";
 for(let t=0;t<=40;t+=.25){const k=R.filter(r=>r<=t).length-1,Sx=2*Math.pow(2.4,k);a+=(t?"L":"M")+X(t).toFixed(1)+" "+Y(Math.exp(-t/2)).toFixed(1);b+=(t?"L":"M")+X(t).toFixed(1)+" "+Y(Math.exp(-(t-R[k])/Sx)).toFixed(1)}
 return `<svg class="curve" viewBox="0 0 ${W} ${H}" role="img" aria-label="Кривая забывания без повторений и с повторениями"><g stroke="var(--line)" stroke-width="1">${[0,.5,1].map(r=>`<line x1="${P}" x2="${W-8}" y1="${Y(r)}" y2="${Y(r)}"/>`).join("")}</g>
 <g fill="var(--mute)" font-size="11" font-family="Onest,sans-serif">${[0,.5,1].map(r=>`<text x="0" y="${Y(r)+4}">${r*100}%</text>`).join("")}${[0,10,20,30,40].map(t=>`<text x="${X(t)-6}" y="${H-4}">${t} д</text>`).join("")}</g>
 <path d="${a}" fill="none" stroke="var(--bad)" stroke-width="2"/><path d="${b}" fill="none" stroke="var(--accent)" stroke-width="2.4"/>
 ${R.slice(1).map(r=>`<circle cx="${X(r)}" cy="${Y(Math.exp(-0))}" r="3.5" fill="var(--accent)"/>`).join("")}</svg>`}
function vStats(){const ks=Object.keys(S.words).filter(wordOf),n=Date.now();let nw=0,lr=0,dn=0;const tot=allSets().reduce((a,s)=>a+s.w.length,0);
 ks.forEach(i=>S.words[i].s>=7?dn++:lr++);nw=tot-lr-dn;
 const M=new Date().setHours(24,0,0,0);const days=[...Array(7)].map((_,d)=>ks.filter(i=>{const t=S.words[i].due;return d===0?t<M:t>=M+(d-1)*DAY&&t<M+d*DAY}).length);
 const mx=Math.max(1,...days);const act=[...Array(14)].map((_,i)=>{const k=dkey(n-(13-i)*DAY);return{k,v:(S.log[k]||{}).n||0,ok:(S.log[k]||{}).ok||0}});const am=Math.max(1,...act.map(a=>a.v));
 const hard=ks.filter(i=>S.words[i].bad>0).sort((a,b)=>S.words[b].bad-S.words[a].bad).slice(0,6);
 const bar=(v,m,l)=>`<div style="display:grid;gap:4px;justify-items:center;flex:1;min-width:0"><span class="small muted">${v}</span><div style="width:100%;height:80px;display:flex;align-items:flex-end"><div style="width:100%;height:${Math.max(3,v/m*100)}%;background:var(--accent);border-radius:4px 4px 0 0;opacity:${v?1:.25}"></div></div><span class="small muted">${l}</span></div>`;
 return `<section style="display:grid;gap:16px"><h2>Статистика</h2>
 <div class="grid"><div class="card stat"><span class="tag">Новые</span><span class="big">${nw}</span></div><div class="card stat"><span class="tag">В изучении</span><span class="big">${lr}</span></div><div class="card stat"><span class="tag">Выучено</span><span class="big">${dn}</span></div><div class="card stat"><span class="tag">Серия дней</span><span class="big">${streak()}</span></div></div>
 <div class="card" style="display:grid;gap:10px"><h3>Повторения на неделю</h3><div class="row" style="flex-wrap:nowrap;align-items:flex-end">${days.map((v,d)=>bar(v,mx,d===0?"сегодня":"+"+d)).join("")}</div></div>
 <div class="card" style="display:grid;gap:10px"><h3>Активность за 14 дней</h3><div class="row" style="flex-wrap:nowrap;align-items:flex-end;gap:4px">${act.map(a=>bar(a.v,am,a.k.slice(8))).join("")}</div></div>
 <div class="card" style="display:grid;gap:10px"><h3>Кривая забывания</h3>${curve()}<p class="small muted" style="margin:0"><span style="color:var(--bad)">Красная линия</span> — запоминание без повторений, <span style="color:var(--accent)">синяя</span> — с повторами через 1, 2, 6, 14 и 31 день. Каждое повторение замедляет забывание.</p></div>
 <div class="card" style="display:grid;gap:10px"><h3>Сложные слова</h3>${hard.map(i=>{const w=wordOf(i);return `<div class="row" style="justify-content:space-between"><span><b>${esc(w.en)}</b> — ${esc(w.ru)}</span><span class="pill">ошибок: ${S.words[i].bad}</span></div>`}).join("")||'<span class="muted small">Ошибок пока нет.</span>'}</div>
 <div class="card row" style="justify-content:space-between"><span class="small muted">Прогресс хранится в этом браузере${dbRef?" и в вашем личном хранилище страницы":""}.</span><button class="btn" data-act="reset">Сбросить прогресс</button></div></section>`}
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const norm=s=>s.toLowerCase().replace(/[.,!?]/g,"").replace(/\s+/g," ").trim();
function start(mode,ids){const q=shuffle(ids.map(wordOf).filter(Boolean));if(!q.length)return;
 sess={mode,q,i:0,ok:0,bad:[],review:mode==="review",cur:null};nextQ();$("#study").hidden=false;document.body.style.overflow="hidden";drawStudy()}
function nextQ(){const s=sess;if(s.mode==="pairs"){const it=s.q.slice(s.i,s.i+5);if(!it.length){s.cur=null;return}
  s.cur={items:it,left:shuffle(it),right:shuffle(it),sel:null,done:{},miss:{},flash:null};return}
 const w=s.q[s.i];if(!w){s.cur=null;return}
 let type=s.mode;if(s.review)type=S.words[w.id]&&S.words[w.id].s>2?"write":"choice";
 const dir=Math.random()<.5?"en":"ru";const pool=[];allSets().forEach(x=>x.w.forEach((y,j)=>{if(y[0]!==w.en&&y[1]!==w.ru)pool.push({en:y[0],ru:y[1]})}));
 const opts=shuffle([w,...shuffle(pool).slice(0,3)]).map(o=>({t:dir==="en"?o.ru:o.en,ok:o===w}));
 s.cur={w,type,dir,opts,answered:false,flip:false,pick:-1};if(type==="listen")setTimeout(()=>speak(w.en),250)}
function drawStudy(){const s=sess,el=$("#study");if(!s)return;
 const total=s.q.length,done=Math.min(s.i,total),title={cards:"Карточки",choice:"Выбор перевода",write:"Написание",listen:"На слух",pairs:"Пары",review:"Повторение"}[s.mode];
 let body="";
 if(!s.cur){body=`<div class="card stage"><h2>Готово</h2><div class="big">${s.ok}<span class="muted" style="font-size:1.2rem"> / ${s.mode==="pairs"||s.mode==="cards"?total:total}</span></div><p class="muted" style="margin:0">${s.bad.length?"Ошибок: "+s.bad.length+". Эти слова вернутся в повторение раньше.":"Без ошибок."}</p><div class="row" style="justify-content:center">${s.bad.length?`<button class="btn" data-act="retry">Повторить ошибки</button>`:""}<button class="btn primary" data-act="quit">Закончить</button></div></div>`}
 else if(s.mode==="pairs"){const c=s.cur;const cell=(w,side)=>{const d=c.done[w.id],sel=c.sel&&c.sel.id===w.id&&c.sel.side===side,fl=c.flash===w.id+side;return `<button class="opt ${d?"good":fl?"wrong":""}" ${d?"disabled":""} data-act="pp" data-id="${w.id}" data-s="${side}" style="${sel?"border-color:var(--accent);background:var(--soft)":""}">${esc(side==="l"?w.en:w.ru)}</button>`};
  body=`<div class="card" style="display:grid;gap:14px"><span class="muted small">Выберите слово и его перевод</span><div class="pairs"><div class="opts">${c.left.map(w=>cell(w,"l")).join("")}</div><div class="opts">${c.right.map(w=>cell(w,"r")).join("")}</div></div></div>`}
 else{const c=s.cur,w=c.w;
  if(c.type==="cards"){body=`<div class="card flip" data-act="flip" tabindex="0" role="button"><div class="word">${esc(w.en)}</div>${spk(w.en)}${c.flip?`<div style="font-size:1.4rem;font-weight:600">${esc(w.ru)}</div><div class="ex">${esc(w.ex)}</div>`:'<div class="muted small">Нажмите, чтобы увидеть перевод</div>'}</div>
   <div class="row" style="justify-content:center"><button class="btn" data-act="again" ${c.flip?"":"disabled"}>Ещё учу</button><button class="btn primary" data-act="know" ${c.flip?"":"disabled"}>Знаю</button></div>`}
  else if(c.type==="choice"){const q=c.dir==="en"?w.en:w.ru;body=`<div class="card stage"><span class="tag">${c.dir==="en"?"Выберите перевод":"Выберите английское слово"}</span><div class="word">${esc(q)}${c.dir==="en"?" "+spk(w.en):""}</div></div>
   <div class="opts">${c.opts.map((o,i)=>`<button class="opt ${c.answered?(o.ok?"good":i===c.pick?"wrong":""):""}" data-act="pick" data-i="${i}" ${c.answered?"disabled":""}>${esc(o.t)}</button>`).join("")}</div>
   ${c.answered?`<div class="ex" style="text-align:center">${esc(w.ex)}</div><button class="btn primary" data-act="next">Дальше</button>`:""}`}
  else{const listen=c.type==="listen";body=`<div class="card stage"><span class="tag">${listen?"Напишите услышанное слово":"Напишите по-английски"}</span><div class="word">${listen?`<button class="btn" data-act="say" data-t="${esc(w.en)}">Прослушать ещё раз</button>`:esc(w.ru)}</div>
   <input class="inp ${c.answered?(c.good?"good":"bad"):""}" id="ans" autocomplete="off" autocapitalize="off" spellcheck="false" ${c.answered?"disabled":""} value="${esc(c.val||"")}" placeholder="${esc(c.hint||"")}">
   <div class="fb ${c.answered?(c.good?"good":"bad"):""}">${c.answered?(c.good?"Верно":"Правильно: "+esc(w.en)):""}</div>${c.answered?`<div class="ex">${esc(w.ex)}</div>`:""}</div>
   <div class="row" style="justify-content:center">${c.answered?`<button class="btn primary" data-act="next">Дальше</button>`:`<button class="btn" data-act="hint">Подсказка</button><button class="btn primary" data-act="check">Проверить</button>`}</div>`}}
 el.innerHTML=`<div class="sp"><div class="row" style="justify-content:space-between"><b>${title}</b><span class="muted small">${s.cur&&s.mode==="pairs"?Math.min(s.i+5,total):done+(s.cur?1:0)} / ${total}</span><button class="btn" data-act="quit">Выйти</button></div><div class="prog"><i class="l" style="width:${Math.min(100,done/total*100)}%"></i></div>${body}</div>`;
 const a=$("#ans");if(a&&!s.cur.answered)a.focus()}
function answer(ok){const s=sess,c=s.cur;c.answered=true;c.good=ok;if(ok)s.ok++;else s.bad.push(c.w.id);grade(c.w.id,ok,s.review);drawStudy()}
function advance(){sess.i++;nextQ();drawStudy()}
let armReset=false;
function quit(){sess=null;$("#study").hidden=true;document.body.style.overflow="";render()}
function pairClick(id,side){const c=sess.cur;if(!c||c.done[id])return;
 if(!c.sel||c.sel.side===side){c.sel={id,side};drawStudy();return}
 if(c.sel.id===id){c.done[id]=true;const ok=!c.miss[id];if(ok)sess.ok++;else sess.bad.push(id);grade(id,ok,false);c.sel=null;drawStudy();
  if(c.items.every(w=>c.done[w.id])){sess.i+=5;setTimeout(()=>{if(sess){nextQ();drawStudy()}},450)}}
 else{c.miss[c.sel.id]=true;c.miss[id]=true;c.flash=id+side;c.sel=null;drawStudy();setTimeout(()=>{if(sess&&sess.cur===c){c.flash=null;drawStudy()}},500)}}
function addSet(){const name=$("#cn").value.trim(),w=[];
 $("#cw").value.split("\n").forEach(l=>{const p=l.split(/\s[-—–]\s|\t|;/).map(x=>x.trim());if(p[0]&&p[1])w.push([p[0],p[1],p[2]||""])});
 if(!name||!w.length){$("#cmsg").textContent="Укажите название и хотя бы одно слово в формате «слово - перевод».";return}
 S.custom.push({id:"c"+Date.now(),n:name,w});save();filter="custom";render()}
document.addEventListener("click",e=>{
 const nb=e.target.closest("#nav button");if(nb){view=nb.dataset.v;openSet=null;location.hash=view;render();scrollTo(0,0);return}
 const b=e.target.closest("[data-act]");if(!b)return;const a=b.dataset.act,c=sess&&sess.cur;
 switch(a){
 case"open":openSet=b.dataset.id;view="sets";render();scrollTo(0,0);break;
 case"back":openSet=null;render();break;
 case"filter":filter=b.dataset.f;render();break;
 case"start":{const s=allSets().find(x=>x.id===openSet);start(b.dataset.m,s.w.map((_,i)=>wid(s,i)));break}

 case"delset":{const id=b.dataset.id;S.custom=S.custom.filter(x=>x.id!==id);Object.keys(S.words).forEach(k=>{if(k.startsWith(id+":"))delete S.words[k]});openSet=null;save();render();break}
 case"reset":if(!armReset){armReset=true;b.textContent="Нажмите ещё раз";setTimeout(()=>{armReset=false;if(b.isConnected)b.textContent="Сбросить прогресс"},4000)}else{armReset=false;S.words={};S.log={};save();render()}break;
 case"flip":if(c){c.flip=true;drawStudy()}break;
 case"know":grade(c.w.id,true,false);sess.ok++;advance();break;
 case"again":sess.q.push(c.w);advance();break;
 case"pick":c.pick=+b.dataset.i;answer(c.opts[c.pick].ok);break;
 case"check":{const v=$("#ans").value;c.val=v;answer(norm(v)===norm(c.w.en));break}
 case"hint":c.val=$("#ans").value;c.hint=c.w.en.replace(/[^ ]/g,(ch,i)=>i?"•":ch);drawStudy();break;
 case"next":advance();break;
 case"retry":start(sess.mode==="review"?"choice":sess.mode,sess.bad);break;

 case"pp":pairClick(b.dataset.id,b.dataset.s);break}});
document.addEventListener("change",e=>{if(e.target.dataset.act==="goal"){S.goal=+e.target.value;save();render()}});
document.addEventListener("keydown",e=>{if(!sess||$("#study").hidden)return;const c=sess.cur;if(!c||e.target.tagName==="BUTTON")return;
 if(e.key==="Escape"){quit();return}
 if(c.type==="choice"&&!c.answered&&/^[1-4]$/.test(e.key)&&c.opts[+e.key-1]){c.pick=+e.key-1;answer(c.opts[c.pick].ok);return}
 if(e.key==="Enter"){e.preventDefault();if(c.answered)advance();else if(c.type==="write"||c.type==="listen"){c.val=$("#ans").value;answer(norm(c.val)===norm(c.w.en))}else if(c.type==="cards"&&!c.flip){c.flip=true;drawStudy()}}});
$("#theme").onclick=()=>{const d=document.documentElement,cur=d.dataset.theme||(matchMedia("(prefers-color-scheme:dark)").matches?"dark":"light"),n=cur==="dark"?"light":"dark";d.dataset.theme=n;try{localStorage.setItem("wc-theme",n)}catch(e){}};
try{const t=localStorage.getItem("wc-theme");if(t)document.documentElement.dataset.theme=t}catch(e){}
const h=location.hash.slice(1);if(["home","sets","stats"].includes(h))view=h;
window.addEventListener("hashchange",()=>{const h=location.hash.slice(1);if(["home","sets","stats"].includes(h)&&!sess){view=h;openSet=null;render()}});
render();
(async()=>{try{const c=window.claude;if(!c||!c.use)return;const[db,user]=await Promise.all([c.use("db"),c.use("user")]);if(!db||!user)return;const id=await user.id();if(!id)return;
 const ref=db.doc("data/users/"+id+"/profile"),snap=await ref.get();dbRef=ref;
 if(snap.exists){const r=JSON.parse(snap.data().json);if(r.t>S.t){S=Object.assign({words:{},custom:[],log:{},goal:20,t:0},r);try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}if(!sess)render()}}
 else if(S.t)save()}catch(e){}})();
</script>
